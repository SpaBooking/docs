              original:
                amountMinor: 11000
                currency: EUR
                currencyExponent: 2
              nights: 7
              occupancy: 2
              visitType:
                id: 66f16191f739705faa020004
                name:
                  cs-CZ: Františkolázeňská léčebná kúra
                  de: Franzensbader Heilkur
            perStay:
