    RoomTypeUnitType:
      type: object
      nullable: true
      required:
        - code
        - label
      properties:
        code:
          type: string
          enum:
            - single
            - double_double
            - double_twin
            - double_either
            - triple
            - quad
            - family
            - suite
            - studio
            - apartment
        label:
          $ref: "#/components/schemas/LocalizedString"
    RoomTypeTier:
      type: object
      nullable: true
      required:
        - code
        - label
      properties:
        code:
          type: string
          enum:
            - economy
            - economy_plus
            - standard
            - standard_plus
            - komfort
            - komfort_plus
            - superior
            - deluxe
        label:
          $ref: "#/components/schemas/LocalizedString"
    RoomTypeOccupancy:
      type: object
      description: Configured room occupancy details. Booking and pricing use standard occupancy; maximum capacity, single use and infant exclusion are informational settings.
      required:
        - standard
        - max
        - singleUse
        - infantsExcluded
      properties:
        standard:
          type: integer
          description: Number of guests included in the room type's base price.
          example: 2
        max:
          type: integer
          nullable: true
          minimum: 1
          description: Configured maximum guest count, including extra beds. At least `standard` when present. Null when unspecified. Does not change booking capacity.
          example: 3
        singleUse:
          type: boolean
          nullable: true
          description: Whether sale to one guest is configured. Null when unspecified. Does not change booking acceptance or price.
          example: true
        infantsExcluded:
          type: boolean
          nullable: true
          description: Whether children aged 0–2 are configured to be excluded from the guest count. Null when unspecified. Does not change booking acceptance or price.
          example: true
    RoomTypeBed:
      type: object
      required:
        - code
        - count
        - label
      properties:
        code:
          type: string
          enum:
            - single
            - double
            - king
            - superking
            - sofa
            - futon
        count:
          type: integer
          minimum: 1
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Singular localized bed label.
    RoomTypeSize:
      type: object
      nullable: true
      description: Floor area in square metres. A fixed area has equal min and max.
      required:
        - min
        - max
      properties:
        min:
          type: number
          exclusiveMinimum: true
          minimum: 0
        max:
          type: number
          exclusiveMinimum: true
          minimum: 0
    RoomTypeRules:
      type: object
      required:
        - smokingAllowed
        - petsAllowed
      properties:
        smokingAllowed:
          type: boolean
          nullable: true
          description: Null when unspecified.
        petsAllowed:
          type: boolean
          nullable: true
          description: Effective pet rule. False unless the hotel allows pets; then the room rule
            applies, with null for an unspecified room rule.
    HotelBuilding:
      type: object
      description: >-
        A physical hotel building. Name and label follow Accept-Language;
        missing or blank translations are null, without a locale fallback.
      required:
        - id
        - name
        - label
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: Stable building id, also returned as roomType.building.id.
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Short building name.
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Short building description; requested translations are null when unset.
    RoomTypeBuilding:
      type: object
      nullable: true
      description: Assigned building, even for a hotel with one building. Null if unassigned or removed.
      required:
        - id
        - name
        - label
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Short building name.
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Descriptive building label.
    RoomTypeAmenityCategoryGroup:
      type: object
      description: Room type amenities in dictionary order. Groups without assigned
        amenities are omitted.
      required:
        - category
        - amenities
      properties:
        category:
          $ref: "#/components/schemas/RoomTypeAmenityCategoryRef"
        amenities:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AmenityValue"
    Pagination:
      type: object
      required: [limit, nextCursor, hasMore, total]
      properties:
        limit:
          type: integer
          example: 25
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to fetch the next page. Null on the last page.
        hasMore:
          type: boolean
        total:
          type: integer
          description: Total number of matching records across all pages.
    RoomTypesList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RoomType"
        pagination:
          $ref: "#/components/schemas/Pagination"
    HotelAddress:
      type: object
      required: [addressLine, city, postalCode, country]
      properties:
        addressLine:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          pattern: "^[a-z]{3}$"
          description: Lowercase ISO 3166-1 alpha-3 country code.
          example: cze
    HotelTimeRange:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "14:00"
        to:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "22:00"
    HotelChildrenPolicy:
      type: object
      required: [allowed, minimumAge]
      properties:
        allowed:
          type: boolean
        minimumAge:
          type: integer
          minimum: 0
          maximum: 18
          nullable: true
    HotelPetFee:
      type: object
      required: [czk, eur]
      properties:
        czk:
          type: number
          minimum: 0
          nullable: true
          description: Per-night fee in Czech koruna major units.
        eur:
          type: number
          minimum: 0
          nullable: true
          description: Per-night fee in euro major units.
    HotelPetPolicy:
      type: object
      required: [allowed, minimumNights, feePerNight, conditions]
      properties:
        allowed:
          type: boolean
        minimumNights:
          type: integer
          minimum: 0
          nullable: true
        feePerNight:
          $ref: "#/components/schemas/HotelPetFee"
        conditions:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized supplementary conditions for guests with pets. Each
            locale value is at most 300 characters.
    HotelAccommodationRules:
      type: object
      required: [checkIn, checkOut, children, pets]
      properties:
        checkIn:
          $ref: "#/components/schemas/HotelTimeRange"
        checkOut:
          $ref: "#/components/schemas/HotelTimeRange"
        children:
          $ref: "#/components/schemas/HotelChildrenPolicy"
        pets:
          $ref: "#/components/schemas/HotelPetPolicy"
    HotelChannelContent:
      type: object
      required: [tagline]
      properties:
        tagline:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized tagline intended for sales channels. Each locale value
            is at most 100 characters.
    HotelMealService:
      type: object
      required:
        - enabled
        - servingTime
        - serviceMethod
        - drinksIncluded
        - drinksNote
      properties:
        enabled:
          type: boolean
        servingTime:
          $ref: "#/components/schemas/HotelTimeRange"
        serviceMethod:
          type: string
          nullable: true
          enum: [buffet, served]
        drinksIncluded:
          type: boolean
        drinksNote:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized note about included drinks. Each locale value is at
            most 200 characters.
      example:
        enabled: true
        servingTime: { from: "07:00", to: "10:00" }
        serviceMethod: buffet
        drinksIncluded: true
        drinksNote:
          cs-CZ: Nealkoholické nápoje jsou v ceně.
          de: Alkoholfreie Getränke sind inklusive.
          en: Soft drinks are included.
          ru: Безалкогольные напитки включены в стоимость.
    HotelMealServices:
      type: object
      required: [breakfast, lunch, dinner]
      properties:
        breakfast:
          $ref: "#/components/schemas/HotelMealService"
        lunch:
          $ref: "#/components/schemas/HotelMealService"
        dinner:
          $ref: "#/components/schemas/HotelMealService"
      example:
        breakfast:
          enabled: true
          servingTime: { from: "07:00", to: "10:00" }
          serviceMethod: buffet
          drinksIncluded: true
          drinksNote:
            cs-CZ: Nealkoholické nápoje jsou v ceně.
            de: Alkoholfreie Getränke sind inklusive.
            en: Soft drinks are included.
            ru: Безалкогольные напитки включены в стоимость.
        lunch:
          enabled: true
          servingTime: { from: "11:30", to: "14:30" }
          serviceMethod: buffet
          drinksIncluded: true
          drinksNote:
            cs-CZ: Voda je zahrnuta v ceně oběda.
            de: Wasser ist im Mittagessen inbegriffen.
            en: Water is included with lunch.
            ru: Вода включена в стоимость обеда.
        dinner:
          enabled: true
          servingTime: { from: "18:00", to: "21:00" }
          serviceMethod: served
          drinksIncluded: false
          drinksNote:
            cs-CZ: Nápoje se hradí samostatně.
            de: Getränke werden separat berechnet.
            en: Drinks are charged separately.
            ru: Напитки оплачиваются отдельно.
    Hotel:
      type: object
      required:
        - id
        - name
        - shortDescription
        - channelContent
        - stars
        - address
        - email
        - phoneNumber
        - url
        - images
        - buildings
        - accommodationRules
        - mealServices
        - indications
        - staffLanguages
        - amenityCategories
        - priceFrom
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          example: 66f16191f739705faa020001
        name:
          allOf:
            - $ref: "#/components/schemas/HotelNameLocalizedString"
          description: >-
            Localized hotel name (plain text). Falls back to the default locale
            (cs-CZ) when a requested locale has no value, so it is never null.
          example:
            cs-CZ: Pawlik
            de: Pawlik-Aquaforum
        shortDescription:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized short hotel description (plain text). Each locale value
            is at most 400 characters.
        channelContent:
          $ref: "#/components/schemas/HotelChannelContent"
        stars:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          example: 4
        address:
          $ref: "#/components/schemas/HotelAddress"
        email:
          type: string
          format: email
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          nullable: true
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        buildings:
          type: array
          description: >-
            All physical buildings in stored order, including buildings with
            no assigned room types. Always included without expand, even for
            a single building; empty when none are configured. Match each id
            to a room type's building.id.
          items:
            $ref: "#/components/schemas/HotelBuilding"
        accommodationRules:
          $ref: "#/components/schemas/HotelAccommodationRules"
        mealServices:
          $ref: "#/components/schemas/HotelMealServices"
        indications:
          type: array
          description: Medical indications the hotel specializes in, in display order.
          items:
            type: string
            enum:
              - musculoskeletal
              - cardiovascular
              - dermatology
              - digestion_metabolism
              - nervous_system
              - prevention
              - gynecology
              - oncology_aftercare
              - diabetes
        staffLanguages:
          type: array
          description: Languages spoken by hotel staff.
          items:
            type: string
            enum: [cs, en, de, ru]
        amenityCategories:
          type: array
          description: >-
            Amenities assigned to the hotel, grouped by category. See
            [Assigned amenities](/api/amenities#assigned-amenities).
          items:
            $ref: "#/components/schemas/HotelAmenityCategoryGroup"
          example:
            - category:
                code: wellness
              amenities:
                - code: aquapark
                  proximity: nearby
                  proximityMeters: 250
                  pricing: included
                  openingHours:
                    continuous: false
                    blocks:
                      - days: [monday, tuesday, wednesday]
                        from: "09:00"
                        to: "21:00"
        priceFrom:
          anyOf:
            - title: Available prices
              allOf:
                - $ref: "#/components/schemas/PriceFrom"
            - title: No price
              type: object
              nullable: true
              enum: [null]
          description: >-
            Lowest prices the hotel currently sells, per currency, for all
            stays and per category, each with two independent minima, or null
            when no available, fully priced stay exists. On-demand stays are
            excluded. See [Prices](/api/prices).
        roomTypes:
          type: array
          description: |
            Embedded only when `expand=roomTypes`;
            otherwise fetch them via `GET /room-types?hotelId={hotelId}`. Each
            item omits the nested `hotel` block (it is this hotel).
          items:
            $ref: "#/components/schemas/RoomType"
