components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: Optional client-provided request identifier echoed in error responses.
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        example: cs-CZ,de
      description: >-
        Comma-separated BCP 47 language tags selecting which locale keys
        localized fields return. When omitted or `*`, all locale keys are
        returned. Inside a list, `*` adds the locales you do not list, at its
        own quality value. See [Localization](/api/localization) for details.
  securitySchemes:
    spaPortalPublicKey:
      type: apiKey
      in: header
      name: X-SpaPortal-Public-Key
      description: "See [Authentication](/api/authentication) for how to obtain and send your public key."
  responses:
    BadRequest:
      description: Invalid request.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid API key.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current state or scoped context.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Resource exists but cannot be used for this request.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected server error.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  headers:
    ContentLanguage:
      description: Comma-separated locale keys included in localized fields.
      schema:
        type: string
        example: cs-CZ,de
    ETag:
      description: >-
        Entity tag of this dictionary response. Send it in `If-None-Match` to
        revalidate your copy. See [Caching](/api/amenities#caching).
      schema:
        type: string
        example: '"5a9ef9cd5e0cde22-hotel-cs-CZ_de"'
    AmenitiesVersion:
      description: >-
        Current amenity dictionary version, the same for both scopes. When it
        differs from the version of your cached dictionary, fetch the dictionary
        again. See [Caching](/api/amenities#caching).
      schema:
        type: string
        example: 5a9ef9cd5e0cde22
    RequestId:
      description: Request identifier for support and debugging.
      schema:
        type: string
  schemas:
    CalendarDatesBulkRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        shared:
          $ref: "#/components/schemas/CalendarDatesBulkQuery"
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/CalendarDatesBulkQueryWithKey"
    CalendarDatesBulkQuery:
      type: object
      additionalProperties: false
      properties:
        currency:
          deprecated: true
          description: >-
            Ignored, regardless of value. Omit this field; responses include
            all available currencies.
        visitTypeId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Visit type id.
          nullable: true
        hotelId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Hotel id.
          nullable: true
        roomTypeId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Room type id.
          nullable: true
        destinationId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Destination id.
          nullable: true
        guests:
          type: integer
          minimum: 1
          maximum: 2
          nullable: true
        dateFrom:
          type: string
          format: date
          nullable: true
        dateTo:
          type: string
          format: date
          nullable: true
    CalendarDatesBulkQueryWithKey:
      type: object
      additionalProperties: false
      properties:
        currency:
          deprecated: true
          description: >-
            Ignored, regardless of value. Omit this field; responses include
            all available currencies.
        visitTypeId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Visit type id.
          nullable: true
        hotelId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Hotel id.
          nullable: true
        roomTypeId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Room type id.
          nullable: true
        destinationId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Destination id.
          nullable: true
        guests:
          type: integer
          minimum: 1
          maximum: 2
          nullable: true
        dateFrom:
          type: string
          format: date
          nullable: true
        dateTo:
          type: string
          format: date
          nullable: true
        key:
          type: string
          minLength: 1
          maxLength: 100
          description: Optional client key returned with the matching result.
    CalendarDatesBulkResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [key, data]
            properties:
              key:
                type: string
                nullable: true
              data:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarDate"
    CalendarDate:
      type: object
      required: [date, selectable, availability, price]
      properties:
        date:
          type: string
          format: date
        selectable:
          type: boolean
          nullable: true
          description: Whether the booking flow can start on this date. This follows price, date-range, and starting-day rules; it does not guarantee capacity for the complete stay. A selectable date may result in an ON_DEMAND booking configuration.
        availability:
          type: string
          enum: [NOT_AVAILABLE, AVAILABLE, ON_DEMAND]
        price:
          anyOf:
            - title: Price
              allOf:
                - $ref: "#/components/schemas/CalendarDatePrice"
            - title: No price
              type: object
              nullable: true
              enum: [null]
    CalendarDatePrice:
      type: object
      required: [isFinal, amounts]
      properties:
        isFinal:
          type: boolean
        amounts:
          type: object
          minProperties: 1
          additionalProperties: false
          description: Available currencies only. Missing currencies are omitted; price is null when none are available.
          properties:
            CZK:
              $ref: "#/components/schemas/Money"
            EUR:
              $ref: "#/components/schemas/Money"
    Money:
      type: object
      required: [amountMinor, currency, currencyExponent]
      properties:
        amountMinor:
          type: integer
          description: Amount in the smallest currency unit.
          example: 180000
        currency:
          type: string
          enum: [CZK, EUR]
        currencyExponent:
          type: integer
          enum: [2]
          description: Decimal exponent for the currency.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - missing_authentication
                - invalid_authentication
                - insufficient_scope
                - not_found
                - conflict
                - rate_limited
                - internal_error
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
            requestId:
              type: string
    LocalizedString:
      type: object
      additionalProperties: false
      properties:
        cs-CZ:
          type: string
          nullable: true
        de:
          type: string
          nullable: true
        en:
          type: string
          nullable: true
        ru:
          type: string
          nullable: true
      description: >-
        Localized field keyed by supported response locale (`cs-CZ`, `de`, `en`,
        `ru`). When `Accept-Language` is set, only the matched keys are returned.
      example:
        cs-CZ: Český text
        de: Deutscher Text
    HotelNameLocalizedString:
      type: object
      additionalProperties: false
      properties:
        cs-CZ:
          type: string
          minLength: 1
        de:
          type: string
          minLength: 1
        en:
          type: string
          minLength: 1
        ru:
          type: string
          minLength: 1
      description: >-
        Localized hotel name keyed by supported response locale (`cs-CZ`, `de`,
        `en`, `ru`). Missing requested translations fall back to the Czech name,
        so every returned value is a non-empty string.
      example:
        cs-CZ: Spa Resort Pawlik
        de: Kurhotel Pawlik
    Image:
      type: object
      required: [url, width, height, alt, variants]
      properties:
        url:
          type: string
          description: >-
            Original image URL. Use it for a full-size view and as the final
            fallback.
        width:
          type: integer
          nullable: true
          minimum: 1
          description: Original display width in pixels after orientation, or null when dimensions are unavailable.
        height:
          type: integer
          nullable: true
          minimum: 1
          description: Original display height in pixels after orientation, or null when dimensions are unavailable.
        alt:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized alternative text. A missing translation falls back to the
            name of the hotel, room type, or visit type the image belongs to, or
            null if that name is unavailable. An empty string is intentional
            decorative text; preserve it.
        variants:
          $ref: "#/components/schemas/ImageVariants"
    ImageVariants:
      type: object
      additionalProperties: false
      description: >-
        Available WebP images by pixel width. No image is enlarged, so larger
        sizes can be absent. An original narrower than 480 pixels has no
        variants. Unavailable variants are represented by an empty object;
        in that case dimensions can also be null. Use the returned URLs as-is
        and omit srcset when the object is empty.
      properties:
        w480:
          type: string
          format: uri
        w960:
          type: string
          format: uri
        w1440:
          type: string
          format: uri
        w1920:
          type: string
          format: uri
    RoomType:
      type: object
      description: A type of accommodation within a hotel, with occupancy, amenities, rules, and images.
      required:
        - id
        - hotelId
        - code
        - disabled
        - name
        - description
        - unitType
        - tier
        - occupancy
        - bedConfiguration
        - size
        - renovationYear
        - rules
        - building
        - amenityCategories
        - images
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          example: 66f16191f739705faa020003
        hotelId:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          example: 66f16191f739705faa020001
        code:
          type: string
          nullable: true
          example: SUPERIOR-DBL
        disabled:
          type: boolean
          description: True when this room type is disabled for new bookings. Existing
            bookings keep their references to the room type. The code does not indicate availability.
          example: false
        name:
          type: string
          description: Single room type name, shared by all languages. Unaffected by
            Accept-Language. Empty string when no name is available.
          example: STANDARD 1/1 - IMP
        description:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized description (Markdown).
        unitType:
          $ref: "#/components/schemas/RoomTypeUnitType"
        tier:
          $ref: "#/components/schemas/RoomTypeTier"
        occupancy:
          $ref: "#/components/schemas/RoomTypeOccupancy"
        bedConfiguration:
          type: array
          items:
            $ref: "#/components/schemas/RoomTypeBed"
          description: Positive bed counts in dictionary order. Empty when unspecified.
        size:
          $ref: "#/components/schemas/RoomTypeSize"
        renovationYear:
          type: integer
          nullable: true
          minimum: 1800
          description: Renovation year, or null when missing or invalid (including more than five
            years in the future).
        rules:
          $ref: "#/components/schemas/RoomTypeRules"
        building:
          $ref: "#/components/schemas/RoomTypeBuilding"
        amenityCategories:
          type: array
          description: >-
            Amenities assigned to the room type, grouped by category. See
            [Assigned amenities](/api/amenities#assigned-amenities). Room benefits
            use the `inclusions` category; see
            [Included with this room](/api/amenities#included-with-this-room).
          items:
            $ref: "#/components/schemas/RoomTypeAmenityCategoryGroup"
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        hotel:
          type: object
          description: Embedded only when `expand=hotel`.
          required:
            - id
            - name
            - stars
          properties:
            id:
              type: string
              pattern: ^[0-9a-fA-F]{24}$
              example: 66f16191f739705faa020001
            name:
              allOf:
                - $ref: "#/components/schemas/HotelNameLocalizedString"
              description: Localized hotel name. Falls back to the default locale (cs-CZ), so it is
                never null.
              example:
                cs-CZ: Pawlik
                de: Pawlik-Aquaforum
            stars:
              type: integer
              nullable: true
              minimum: 1
              maximum: 5
              example: 4
      example:
        id: 66f16191f739705faa020003
        hotelId: 66f16191f739705faa020001
        code: 2_APARTMA
        disabled: false
        name: STANDARD 1/2 - BEL
        description:
          cs-CZ: |-
            **Světlý pokoj** v prvním patře.

            - výhled do parku
          de: null
          en: null
          ru: null
        unitType:
          code: double_twin
          label:
            cs-CZ: Dvoulůžkový pokoj s oddělenými postelemi
            de: Zweibettzimmer
            en: Twin room
            ru: Двухместный номер с раздельными кроватями
        tier:
          code: komfort
          label:
            cs-CZ: Komfort
            de: Komfort
            en: Komfort
            ru: Komfort
        occupancy:
          standard: 2
          max: 3
          singleUse: true
          infantsExcluded: true
        bedConfiguration:
          - code: single
            count: 2
            label:
              cs-CZ: Samostatná postel
              de: Einzelbett
              en: Single bed
              ru: Односпальная кровать
        size:
          min: 26
          max: 30
        renovationYear: 2023
        rules:
          smokingAllowed: false
          petsAllowed: true
        building:
          id: 66f16191f739705faa0200b2
          name:
            cs-CZ: Villa Anna
            de: Villa Anna
            en: null
            ru: null
          label:
