                options:
                  - code: covered
                    label:
                      cs-CZ: Kryté
                      de: Überdacht
                      en: Covered
                      ru: Крытая
                  - code: guarded
                    label:
                      cs-CZ: Hlídané
                      de: Bewacht
                      en: Guarded
                      ru: Охраняемая
                note:
                  cs-CZ: Hlídané parkoviště je přímo u hotelu.
                  de: Der bewachte Parkplatz befindet sich direkt am Hotel.
                  en: Guarded parking is available next to the hotel.
                  ru: Охраняемая парковка находится рядом с отелем.
        priceFrom:
          CZK:
            perNight: { amountMinor: 288000, currency: CZK, currencyExponent: 2 }
            perNightOriginal: { amountMinor: 320000, currency: CZK, currencyExponent: 2 }
            minimumStay: { amountMinor: 576000, currency: CZK, currencyExponent: 2 }
            minimumStayOriginal: { amountMinor: 640000, currency: CZK, currencyExponent: 2 }
            guests: 2
            minimumNights: 2
          EUR:
            perNight: { amountMinor: 11340, currency: EUR, currencyExponent: 2 }
            perNightOriginal: { amountMinor: 12600, currency: EUR, currencyExponent: 2 }
            minimumStay: { amountMinor: 22680, currency: EUR, currencyExponent: 2 }
            minimumStayOriginal: { amountMinor: 25200, currency: EUR, currencyExponent: 2 }
            guests: 2
            minimumNights: 2
    HotelsList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Hotel"
        pagination:
          $ref: "#/components/schemas/Pagination"
    PriceFromCurrency:
      type: object
      required:
        - perNight
        - perNightOriginal
        - minimumStay
        - minimumStayOriginal
        - guests
        - minimumNights
      properties:
        perNight:
          $ref: "#/components/schemas/Money"
        perNightOriginal:
          allOf:
            - $ref: "#/components/schemas/Money"
          nullable: true
          description: Pre-discount nightly price, or null when there is no discount.
        minimumStay:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Total price for `minimumNights` nights.
        minimumStayOriginal:
          allOf:
            - $ref: "#/components/schemas/Money"
          nullable: true
          description: >-
            Pre-discount total for the minimum stay, or null when there is no
            discount.
        guests:
          type: integer
          minimum: 1
          description: >-
            Number of guests this "from" price is for (the occupancy with the
            cheapest offer).
          example: 2
        minimumNights:
          type: integer
          minimum: 1
          description: Minimum number of nights the offer requires.
          example: 2
    PriceFrom:
      type: object
      description: >-
        Cheapest available current or future room price for a hotel, keyed by
        currency. Prices are room totals for the room's standard occupancy and
        include an applicable public-channel promotion. They are not affected
        by query parameters. The cheapest room may differ by currency. A
        currency key is present only when the hotel has a usable price in that
        currency.
      properties:
        CZK:
          $ref: "#/components/schemas/PriceFromCurrency"
        EUR:
          $ref: "#/components/schemas/PriceFromCurrency"
      example:
        CZK:
          perNight: { amountMinor: 288000, currency: CZK, currencyExponent: 2 }
          perNightOriginal: { amountMinor: 320000, currency: CZK, currencyExponent: 2 }
          minimumStay: { amountMinor: 576000, currency: CZK, currencyExponent: 2 }
          minimumStayOriginal: { amountMinor: 640000, currency: CZK, currencyExponent: 2 }
          guests: 2
          minimumNights: 2
        EUR:
          perNight: { amountMinor: 11340, currency: EUR, currencyExponent: 2 }
          perNightOriginal: { amountMinor: 12600, currency: EUR, currencyExponent: 2 }
          minimumStay: { amountMinor: 22680, currency: EUR, currencyExponent: 2 }
          minimumStayOriginal: { amountMinor: 25200, currency: EUR, currencyExponent: 2 }
          guests: 2
          minimumNights: 2
    AmenityCategory:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          enum:
            - health
            - wellness
            - dining
            - services
            - accessibility
            - parking
            - sport
            - children
        label:
          $ref: "#/components/schemas/LocalizedString"
    AmenityCategoryGroup:
      type: object
      required: [category, amenities]
      description: >-
        One amenity category and the amenity dictionary entries assigned to it.
      properties:
        category:
          $ref: "#/components/schemas/AmenityCategory"
        amenities:
          type: array
          items:
            $ref: "#/components/schemas/Amenity"
    AmenityOption:
      type: object
      required: [code, label]
      description: >-
        One localized amenity-specific option. Its meaning is scoped by the
        parent amenity code.
      properties:
        code:
          type: string
          description: Stable option code.
          example: finnish
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized option label.
    Amenity:
      type: object
      required: [code, label, detailKinds]
      description: >-
        One amenity dictionary entry nested under its category in the response
        from `GET /amenity-categories`.
      properties:
        code:
          type: string
          description: Stable code stored on hotels and used for filtering.
          example: sauna
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized display name.
          example:
            cs-CZ: Sauna
            de: Sauna
            en: Sauna
        detailKinds:
          type: array
          description: >-
            Structured detail field groups supported by this amenity. Resolve
            these snake-case values to AmenityValue properties as documented in
            the Amenity value object reference. An empty array means the
            amenity is presence-only.
          items:
            type: string
            enum:
              - proximity
              - access
              - options
              - opening_hours
              - note
        options:
          type: array
          description: >-
            All choices supported by this amenity. Present when `detailKinds`
            includes `options`.
          items:
            $ref: "#/components/schemas/AmenityOption"
        notePlaceholder:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Optional localized helper text for the amenity note. Omitted when
            the amenity does not define one.
      example:
        code: sauna
        label:
          cs-CZ: Sauna
          de: Sauna
          en: Sauna
          ru: Сауна
        detailKinds: [proximity, access, options, opening_hours]
        options:
          - code: finnish
            label:
              cs-CZ: Finská sauna
              de: Finnische Sauna
              en: Finnish sauna
              ru: Финская сауна
          - code: steam
            label:
              cs-CZ: Parní lázeň
              de: Dampfbad
              en: Steam bath
              ru: Паровая баня
    AmenityOpeningHoursBlock:
      type: object
      required: [days, from, to]
      properties:
        days:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - monday
              - tuesday
              - wednesday
              - thursday
              - friday
              - saturday
              - sunday
        from:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "07:00"
        to:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "15:00"
    AmenityOpeningHours:
      type: object
      required: [continuous, blocks]
      properties:
        continuous:
          type: boolean
          description: True when the amenity operates continuously (24/7).
        blocks:
          type: array
          description: Weekly opening-hour blocks. Empty when `continuous` is true.
          items:
            $ref: "#/components/schemas/AmenityOpeningHoursBlock"
    AmenityValue:
      type: object
      required: [code]
      description: >-
        A structured amenity assigned to a hotel. Hotel responses contain only
        assigned amenities. Apart from `code`, only the fields mapped from the
        corresponding entry under the amenity dictionary response
        `data[].amenities[]` are present.
      properties:
        code:
          type: string
          description: References an `Amenity.code`.
          example: sauna
        proximity:
          type: string
          nullable: true
          enum: [in-hotel, connecting, nearby]
          description: >-
            Present when `detailKinds` includes `proximity`. Null when supported
            but not filled.
        proximityMeters:
          type: number
          minimum: 0
          maximum: 1000000
          nullable: true
          description: >-
            Present with `proximity`. Contains a distance when `proximity` is
            `nearby`; otherwise null.
        access:
          type: string
          nullable: true
          enum: [included, conditional, paid]
          description: >-
            Present when `detailKinds` includes `access`. Null when supported
            but not filled. `included` means no additional charge,
            `conditional` means inclusion depends on stated conditions, and
            `paid` means an additional charge applies.
        options:
          type: array
          description: >-
            Amenity-specific choices selected for this hotel. Present when
            `detailKinds` includes `options`. Empty when the amenity supports
            choices but none are selected.
          items:
            $ref: "#/components/schemas/AmenityOption"
        openingHours:
          allOf:
            - $ref: "#/components/schemas/AmenityOpeningHours"
          description: >-
            Present when `detailKinds` includes `opening_hours`. When supported
            but not filled, returns `continuous: false` with an empty `blocks`
            array.
        note:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Present when `detailKinds` includes `note`. Localized supplementary
            information for guests. Locale values are at most 200 characters
            and are null when the requested translation is not filled.
      example:
        code: aquapark
        proximity: nearby
        proximityMeters: 250
        access: included
        openingHours:
          continuous: false
          blocks:
            - days: [monday, tuesday, wednesday]
              from: "09:00"
              to: "21:00"
    HotelAmenityCategoryGroup:
      type: object
      required: [category, amenities]
      description: >-
        One amenity category containing the values assigned to a hotel.
        Categories without assigned amenities are omitted from hotel responses.
      properties:
        category:
          $ref: "#/components/schemas/AmenityCategory"
        amenities:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AmenityValue"
    AmenityCategoriesList:
      type: object
      required: [data]
      description: >-
        The complete hotel amenity dictionary grouped by category and returned
        in one response (small, not paginated). It includes every system
        amenity, independent of assignments to individual hotels. Amenities that
        support choices carry their full `options` list.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AmenityCategoryGroup"
      example:
        data:
          - category:
              code: wellness
              label: { cs-CZ: Bazény a wellness, de: Pools & Wellness, en: "Pools & wellness" }
            amenities:
              - code: aquapark
                label: { cs-CZ: Akvapark, de: Aquapark, en: Aquapark }
                detailKinds: [proximity, access, opening_hours]
              - code: sauna
                label: { cs-CZ: Sauna, de: Sauna, en: Sauna }
                detailKinds: [proximity, access, options, opening_hours]
                options:
                  - code: finnish
                    label: { cs-CZ: Finská sauna, de: Finnische Sauna, en: "Finnish sauna" }
                  - code: infrared
                    label: { cs-CZ: Infra sauna, de: Infrarotsauna, en: "Infrared sauna" }
                  - code: steam
                    label: { cs-CZ: Parní lázeň, de: Dampfbad, en: "Steam bath" }
