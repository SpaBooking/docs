components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: Optional client-provided request identifier echoed in error responses.
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        example: cs-CZ,de
      description: >-
        Comma-separated BCP 47 language tags selecting which locale keys localized fields return.
        When omitted or `*`, all locale keys are returned. Inside a list, `*` adds the locales you
        do not list, at its own quality value. See [Localization](/api/localization) for details.
  securitySchemes:
    spaPortalPublicKey:
      type: apiKey
      in: header
      name: X-SpaPortal-Public-Key
      description: "See [Authentication](/api/authentication) for how to obtain and send your public key."
  responses:
    BadRequest:
      description: Invalid request.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid API key.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected server error.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  headers:
    ContentLanguage:
      description: Comma-separated locale keys included in localized fields.
      schema:
        type: string
        example: cs-CZ,de
    ETag:
      description: >-
        Entity tag of this dictionary response. Send it in `If-None-Match` to revalidate your copy.
        See [Caching](/api/amenities#caching).
      schema:
        type: string
        example: '"5a9ef9cd5e0cde22-hotel-cs-CZ_de"'
    AmenitiesVersion:
      description: >-
        Current amenity dictionary version, the same for both scopes. When it differs from the
        version of your cached dictionary, fetch the dictionary again. See
        [Caching](/api/amenities#caching).
      schema:
        type: string
        example: 5a9ef9cd5e0cde22
    RequestId:
      description: Request identifier for support and debugging.
      schema:
        type: string
  schemas:
    Money:
      type: object
      required: [ amountMinor, currency, currencyExponent ]
      properties:
        amountMinor:
          type: integer
          description: Amount in the smallest currency unit.
          example: 180000
        currency:
          type: string
          enum: [ CZK, EUR ]
        currencyExponent:
          type: integer
          enum: [ 2 ]
          description: Decimal exponent for the currency.
    ErrorResponse:
      type: object
      required: [ error ]
      properties:
        error:
          type: object
          required: [ code, message, requestId ]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - missing_authentication
                - invalid_authentication
                - insufficient_scope
                - not_found
                - conflict
                - rate_limited
                - internal_error
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
            requestId:
              type: string
    LocalizedString:
      type: object
      additionalProperties: false
      properties:
        cs-CZ:
          type: string
          nullable: true
        de:
          type: string
          nullable: true
        en:
          type: string
          nullable: true
        ru:
          type: string
          nullable: true
      description: >-
        Localized field keyed by supported response locale (`cs-CZ`, `de`, `en`, `ru`). When
        `Accept-Language` is set, only the matched keys are returned.
      example:
        cs-CZ: Český text
        de: Deutscher Text
    HotelNameLocalizedString:
      type: object
      additionalProperties: false
      properties:
        cs-CZ:
          type: string
          minLength: 1
        de:
          type: string
          minLength: 1
        en:
          type: string
          minLength: 1
        ru:
          type: string
          minLength: 1
      description: >-
        Localized hotel name keyed by supported response locale (`cs-CZ`, `de`, `en`, `ru`). Missing
        requested translations fall back to the Czech name, so every returned value is a non-empty
        string.
      example:
        cs-CZ: Spa Resort Pawlik
        de: Kurhotel Pawlik
    Image:
      type: object
      required: [ url, width, height, alt, variants ]
      properties:
        url:
          type: string
          description: >-
            Original image URL. Use it for a full-size view and as the final fallback.
        width:
          type: integer
          nullable: true
          minimum: 1
          description: Original display width in pixels after orientation, or null when dimensions are
            unavailable.
        height:
          type: integer
          nullable: true
          minimum: 1
          description: Original display height in pixels after orientation, or null when dimensions are
            unavailable.
        alt:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized alternative text. A missing translation falls back to the name of the hotel,
            room type, or visit type the image belongs to, or null if that name is unavailable. An
            empty string is intentional decorative text; preserve it.
        variants:
          $ref: "#/components/schemas/ImageVariants"
    ImageVariants:
      type: object
      additionalProperties: false
      description: >-
        Available WebP images by pixel width. No image is enlarged, so larger sizes can be absent.
        An original narrower than 480 pixels has no variants. Unavailable variants are represented
        by an empty object; in that case dimensions can also be null. Use the returned URLs as-is
        and omit srcset when the object is empty.
      properties:
        w480:
          type: string
          format: uri
        w960:
          type: string
          format: uri
        w1440:
          type: string
          format: uri
        w1920:
          type: string
          format: uri
    RoomType:
      type: object
      description: A type of accommodation within a hotel, with occupancy, amenities, rules, and images.
      required:
        - id
        - hotelId
        - code
        - disabled
        - name
        - description
        - unitType
        - tier
        - occupancy
        - bedConfiguration
        - size
        - renovationYear
        - rules
        - building
        - amenityCategories
        - images
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          example: 66f16191f739705faa020003
        hotelId:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          example: 66f16191f739705faa020001
        code:
          type: string
          nullable: true
          example: SUPERIOR-DBL
        disabled:
          type: boolean
          description: True when this room type is disabled for new bookings. Existing bookings keep their
            references to the room type. The code does not indicate availability.
          example: false
        name:
          type: string
          description: Single room type name, shared by all languages. Unaffected by Accept-Language. Empty
            string when no name is available.
          example: STANDARD 1/1 - IMP
        description:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized description (Markdown).
        unitType:
          $ref: "#/components/schemas/RoomTypeUnitType"
        tier:
          $ref: "#/components/schemas/RoomTypeTier"
        occupancy:
          $ref: "#/components/schemas/RoomTypeOccupancy"
        bedConfiguration:
          type: array
          items:
            $ref: "#/components/schemas/RoomTypeBed"
          description: Positive bed counts in dictionary order. Empty when unspecified.
        size:
          $ref: "#/components/schemas/RoomTypeSize"
        renovationYear:
          type: integer
          nullable: true
          minimum: 1800
          description: Renovation year, or null when missing or invalid (including more than five years in the
            future).
        rules:
          $ref: "#/components/schemas/RoomTypeRules"
        building:
          $ref: "#/components/schemas/RoomTypeBuilding"
        amenityCategories:
          type: array
          description: >-
            Amenities assigned to the room type, grouped by category. See [Assigned
            amenities](/api/amenities#assigned-amenities). Room benefits use the `inclusions`
            category; see [Included with this room](/api/amenities#included-with-this-room).
          items:
            $ref: "#/components/schemas/RoomTypeAmenityCategoryGroup"
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        hotel:
          type: object
          description: Embedded only when `expand=hotel`.
          required:
            - id
            - name
            - stars
          properties:
            id:
              type: string
              pattern: ^[0-9a-fA-F]{24}$
              example: 66f16191f739705faa020001
            name:
              allOf:
                - $ref: "#/components/schemas/HotelNameLocalizedString"
              description: Localized hotel name. Falls back to the default locale (cs-CZ), so it is never null.
              example:
                cs-CZ: Pawlik
                de: Pawlik-Aquaforum
            stars:
              type: integer
              nullable: true
              minimum: 1
              maximum: 5
              example: 4
      example:
        id: 66f16191f739705faa020003
        hotelId: 66f16191f739705faa020001
        code: 2_APARTMA
        disabled: false
        name: STANDARD 1/2 - BEL
        description:
          cs-CZ: |-
            **Světlý pokoj** v prvním patře.

            - výhled do parku
          de: null
          en: null
          ru: null
        unitType:
          code: double_twin
          label:
            cs-CZ: Dvoulůžkový pokoj s oddělenými postelemi
            de: Zweibettzimmer
            en: Twin room
            ru: Двухместный номер с раздельными кроватями
        tier:
          code: komfort
          label:
            cs-CZ: Komfort
            de: Komfort
            en: Komfort
            ru: Komfort
        occupancy:
          standard: 2
          max: 3
          singleUse: true
          infantsExcluded: true
        bedConfiguration:
          - code: single
            count: 2
            label:
              cs-CZ: Samostatná postel
              de: Einzelbett
              en: Single bed
              ru: Односпальная кровать
        size:
          min: 26
          max: 30
        renovationYear: 2023
        rules:
          smokingAllowed: false
          petsAllowed: true
        building:
          id: 66f16191f739705faa0200b2
          name:
            cs-CZ: Villa Anna
            de: Villa Anna
            en: null
            ru: null
          label:
            cs-CZ: Villa Anna — krytou chodbou, 60 m
            de: null
            en: null
            ru: null
        amenityCategories:
          - category:
              code: bathroom
            amenities:
              - code: toilet
              - code: shower
                coverage: all
          - category:
              code: view
            amenities:
              - code: balcony
                coverage: all
          - category:
              code: inclusions
            amenities:
              - code: parking
                pricing: { type: included, schedule: null }
              - code: welcome_drink
              - code: fruit_bowl
        images:
          - url: https://cdn.example.com/rooms/superior.jpg
            width: 1100
            height: 733
            alt:
              cs-CZ: STANDARD 1/2 - BEL
              en: STANDARD 1/2 - BEL
            variants:
              w480: https://cdn.example.com/rooms/superior/generation-1/w480.webp
              w960: https://cdn.example.com/rooms/superior/generation-1/w960.webp
    RoomTypeUnitType:
      type: object
      nullable: true
      required:
        - code
        - label
      properties:
        code:
          type: string
          enum:
            - single
            - double_double
            - double_twin
            - double_either
            - triple
            - quad
            - family
            - suite
            - studio
            - apartment
        label:
          $ref: "#/components/schemas/LocalizedString"
    RoomTypeTier:
      type: object
      nullable: true
      required:
        - code
        - label
      properties:
        code:
          type: string
          enum:
            - economy
            - economy_plus
            - standard
            - standard_plus
            - komfort
            - komfort_plus
            - superior
            - deluxe
        label:
          $ref: "#/components/schemas/LocalizedString"
    RoomTypeOccupancy:
      type: object
      description: Configured room occupancy details. Booking and pricing use standard occupancy; maximum
        capacity, single use and infant exclusion are informational settings.
      required:
        - standard
        - max
        - singleUse
        - infantsExcluded
      properties:
        standard:
          type: integer
          description: Number of guests included in the room type's base price.
          example: 2
        max:
          type: integer
          nullable: true
          minimum: 1
          description: Configured maximum guest count, including extra beds. At least `standard` when present.
            Null when unspecified. Does not change booking capacity.
          example: 3
        singleUse:
          type: boolean
          nullable: true
          description: Whether sale to one guest is configured. Null when unspecified. Does not change booking
            acceptance or price.
          example: true
        infantsExcluded:
          type: boolean
          nullable: true
          description: Whether children aged 0–2 are configured to be excluded from the guest count. Null when
            unspecified. Does not change booking acceptance or price.
          example: true
    RoomTypeBed:
      type: object
      required:
        - code
        - count
        - label
      properties:
        code:
          type: string
          enum:
            - single
            - double
            - king
            - superking
            - sofa
            - futon
        count:
          type: integer
          minimum: 1
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Singular localized bed label.
    RoomTypeSize:
      type: object
      nullable: true
      description: Floor area in square metres. A fixed area has equal min and max.
      required:
        - min
        - max
      properties:
        min:
          type: number
          exclusiveMinimum: true
          minimum: 0
        max:
          type: number
          exclusiveMinimum: true
          minimum: 0
    RoomTypeRules:
      type: object
      required:
        - smokingAllowed
        - petsAllowed
      properties:
        smokingAllowed:
          type: boolean
          nullable: true
          description: Null when unspecified.
        petsAllowed:
          type: boolean
          nullable: true
          description: Effective pet rule. False unless the hotel allows pets; then the room rule applies,
            with null for an unspecified room rule.
    HotelBuilding:
      type: object
      description: >-
        A physical hotel building. Name and label follow Accept-Language; missing or blank
        translations are null, without a locale fallback.
      required:
        - id
        - name
        - label
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: Stable building id, also returned as roomType.building.id.
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Short building name.
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Short building description; requested translations are null when unset.
    RoomTypeBuilding:
      type: object
      nullable: true
      description: Assigned building, even for a hotel with one building. Null if unassigned or removed.
      required:
        - id
        - name
        - label
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Short building name.
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Descriptive building label.
    RoomTypeAmenityCategoryGroup:
      type: object
      description: Room type amenities in dictionary order. Groups without assigned amenities are omitted.
      required:
        - category
        - amenities
      properties:
        category:
          $ref: "#/components/schemas/RoomTypeAmenityCategoryRef"
        amenities:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AmenityValue"
    Pagination:
      type: object
      required: [ limit, nextCursor, hasMore, total ]
      properties:
        limit:
          type: integer
          example: 25
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to fetch the next page. Null on the last page.
        hasMore:
          type: boolean
        total:
          type: integer
          description: Total number of matching records across all pages.
    RoomTypesList:
      type: object
      required: [ data, pagination ]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RoomType"
        pagination:
          $ref: "#/components/schemas/Pagination"
    HotelAddress:
      type: object
      required: [ addressLine, city, postalCode, country ]
      properties:
        addressLine:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          pattern: "^[a-z]{3}$"
          description: Lowercase ISO 3166-1 alpha-3 country code.
          example: cze
    HotelTimeRange:
      type: object
      required: [ from, to ]
      properties:
        from:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "14:00"
        to:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "22:00"
    HotelChildrenPolicy:
      type: object
      required: [ allowed, minimumAge ]
      properties:
        allowed:
          type: boolean
        minimumAge:
          type: integer
          minimum: 0
          maximum: 18
          nullable: true
    HotelPetFee:
      type: object
      required: [ czk, eur ]
      properties:
        czk:
          type: number
          minimum: 0
          nullable: true
          description: Per-night fee in Czech koruna major units.
        eur:
          type: number
          minimum: 0
          nullable: true
          description: Per-night fee in euro major units.
    HotelPetPolicy:
      type: object
      required: [ allowed, minimumNights, feePerNight, conditions ]
      properties:
        allowed:
          type: boolean
        minimumNights:
          type: integer
          minimum: 0
          nullable: true
        feePerNight:
          $ref: "#/components/schemas/HotelPetFee"
        conditions:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized supplementary conditions for guests with pets. Each locale value is at most
            300 characters.
    HotelAccommodationRules:
      type: object
      required: [ checkIn, checkOut, children, pets ]
      properties:
        checkIn:
          $ref: "#/components/schemas/HotelTimeRange"
        checkOut:
          $ref: "#/components/schemas/HotelTimeRange"
        children:
          $ref: "#/components/schemas/HotelChildrenPolicy"
        pets:
          $ref: "#/components/schemas/HotelPetPolicy"
    HotelChannelContent:
      type: object
      required: [ tagline ]
      properties:
        tagline:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized tagline intended for sales channels. Each locale value is at most 100
            characters.
    HotelMealService:
      type: object
      required:
        - enabled
        - servingTime
        - serviceMethod
        - drinksIncluded
        - drinksNote
      properties:
        enabled:
          type: boolean
        servingTime:
          $ref: "#/components/schemas/HotelTimeRange"
        serviceMethod:
          type: string
          nullable: true
          enum: [ buffet, served, null ]
        drinksIncluded:
          type: boolean
        drinksNote:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized note about included drinks. Each locale value is at most 200 characters.
      example:
        enabled: true
        servingTime: { from: "07:00", to: "10:00" }
        serviceMethod: buffet
        drinksIncluded: true
        drinksNote:
          cs-CZ: Nealkoholické nápoje jsou v ceně.
          de: Alkoholfreie Getränke sind inklusive.
          en: Soft drinks are included.
          ru: Безалкогольные напитки включены в стоимость.
    HotelMealServices:
      type: object
      required: [ breakfast, lunch, dinner ]
      properties:
        breakfast:
          $ref: "#/components/schemas/HotelMealService"
        lunch:
          $ref: "#/components/schemas/HotelMealService"
        dinner:
          $ref: "#/components/schemas/HotelMealService"
      example:
        breakfast:
          enabled: true
          servingTime: { from: "07:00", to: "10:00" }
          serviceMethod: buffet
          drinksIncluded: true
          drinksNote:
            cs-CZ: Nealkoholické nápoje jsou v ceně.
            de: Alkoholfreie Getränke sind inklusive.
            en: Soft drinks are included.
            ru: Безалкогольные напитки включены в стоимость.
        lunch:
          enabled: true
          servingTime: { from: "11:30", to: "14:30" }
          serviceMethod: buffet
          drinksIncluded: true
          drinksNote:
            cs-CZ: Voda je zahrnuta v ceně oběda.
            de: Wasser ist im Mittagessen inbegriffen.
            en: Water is included with lunch.
            ru: Вода включена в стоимость обеда.
        dinner:
          enabled: true
          servingTime: { from: "18:00", to: "21:00" }
          serviceMethod: served
          drinksIncluded: false
          drinksNote:
            cs-CZ: Nápoje se hradí samostatně.
            de: Getränke werden separat berechnet.
            en: Drinks are charged separately.
            ru: Напитки оплачиваются отдельно.
    Hotel:
      type: object
      required:
        - id
        - name
        - shortDescription
        - channelContent
        - stars
        - address
        - email
        - phoneNumber
        - url
        - images
        - buildings
        - accommodationRules
        - mealServices
        - indications
        - procedures
        - staffLanguages
        - amenityCategories
        - priceFrom
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
        name:
          allOf:
            - $ref: "#/components/schemas/HotelNameLocalizedString"
          description: >-
            Localized hotel name (plain text). Falls back to the default locale (cs-CZ) when a
            requested locale has no value, so it is never null.
        shortDescription:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized short hotel description (plain text). Each locale value is at most 400
            characters.
        channelContent:
          $ref: "#/components/schemas/HotelChannelContent"
        stars:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
        address:
          $ref: "#/components/schemas/HotelAddress"
        email:
          type: string
          format: email
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          nullable: true
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        buildings:
          type: array
          description: >-
            All physical buildings in stored order, including buildings with no assigned room types.
            Always included without expand, even for a single building; empty when none are
            configured. Match each id to a room type's building.id.
          items:
            $ref: "#/components/schemas/HotelBuilding"
        accommodationRules:
          $ref: "#/components/schemas/HotelAccommodationRules"
        mealServices:
          $ref: "#/components/schemas/HotelMealServices"
        indications:
          type: array
          description: Medical indications the hotel specializes in, in display order.
          items:
            type: string
            enum:
              - musculoskeletal
              - cardiovascular
              - dermatology
              - digestion_metabolism
              - nervous_system
              - prevention
              - gynecology
              - oncology_aftercare
              - diabetes
        procedures:
          type: array
          items:
            $ref: "#/components/schemas/Procedure"
          description: >-
            Procedures the hotel offers, in configured order, each code once. Independent of the
            procedures a package includes. Not yet returned by the production API; see
            [API coverage](/api/versioning#api-coverage).
        staffLanguages:
          type: array
          description: Languages spoken by hotel staff.
          items:
            type: string
            enum: [ cs, en, de, ru ]
        amenityCategories:
          type: array
          description: >-
            Amenities assigned to the hotel, grouped by category. See [Assigned
            amenities](/api/amenities#assigned-amenities).
          items:
            $ref: "#/components/schemas/HotelAmenityCategoryGroup"
          example:
            - category:
                code: wellness
              amenities:
                - code: aquapark
                  proximity: nearby
                  proximityMeters: 250
                  pricing: { type: included, schedule: null }
                  note: { en: null }
                  includes: []
                  openingHours:
                    schedule:
                      - days: [ monday, tuesday, wednesday ]
                        from: "09:00"
                        to: "21:00"
        priceFrom:
          type: object
          nullable: true
          additionalProperties: false
          minProperties: 1
          properties:
            CZK:
              $ref: "#/components/schemas/HotelPriceFromCurrency"
            EUR:
              $ref: "#/components/schemas/HotelPriceFromCurrency"
          description: >-
            Lowest prices the hotel currently sells, per currency: across all packages (`all`) and
            per category (`health`, `wellness`), each with two independent minima. A currency is
            present only when it has a buyable offer. Null when the hotel has none. See
            [Prices](/api/prices).
        roomTypes:
          type: array
          description: |
            Embedded only when `expand=roomTypes`;
            otherwise fetch them via `GET /room-types?hotelId={hotelId}`. Each
            item omits the nested `hotel` block (it is this hotel).
          items:
            $ref: "#/components/schemas/RoomType"
      example:
        id: 6720c0a1b2c3d4e5f6a7c101
        name:
          cs-CZ: Hotel Pramen
          de: Hotel Pramen
        shortDescription:
          cs-CZ: Lázeňský hotel s vlastním balneoprovozem a přímým vstupem do aquaparku.
          de: Kurhotel mit eigener Balneoabteilung und direktem Zugang zum Aquapark.
        channelContent:
          tagline:
            cs-CZ: Lázeňská péče pod jednou střechou
            de: Kurbehandlungen unter einem Dach
        stars: 4
        address:
          addressLine: Národní 25
          city: Františkovy Lázně
          postalCode: 351 01
          country: cze
        email: hotel@example.com
        phoneNumber: +420 123 456 789
        url: https://hotel.example.com
        images:
          - url: https://files.example.com/hotel.jpg
            width: 2400
            height: 1600
            alt:
              cs-CZ: Pohled na hotel
              de: Außenansicht des Hotels
            variants:
              w480: https://files.example.com/hotel/generation-1/w480.webp
              w960: https://files.example.com/hotel/generation-1/w960.webp
              w1440: https://files.example.com/hotel/generation-1/w1440.webp
              w1920: https://files.example.com/hotel/generation-1/w1920.webp
        buildings:
          - id: 6720c0a1b2c3d4e5f6a7cb01
            name:
              cs-CZ: Villa Anna
              de: Villa Anna
            label:
              cs-CZ: Villa Anna — krytou chodbou, 60 m
              de: null
        accommodationRules:
          checkIn:
            from: 14:00
            to: 20:00
          checkOut:
            from: 07:00
            to: 10:00
          children:
            allowed: true
            minimumAge: 6
          pets:
            allowed: true
            minimumNights: 2
            feePerNight:
              czk: 500
              eur: 20
            conditions:
              cs-CZ: Mazlíčci jsou povoleni ve vybraných pokojích.
              de: Haustiere sind in ausgewählten Zimmern erlaubt.
        mealServices:
          breakfast:
            enabled: true
            servingTime:
              from: 07:00
              to: 10:00
            serviceMethod: buffet
            drinksIncluded: true
            drinksNote:
              cs-CZ: Nealkoholické nápoje jsou v ceně.
              de: Alkoholfreie Getränke sind inklusive.
          lunch:
            enabled: true
            servingTime:
              from: 11:30
              to: 14:30
            serviceMethod: buffet
            drinksIncluded: true
            drinksNote:
              cs-CZ: Voda je zahrnuta v ceně oběda.
              de: Wasser ist im Mittagessen inbegriffen.
          dinner:
            enabled: true
            servingTime:
              from: 18:00
