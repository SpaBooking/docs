          checkOut: { from: "07:00", to: "10:00" }
          children:
            allowed: true
            minimumAge: 6
          pets:
            allowed: true
            minimumNights: 2
            feePerNight:
              czk: 500
              eur: 20
            conditions:
              cs-CZ: Mazlíčci jsou povoleni ve vybraných pokojích.
              de: Haustiere sind in ausgewählten Zimmern erlaubt.
              en: Pets are allowed in selected rooms.
              ru: Размещение с домашними животными разрешено в отдельных номерах.
        mealServices:
          breakfast:
            enabled: true
            servingTime: { from: "07:00", to: "10:00" }
            serviceMethod: buffet
            drinksIncluded: true
            drinksNote:
              cs-CZ: Nealkoholické nápoje jsou v ceně.
              de: Alkoholfreie Getränke sind inklusive.
              en: Soft drinks are included.
              ru: Безалкогольные напитки включены в стоимость.
          lunch:
            enabled: true
            servingTime: { from: "11:30", to: "14:30" }
            serviceMethod: buffet
            drinksIncluded: true
            drinksNote:
              cs-CZ: Voda je zahrnuta v ceně oběda.
              de: Wasser ist im Mittagessen inbegriffen.
              en: Water is included with lunch.
              ru: Вода включена в стоимость обеда.
          dinner:
            enabled: true
            servingTime: { from: "18:00", to: "21:00" }
            serviceMethod: served
            drinksIncluded: false
            drinksNote:
              cs-CZ: Nápoje se hradí samostatně.
              de: Getränke werden separat berechnet.
              en: Drinks are charged separately.
              ru: Напитки оплачиваются отдельно.
        indications: [musculoskeletal, cardiovascular, diabetes]
        staffLanguages: [cs, de, en]
        amenityCategories:
          - category:
              code: wellness
              label:
                cs-CZ: Bazény a wellness
                de: Pools & Wellness
                en: Pools & wellness
                ru: Бассейны и велнес
            amenities:
              - code: aquapark
                proximity: nearby
                proximityMeters: 250
                access: included
                openingHours:
                  continuous: false
                  blocks:
                    - days: [monday, tuesday, wednesday, thursday, friday]
                      from: "09:00"
                      to: "21:00"
              - code: sauna
                proximity: in-hotel
                proximityMeters: null
                access: included
                options:
                  - code: finnish
                    label:
                      cs-CZ: Finská sauna
                      de: Finnische Sauna
                      en: Finnish sauna
                      ru: Финская сауна
                  - code: steam
                    label:
                      cs-CZ: Parní lázeň
                      de: Dampfbad
                      en: Steam bath
                      ru: Паровая баня
                openingHours:
                  continuous: false
                  blocks:
                    - days: [monday, tuesday, wednesday, thursday, friday]
                      from: "09:00"
                      to: "21:00"
          - category:
              code: parking
