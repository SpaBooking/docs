  /visit-types/{visitTypeId}:
    get:
      tags:
        - Visit types
      summary: Get a visit type
      operationId: getVisitType
      x-mint:
        content: |
          <Warning>
            **Draft:** This endpoint is not yet released on the production API.
            Its contract is complete and published for integration review.
          </Warning>
      description: |
        Returns one published [visit type](/api/objects/visit-type), including
        an unavailable one. An unknown, unauthorized or unpublished id returns
        `404`; a malformed id returns `400`.
        [Authentication](/api/authentication) determines the channel and the
        companies in scope.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: visitTypeId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Visit type id.
        - name: expand
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - hotels
                - seasons
          description: >-
            Comma-separated expansions. `hotels` adds `hotels[].hotel`; `seasons` adds
            `hotels[].seasons`. See [Expand](/api/expand).
        - name: hotelId
          in: query
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: >-
            Return only this hotel's `hotels[]` entry, for example together with `expand=seasons`.
            `priceFrom`, availability, `channelContent` and `promotions` describe the whole package
            and do not change. An unlinked or unauthorized id returns `200` with `hotels: []`.
