  /visit-types/{visitTypeId}:
    get:
      tags:
        - Visit types
      summary: Get a visit type
      operationId: getVisitType
      x-mint:
        content: |
          <Warning>
            **Draft:** This endpoint is still in progress. Its parameters and
            response shape may change before it is finalized.
          </Warning>
      description: "**Draft:** Returns one published visit type, including unavailable ones. See the
        [Visit type](/api/objects/visit-type) object and [publication
        rules](/api/visit-types#publication-and-availability). Unknown, unauthorized or unpublished
        ids return the same 404. After authentication, malformed ids return 400.
        [Authentication](/api/authentication) determines the channel and company scope."
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: visitTypeId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Visit type id.
        - name: expand
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - hotels
                - seasons
          description: "Independent, comma-separated expansions: hotels adds hotels[].hotel; seasons adds
            hotels[].seasons. Combine as expand=hotels,seasons. CSV parsing and the 500-character
            limit follow the [list endpoint](/api/v2/reference/visit-types/list-visit-types).
            See [Expand](/api/expand)."
        - name: hotelId
          in: query
          schema:
            type: string
            description: Hotel id.
            pattern: ^[0-9a-fA-F]{24}$
          description: Narrow only hotels[] to this hotel; useful with expand=seasons. Top-level priceFrom,
            availability, collections and promotions remain unchanged. A valid unlinked or
            unauthorized hotel id returns 200 with hotels:[]; malformed ids return 400.
