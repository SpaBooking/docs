openapi: 3.0.3
info:
  title: SpaPortal API v2
  version: "2.0"
  description: The current SpaPortal public API.
servers:
  - url: https://spaportal.cz/api/v2
    description: Production
security:
  - spaPortalPublicKey: []
tags:
  - name: Hotels
  - name: Room types
  - name: Visit types
  - name: Amenity categories
paths:
  /amenity-categories:
    get:
      tags:
        - Amenity categories
      summary: List the amenity dictionary
      operationId: getAmenityCategories
      description: |
        Returns the amenity dictionary: amenity categories, their amenities,
        and localized labels. Without `scope`, it returns hotel categories
        followed by room type categories. The dictionary is returned in one
        response, without pagination.

        Use it to resolve the amenity codes in hotel and room type responses
        and to build amenity filters. See [Amenities](/api/amenities) for the
        structure, detail kinds, and caching.
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - hotel
              - roomType
          description: >-
            Filter by `hotel` or `roomType`. By default, the response includes both.
            Empty or unknown scopes (including `all`) return `400`.
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag from a previous response. When the dictionary variant is unchanged, the
            API returns `304` with no body. See [Caching](/api/amenities#caching).
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The amenity dictionary.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            ETag:
              $ref: "#/components/headers/ETag"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmenityCategoriesList"
              example:
                data:
                  - category:
                      scope: hotel
                      code: wellness
                      label:
                        cs-CZ: Bazény a wellness
                        de: Pools & Wellness
                        en: Pools & wellness
                    amenities:
                      - code: sauna
                        label:
                          cs-CZ: Sauna
                          de: Sauna
                          en: Sauna
                        detailKinds:
                          - proximity
                          - pricing
                          - options
                          - opening_hours
                        options:
                          - code: finnish
                            label:
                              cs-CZ: Finská sauna
                              de: Finnische Sauna
                              en: Finnish sauna
                          - code: infrared
                            label:
                              cs-CZ: Infra sauna
                              de: Infrarotsauna
                              en: Infrared sauna
                          - code: steam
                            label:
                              cs-CZ: Parní lázeň
                              de: Dampfbad
                              en: Steam bath
                  - category:
                      scope: roomType
                      code: view
                      label: { cs-CZ: Výhled, de: Aussicht, en: View }
                    amenities:
                      - code: balcony
                        label: { cs-CZ: Balkon, de: Balkon, en: Balcony }
                        detailKinds: [coverage]
        "304":
          description: The cached dictionary variant matched by `If-None-Match` is still current.
            The response has no body.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /calendar/dates/bulk:
    post:
      x-hidden: true
      tags: [Availability]
      summary: Get calendar dates in bulk
      operationId: getCalendarDatesBulk
      description: |
        Returns availability and prices for multiple calendar queries in one
        request.

        Put values common to all items in `shared`; set only the differences per
        item. Each item's effective query resolves like this:

        | Case | Result |
        | --- | --- |
        | Field omitted from the item | The `shared` value is used. |
        | Field set on the item | The item value overrides `shared`. |
        | Field set to `null` on the item | `null` is used; `shared` is ignored. |
        | Field missing from both | `null` is used. |

        Results are returned one per item, in request order; `key` is echoed when
        supplied. `price.amounts` includes every currency that has a price for
        the date — a currency with no price is omitted. Per-date prices include
        any active discount promotions.

        If any item fails, the whole request fails (no partial results); the
        error details name the failing item index and `key`.

        An item that resolves to no `dateFrom` and no `dateTo` starts at the
        first month that contains a stay you can actually book, exactly as `GET
        /calendar/dates` does in API v1. For the visit type's minimum stay
        length, every occupied night must have remaining capacity and a price,
        the check-out date must be priced, and the check-in date must be an
        allowed starting day. Nearer months that are only bookable on request
        are skipped. `hotelId` and `visitTypeId` are required for this lookup;
        `roomTypeId` is optional. Without it, the API searches room types that
        match `guests`, but the whole stay must fit into one room type. Capacity
        from different room types is never combined. Send `guests` so the API
        searches the intended occupancy. If no bookable stay is found, the
        normal non-empty fallback calendar is returned. Priced dates that meet
        the visit type's starting-day and date-range rules remain selectable,
        including dates whose resulting stay is on request. Set `dateFrom` or
        `dateTo` to disable the automatic first-bookable-month lookup.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarDatesBulkRequest"
      responses:
        "200":
          description: Calendar date results for each item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarDatesBulkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /hotels:
    get:
      tags: [Hotels]
      summary: List hotels
      operationId: getHotels
      description: |
        Returns active hotels across the companies your public key is scoped to.
        A hotel includes its localized short description and sales-channel
        content, structured accommodation rules, meal services, indications,
        staff languages, and hotel [amenities](/api/amenities#assigned-amenities).
        Localized fields return
        the locale keys selected by `Accept-Language`. `name` falls back to the
        default locale (cs-CZ); other untranslated values are returned as null.

        `priceFrom` holds the lowest prices the hotel currently sells, per
        currency, for all stays (`all`) and per category (`health`,
        `wellness`), each with two independent minima: `perPersonPerNight`
        and `perStay`. Each offer requires a permitted, fully priced stay with
        remaining room capacity for every night. On-demand stays are excluded.
        It is null when no such stay is available. See
        [Prices](/api/prices).

        See the [Hotel](/api/objects/hotel) object for the full field
        reference, including the allowed values for `serviceMethod`,
        `indications`, and `staffLanguages`.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of records to return. See [Pagination](/api/pagination).
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2000
          description: Cursor from the previous page's `pagination.nextCursor`. See [Pagination](/api/pagination).
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
          description: >-
            Literal substring search of the hotel name across all supported languages
            (case- and diacritics-insensitive).
        - name: sort
          in: query
          schema:
            type: string
            enum: ["createdAt:desc", "createdAt:asc"]
            default: "createdAt:desc"
          description: >-
            Orders by unique record id descending or ascending. IDs generally
            follow creation order; this is not a separate timestamp sort.
            Keep the sort and filters unchanged while paging. Cursors do not
            freeze a snapshot when records change between requests.
        - name: amenities
          in: query
          schema:
            type: string
            maxLength: 500
          description: >-
            Comma-separated hotel amenity codes. Returns hotels that have all
            listed amenities, for example `sauna,parking`. Unknown codes return
            `400`. See [Filtering](/api/amenities#filtering).
        - name: amenityCategory
          in: query
          schema:
            type: string
            enum: [health, wellness, dining, services, accessibility, parking, sport, children]
          description: >-
            Hotel amenity category code. Returns hotels that have at least one
            amenity in this category, for example `wellness`. See
            [Filtering](/api/amenities#filtering).
        - name: expand
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [roomTypes, amenityLabels]
          description: >-
            Comma-separated expansions, for example `roomTypes,amenityLabels`.
            `amenityLabels` adds localized labels to amenity categories,
            amenities, and options, including those of embedded room types; see
            [Labels](/api/amenities#labels). `roomTypes` embeds each hotel's
            enabled, non-draft room types (otherwise fetch them via
            `GET /room-types?hotelId={hotelId}`).
      responses:
        "200":
          description: A paginated list of hotels.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelsList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /hotels/{hotelId}:
    get:
      tags: [Hotels]
      summary: Get a hotel
      operationId: getHotel
      description: |
        Returns a single hotel by id with its localized content, structured
        profile, and [amenities](/api/amenities#assigned-amenities).

        `priceFrom` has the same shape as in the hotel list; see
        [Prices](/api/prices).

        See the [Hotel](/api/objects/hotel) object for the full field
        reference, including the allowed values for `serviceMethod`,
        `indications`, and `staffLanguages`.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: hotelId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: Hotel id.
        - name: expand
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [roomTypes, amenityLabels]
          description: >-
            Comma-separated expansions, for example `roomTypes,amenityLabels`.
            `amenityLabels` adds localized labels to amenity categories,
            amenities, and options, including those of embedded room types; see
            [Labels](/api/amenities#labels). `roomTypes` embeds the hotel's
            enabled, non-draft room types (otherwise fetch them via
            `GET /room-types?hotelId={hotelId}`).
      responses:
        "200":
          description: The hotel.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /room-types:
    get:
      tags:
        - Room types
      summary: List room types
      operationId: getRoomTypes
      description: |
        Returns room types of active hotels across the companies your public
        key is scoped to. Localized fields (`name`, `description`) return
        the locale keys selected by `Accept-Language`.

        Only enabled room types are returned by default (`disabled=false`). Use
        `disabled=true` for disabled room types or `disabled=all` for both states.
        Draft room types are never returned.

        See the [Room type](/api/objects/room-type) object for the full field reference.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of records to return. See [Pagination](/api/pagination).
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2000
          description: Cursor from the previous page's `pagination.nextCursor`. See
            [Pagination](/api/pagination).
        - name: hotelId
          in: query
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Filter by hotel id.
        - name: disabled
          in: query
          schema:
            type: string
            enum: ["false", "true", "all"]
            default: "false"
          description: Use false (the default) for enabled room types, true for disabled
            room types, or all for both. The filter applies before pagination and totals.
        - name: occupancy
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
          description: >-
            Filter room types by their exact standard occupancy, the number of guests
            included in the base price. Pass an integer in the query string, for example
            `?occupancy=2`, to return room types whose response contains
            `occupancy.standard: 2`. This filter does not match maximum capacity or
            a specific guest party.
        - name: code
          in: query
          schema:
            type: string
            maxLength: 200
          description: Filter by exact room type code.
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
          description: Search the room type name (case- and diacritics-insensitive).
            To match a room type code, use code.
        - name: expand
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - hotel
                - amenityLabels
          description: >-
            Comma-separated expansions. `hotel` embeds the hotel's `id`, `name`,
            and `stars`. `amenityLabels` adds localized labels to amenity
            categories and amenities; see [Labels](/api/amenities#labels). You
            can request both.
          style: form
          explode: false
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - createdAt:desc
              - createdAt:asc
            default: createdAt:desc
          description: >-
            Orders by unique record id descending or ascending. IDs generally
            follow creation order; this is not a separate timestamp sort.
            Keep the sort and filters unchanged while paging. Cursors do not
            freeze a snapshot when records change between requests.
        - name: unitType
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - single
                - double_double
                - double_twin
                - double_either
                - triple
                - quad
                - family
                - suite
                - studio
                - apartment
          description: Match any of the comma-separated unit type codes.
        - name: tier
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - economy
                - economy_plus
                - standard
                - standard_plus
                - komfort
                - komfort_plus
                - superior
                - deluxe
          description: Match any of the comma-separated tier codes.
        - name: amenities
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: >-
            Comma-separated room type amenity codes. Returns room types that
            have all listed amenities, for example `balcony,bathtub` or
            `parking,welcome_drink`. Matches room assignments only; hotel
            amenities are not inherited by this filter. Unknown codes return
            `400`. See [Filtering](/api/amenities#filtering).
        - name: amenityCategory
          in: query
          schema:
            type: string
            enum:
              - bathroom
              - equipment
              - accessibility
              - view
              - kitchen
              - inclusions
          description: >-
            Room type amenity category code. Returns room types that have at
            least one amenity in this category, for example `view` or `inclusions`. See
            [Filtering](/api/amenities#filtering).
      responses:
        "200":
          description: A paginated list of room types.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomTypesList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /room-types/{roomTypeId}:
    get:
      tags:
        - Room types
      summary: Get a room type
      operationId: getRoomType
      description: |
        Returns a single room type by id.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: roomTypeId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Room type id.
        - name: expand
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - hotel
                - amenityLabels
          description: >-
            Comma-separated expansions. `hotel` embeds the hotel's `id`, `name`,
            and `stars`. `amenityLabels` adds localized labels to amenity
            categories and amenities; see [Labels](/api/amenities#labels). You
            can request both.
          style: form
          explode: false
      responses:
        "200":
          description: The room type.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /visit-types:
    get:
      tags:
        - Visit types
      summary: List visit types
      operationId: getVisitTypes
      x-mint:
        content: |
          <Warning>
            **Draft:** This endpoint is still in progress. Its parameters and
            response shape may change before it is finalized.
          </Warning>
      description: |
        **Draft:** Returns visit types of the companies your public key is
        scoped to. Localized fields return the locale keys selected by
        `Accept-Language`.

        Only visit types offered now are returned by default (`available=true`).
        Use `available=false` for visit types that are not offered now, or
        `available=all` for both. A visit type without a Czech name is never
        returned. Filters apply before pagination and `pagination.total`.

        Results follow the website order by default (`sort=webOrder`), one
        order across all companies of your public key. Cursors do not freeze
        a snapshot: when visit types change between requests, or when
        availability and promotions change at midnight (Europe/Prague), paging
        can skip or repeat a visit type. To export a consistent catalog, start
        again after a change and deduplicate by `id`. Paging an unchanged
        catalog within one day returns every visit type exactly once.

        See the [Visit type](/api/objects/visit-type) object for the full field reference.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of records to return. See [Pagination](/api/pagination).
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2000
          description: >-
            Cursor from the previous page's `pagination.nextCursor`. Keep the
            sort and filters unchanged while paging. See
            [Pagination](/api/pagination).
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - webOrder
              - createdAt:desc
              - createdAt:asc
            default: webOrder
          description: >-
            `webOrder` (the default) follows the website position: visit types
            with a position come first, by position, then the others; visit
            types with the same position keep a stable order. The order is
            shared across all companies of your public key. `createdAt:desc`
            and `createdAt:asc` order by unique record id, which generally
            follows creation order. Cursors do not freeze a snapshot: changes
            between requests and the change of day at midnight (Europe/Prague)
            can skip or repeat a visit type.
        - name: available
          in: query
          schema:
            type: string
            enum: ["true", "false", "all"]
            default: "true"
          description: >-
            `true` (the default) returns visit types offered now, `false` those
            that are not, and `all` both. See
            [Availability](/api/objects/visit-type#availability).
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
          description: Search the visit type name in any language (case- and diacritics-insensitive).
        - name: hotelId
          in: query
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Return visit types sold by this hotel, so that `hotelIds` contains the id.
        - name: stayCategory
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [health, wellness]
          description: Match any of the comma-separated stay categories.
        - name: collection
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/VisitTypeCollection"
          description: >-
            Match visit types in any of the comma-separated collections. See
            [Collections](/api/objects/visit-type#collections).
        - name: paymentType
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [self, plp, klp]
          description: >-
            Match any of the comma-separated payment types. Only health stays
            have a payment type.
        - name: bookingMode
          in: query
          schema:
            type: string
            enum: [instant, request]
          description: Match the booking mode.
        - name: procedure
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TreatmentProcedureCode"
          description: >-
            Comma-separated procedure codes. Returns visit types that list all
            of them in `treatment.procedures.items`; visit types with
            `selection: hotel_offer` never match. See
            [Treatment](/api/treatment).
        - name: meal
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/MealCode"
          description: Match visit types whose included meal plan (`meals.included`) is any of the comma-separated codes.
        - name: nights
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 693
          description: >-
            Return visit types that permit a stay of this many nights: between
            `stayLength.minNights` and `stayLength.maxNights`, and in whole
            weeks for a `week` stay. Visit types with `stayLength: null` never
            match.
        - name: arrivalFrom
          in: query
          schema:
            type: string
            format: date
          description: >-
            First day of the arrival window (inclusive). Send it together with
            `arrivalTo`, on or before it; the window spans at most 366 days. A
            missing `arrivalTo`, a reversed window or a longer one returns
            `400`. A visit type matches when at least one day of the window,
            from today on, passes its arrival rules and the departure after
            `nights` nights (or its shortest stay) is permitted. Capacity and
            prices are not checked. A window entirely in the past returns no
            visit types, and visit types with `stayLength: null` never match.
        - name: arrivalTo
          in: query
          schema:
            type: string
            format: date
          description: Last day of the arrival window (inclusive). Send it together with `arrivalFrom`.
        - name: expand
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [hotels]
          description: Comma-separated expansions. `hotels` embeds each hotel's `id`, `name`, and `stars`.
      responses:
        "200":
          description: A paginated list of visit types.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitTypesList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
