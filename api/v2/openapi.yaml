    HotelsList:
      type: object
      required: [ data, pagination ]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Hotel"
        pagination:
          $ref: "#/components/schemas/Pagination"
    PriceFromVisitType:
      type: object
      required: [ id, name ]
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: >-
            Visit type whose offer gives this minimum. Open it with `GET /visit-types/{visitTypeId}`
            using the same public key.
        name:
          $ref: "#/components/schemas/VisitTypeNameLocalizedString"
    VisitTypeNameLocalizedString:
      type: object
      additionalProperties: false
      properties:
        cs-CZ:
          type: string
          minLength: 1
        de:
          type: string
          minLength: 1
        en:
          type: string
          minLength: 1
        ru:
          type: string
          minLength: 1
      description: >-
        Localized visit type name keyed by response locale (`cs-CZ`, `de`, `en`, `ru`). A missing
        requested translation falls back to the Czech name, like the hotel `name`.
    PriceFromHotel:
      type: object
      required: [ id, name ]
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: Hotel whose offer gives this minimum.
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized hotel name. A missing translation falls back to the Czech name; the value is
            null when neither exists.
    MoneyOrNull:
      type: object
      nullable: true
      required: [ amountMinor, currency, currencyExponent ]
      properties:
        amountMinor:
          type: integer
          description: Amount in minor units, for example cents or haléře.
        currency:
          type: string
          enum: [ CZK, EUR ]
        currencyExponent:
          type: integer
          enum: [ 2 ]
          description: Number of decimal places of `amountMinor`.
      description: A `Money` amount, or null.
    PriceFromMinimum:
      type: object
      description: >-
        One complete, buyable offer selected by the [pricing rules](/api/prices). See
        [Price from](/api/objects/price-from).
      required: [ amount, original, nights, occupancy, hotel, visitType ]
      properties:
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Price of the offer after its applicable promotions.
        original:
          allOf:
            - $ref: "#/components/schemas/MoneyOrNull"
          description: >-
            Price of the same offer before its promotions. Null when no promotion lowers this
            minimum's rounded amount. See [Minimum fields](/api/objects/price-from#minimum-fields).
        nights:
          type: integer
          minimum: 1
          description: Number of nights of the offer.
        occupancy:
          type: integer
          minimum: 1
          description: >-
            Standard occupancy of the offer's room type. `perStay` amounts cover this many guests;
            `perPersonPerNight` amounts are averaged over them.
        hotel:
          allOf:
            - $ref: "#/components/schemas/PriceFromHotel"
          description: Hotel of the offer.
        visitType:
          allOf:
            - $ref: "#/components/schemas/PriceFromVisitType"
          description: Visit type of the offer.
      example:
        amount:
          amountMinor: 50400
          currency: EUR
          currencyExponent: 2
        original:
          amountMinor: 56000
          currency: EUR
          currencyExponent: 2
        nights: 7
        occupancy: 1
        hotel:
          id: 6720c0a1b2c3d4e5f6a7c101
          name:
            cs-CZ: Hotel Pramen
            de: Hotel Pramen
        visitType:
          id: 6720c0a1b2c3d4e5f6a7b801
          name:
            cs-CZ: Klasická lázeňská léčba
            de: Klassische Kur
    PriceFromPair:
      type: object
      required: [ perPersonPerNight, perStay ]
      properties:
        perPersonPerNight:
          allOf:
            - $ref: "#/components/schemas/PriceFromMinimum"
          description: The offer with the lowest average price per guest per night.
        perStay:
          allOf:
            - $ref: "#/components/schemas/PriceFromMinimum"
          description: >-
            The offer with the lowest total for the whole room and stay at its standard occupancy.
            Selected independently of `perPersonPerNight`; the two can be different offers.
      description: Two independently selected minima for one currency. See [Prices](/api/prices#two-independent-minima).
    HotelPriceFromCurrency:
      type: object
      required: [ all ]
      properties:
        all:
          allOf:
            - $ref: "#/components/schemas/PriceFromPair"
          description: Minima across every package the hotel sells.
        health:
          allOf:
            - $ref: "#/components/schemas/PriceFromPair"
          description: Minima across health packages only. Omitted when none has a buyable offer in this currency.
        wellness:
          allOf:
            - $ref: "#/components/schemas/PriceFromPair"
          description: Minima across wellness packages only. Omitted when none has a buyable offer in this currency.
      description: Hotel-wide and per-category minima for one currency. See [Comparing hotel groups](/api/prices#comparing-hotel-groups).
    VisitType:
      type: object
      description: >-
        A stay package sold by one or more hotels. See [Visit type](/api/objects/visit-type) for
        the field reference and [Visit types](/api/visit-types) for availability and stay rules.
      required:
        - id
        - name
        - shortDescription
        - category
        - payer
        - bookingMode
        - available
        - unavailableReason
        - webOrder
        - channelContent
        - board
        - stayLength
        - validity
        - arrival
        - treatment
        - priceFrom
        - promotions
        - hotels
        - images
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: Visit type id. Price minima reference the visit type by this id.
        name:
          allOf:
            - $ref: "#/components/schemas/VisitTypeNameLocalizedString"
          description: Localized name. A missing translation falls back to the Czech name.
        shortDescription:
          $ref: "#/components/schemas/VisitTypeShortDescription"
        category:
          type: string
          enum:
            - health
            - wellness
          description: "`health` is a spa cure with medical treatment; `wellness` is a wellness stay."
        payer:
          type: string
          nullable: true
          enum:
            - guest
            - guest_and_insurer
            - insurer
            - null
          description: >-
            Who pays for a health stay; null for wellness stays. See
            [Payer](/api/objects/visit-type#category-payer-and-booking-mode).
        bookingMode:
          type: string
          enum:
            - instant
            - request
          description: >-
            `instant`: a booking is confirmed immediately when a room is available. `request`: every
            booking is a request that the hotel confirms. Insurer-paid stays are always `request`.
        available:
          type: boolean
          description: >-
            Whether the package is offered now. Independent of room capacity and prices on
            particular dates.
        unavailableReason:
          type: string
          nullable: true
          enum:
            - disabled
            - ended
            - no_arrival
            - no_hotels
            - null
          description: >-
            Why the package is unavailable; null when it is available. See
            [Availability](/api/objects/visit-type#availability).
        webOrder:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            Position of the package on the website, starting at 1, or null when it has none. Used by
            `sort=webOrder`.
        channelContent:
          $ref: "#/components/schemas/VisitTypeChannelContent"
        board:
          $ref: "#/components/schemas/Board"
        stayLength:
          $ref: "#/components/schemas/VisitTypeStayLength"
        validity:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/VisitTypeValidityPeriod"
          description: >-
            Current and future validity periods, ordered by `from`, then `to`. Null when no periods
            are configured; empty when every configured period has ended. See
            [Validity](/api/objects/visit-type#validity).
        arrival:
          $ref: "#/components/schemas/VisitTypeArrival"
        treatment:
          $ref: "#/components/schemas/Treatment"
        priceFrom:
          type: object
          nullable: true
          additionalProperties: false
          minProperties: 1
          properties:
            CZK:
              $ref: "#/components/schemas/PriceFromPair"
            EUR:
              $ref: "#/components/schemas/PriceFromPair"
          description: >-
            Lowest prices across all hotels selling the package, per currency. A currency is present
            only when it has a buyable offer. Null when the package is unavailable, booked on request
            or has no buyable offer. See [Prices](/api/prices).
        promotions:
          type: array
          items:
            $ref: "#/components/schemas/Promotion"
          description: >-
            Current and future promotions that apply to your channel, ordered by `from`, then `id`.
            Empty when none applies.
        hotels:
          type: array
          items:
            $ref: "#/components/schemas/VisitTypeAtHotel"
          description: >-
            Active hotels selling the package, ordered by Czech hotel name, then id. An entry is
            present even when the hotel has no buyable price.
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
          description: >-
            Photos in configured order; the first is the main photo. A missing `alt` translation
            falls back to the localized package name; an empty `alt` marks a decorative image. See
            [Images](/api/images).
      # Cross-field rules, written as forbidden combinations: the schema keeps
      # enforcing them without presenting the object as several variants.
      not:
        anyOf:
          - type: object
            required: [ category, payer ]
            properties:
              category:
                enum: [ wellness ]
              payer:
                type: string
          - type: object
            required: [ category, payer ]
            properties:
              category:
                enum: [ health ]
              payer:
                type: string
                nullable: true
                enum: [ null ]
          - type: object
            required: [ payer, bookingMode ]
            properties:
              payer:
                enum: [ insurer ]
              bookingMode:
                enum: [ instant ]
          - type: object
            required: [ available, unavailableReason ]
            properties:
              available:
                enum: [ true ]
              unavailableReason:
                type: string
          - type: object
            required: [ available, unavailableReason ]
            properties:
              available:
                enum: [ false ]
              unavailableReason:
                type: string
                nullable: true
                enum: [ null ]
