    VisitTypesList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VisitType"
          description: Visit types on this page.
        pagination:
          allOf:
            - $ref: "#/components/schemas/Pagination"
          description: Cursor of the next page and the total number of matching visit types.
    VisitTypeChannelContent:
      type: object
      required: [ collections ]
      properties:
        collections:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/VisitTypeCollection"
          description: >-
            Website collections the package belongs to, in code-list order. Returned only for the
            company's own website channel; other channels receive an empty array.
      description: >-
        Content for the sales channel of your public key. See
        [Channel content](/api/objects/visit-type#channel-content).
    VisitTypeCollection:
      type: string
      description: >-
        Website collection code. See [Channel content](/api/objects/visit-type#channel-content) for
        the meaning of each code.
      enum:
        - advent_christmas_new_year
        - families_with_children
        - wellness
        - treatment_stays
        - special_offers
        - hotel_stay
    MealCode:
      type: string
      enum:
        - breakfast
        - lunch
        - dinner
        - all_inclusive
      description: Meal code. See [Board](/api/objects/visit-type#board).
    VisitTypeStayLength:
      type: object
      required:
        - unit
        - min
        - max
      properties:
        unit:
          type: string
          enum:
            - night
            - week
          description: Unit of `min` and `max`. A week is seven nights.
        min:
          type: integer
          minimum: 1
          description: Shortest permitted stay, in `unit`.
        max:
          type: integer
          nullable: true
          minimum: 1
          description: Longest permitted stay, in `unit`, at least `min`. Null when the package has no maximum.
      description: Permitted stay length. See [Stay length and arrival](/api/objects/visit-type#stay-length-and-arrival).
    VisitTypeValidityPeriod:
      type: object
      required:
        - from
        - to
        - toAppliesTo
      properties:
        from:
          type: string
          format: date
          description: First permitted arrival date.
        to:
          type: string
          format: date
          description: Last permitted date, inclusive. Interpreted by `toAppliesTo`.
        toAppliesTo:
          type: string
          enum:
            - arrival
            - departure
          description: "`arrival`: `to` is the last permitted arrival date. `departure`: `to` is the last permitted checkout date."
    VisitTypeArrival:
      oneOf:
        - $ref: "#/components/schemas/VisitTypeWeekdayArrival"
        - $ref: "#/components/schemas/VisitTypeDateArrival"
      discriminator:
        propertyName: type
        mapping:
          weekdays: "#/components/schemas/VisitTypeWeekdayArrival"
          dates: "#/components/schemas/VisitTypeDateArrival"
      description: >-
        Permitted arrival days: either weekdays or explicit dates. See
        [Stay length and arrival](/api/objects/visit-type#stay-length-and-arrival).
    Weekday:
      type: string
      description: Weekday code, the lowercase English day name.
      enum:
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
        - sunday
    VisitTypeExams:
      type: object
      required: [ entry, interim, interimFromNights, final, finalFromNights ]
      properties:
        entry:
          type: boolean
          description: An entry examination at the start of the stay is included.
        interim:
          type: boolean
          description: An interim examination during the stay is included.
        interimFromNights:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            Shortest stay, in nights, that includes the interim examination. Null when it is
            included for every stay length or not included at all.
        final:
          type: boolean
          description: A final examination at the end of the stay is included.
        finalFromNights:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            Shortest stay, in nights, that includes the final examination. Null when it is included
            for every stay length or not included at all.
      # A threshold exists only for an included examination.
      not:
        anyOf:
          - type: object
            required: [ interim, interimFromNights ]
            properties:
              interim:
                enum: [ false ]
              interimFromNights:
                type: integer
          - type: object
            required: [ final, finalFromNights ]
            properties:
              final:
                enum: [ false ]
              finalFromNights:
                type: integer
    VisitTypeProcedures:
      type: object
      required: [ count, per, selection, items ]
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of included procedures per `per`. Zero means no procedure allowance.
        per:
          type: string
          enum: [ stay, week, day ]
          description: Unit of `count`.
        selection:
          type: string
          enum: [ hotel_offer, from_list, fixed ]
          description: >-
            How the procedures are chosen. `hotel_offer`: from the hotel's offer; `items` is empty.
            `from_list`: the guest chooses from `items`. `fixed`: `items` are included, each with its
            own `count`.
        items:
          type: array
          items:
            $ref: "#/components/schemas/TreatmentProcedure"
          description: Procedures in configured order. Empty for `hotel_offer`.
      # Item counts follow the selection mode.
      not:
        anyOf:
          - type: object
            required: [ selection, items ]
            properties:
              selection:
                enum: [ hotel_offer ]
              items:
                type: array
                minItems: 1
          - type: object
            required: [ selection, items ]
            properties:
              selection:
                enum: [ from_list ]
              items:
                type: array
                not:
                  items:
                    type: object
                    required: [ count ]
                    properties:
                      count:
                        type: integer
                        nullable: true
                        enum: [ null ]
          - type: object
            required: [ selection, items ]
            properties:
              selection:
                enum: [ fixed ]
              items:
                type: array
                not:
                  items:
                    type: object
                    required: [ count ]
                    properties:
                      count:
                        type: integer
                        minimum: 1
    TreatmentProcedure:
      type: object
      required:
        - code
        - label
        - category
        - naturalSource
        - count
      properties:
        code:
          $ref: "#/components/schemas/Procedure/properties/code"
        label:
          $ref: "#/components/schemas/Procedure/properties/label"
        category:
          $ref: "#/components/schemas/Procedure/properties/category"
        naturalSource:
          $ref: "#/components/schemas/Procedure/properties/naturalSource"
        count:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            How many times the procedure is included during the whole stay. A positive integer for
            `selection: fixed`, otherwise null. Item counts do not use `per` and need not add up to
            the overall `count`.
      description: A [Procedure](/api/objects/procedure) with its count in a package.
    TreatmentProcedureCategory:
      type: object
      required: [ code, label ]
      properties:
        code:
          allOf:
            - $ref: "#/components/schemas/TreatmentCategoryCode"
          description: Category code.
        label:
