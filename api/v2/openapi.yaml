openapi: 3.0.3
info:
  title: SpaPortal API v2
  version: "2.0"
  description: The current SpaPortal public API.
servers:
  - url: https://spaportal.cz/api/v2
    description: Production
security:
  - spaPortalPublicKey: []
tags:
  - name: Hotels
  - name: Room types
  - name: Amenities
paths:
  /amenities:
    get:
      tags: [Amenities]
      summary: List the amenity dictionary
      operationId: getAmenities
      description: |
        Returns the full hotel amenity dictionary. Each item has a stable `code`,
        localized label and category, and the detail kinds supported by that
        amenity. Fetch it to build amenity filters and resolve the codes returned
        in `hotel.amenities`. This small reference list is not paginated.

        See the [Amenity](/api/objects/amenity) object for the full field reference.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The amenity dictionary.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmenitiesList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /calendar/dates/bulk:
    post:
      x-hidden: true
      tags: [Availability]
      summary: Get calendar dates in bulk
      operationId: getCalendarDatesBulk
      description: |
        Returns availability and prices for multiple calendar queries in one
        request.

        Put values common to all items in `shared`; set only the differences per
        item. Each item's effective query resolves like this:

        | Case | Result |
        | --- | --- |
        | Field omitted from the item | The `shared` value is used. |
        | Field set on the item | The item value overrides `shared`. |
        | Field set to `null` on the item | `null` is used; `shared` is ignored. |
        | Field missing from both | `null` is used. |

        Results are returned one per item, in request order; `key` is echoed when
        supplied. `price.amounts` includes every currency that has a price for
        the date — a currency with no price is omitted. Per-date prices include
        any active discount promotions.

        If any item fails, the whole request fails (no partial results); the
        error details name the failing item index and `key`.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarDatesBulkRequest"
      responses:
        "200":
          description: Calendar date results for each item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarDatesBulkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /hotels:
    get:
      tags: [Hotels]
      summary: List hotels
      operationId: getHotels
      description: |
        Returns active hotels across the companies your public key is scoped to.
        A hotel includes its localized short description and sales-channel
        content, structured accommodation rules, meal services, indications,
        staff languages, and hotel-level amenities. Localized fields return
        the locale keys selected by `Accept-Language`. `name` falls back to the
        default locale (cs-CZ); other untranslated values are returned as null.

        `priceFrom` is currently null.

        See the [Hotel](/api/objects/hotel) object for the full field reference.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of records to return. See [Pagination](/api/pagination).
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2000
          description: Cursor from the previous page's `pagination.nextCursor`. See [Pagination](/api/pagination).
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
          description: >-
            Full-text search of the hotel name across all supported languages
            (case- and diacritics-insensitive).
        - name: sort
          in: query
          schema:
            type: string
            enum: ["createdAt:desc", "createdAt:asc"]
            default: "createdAt:desc"
          description: Sort order. Ties are broken by `id`.
        - name: amenities
          in: query
          schema:
            type: string
            maxLength: 500
          description: >-
            Comma-separated amenity `code`s; returns only hotels that have ALL
            listed amenities (AND semantics). E.g. `sauna,parking`.
        - name: amenityCategory
          in: query
          schema:
            type: string
            enum: [health, wellness, dining, services, accessibility, parking, sport, children]
          description: >-
            Returns hotels that have any amenity in this category
            (e.g. `wellness`).
        - name: expand
          in: query
          schema:
            type: string
            enum: [roomTypes]
          description: >-
            Expand related resources inline. Set to `roomTypes` to embed each
            hotel's room types in the response (otherwise fetch them separately
            via `GET /room-types?hotelId={hotelId}`).
      responses:
        "200":
          description: A paginated list of hotels.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelsList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /hotels/{hotelId}:
    get:
      tags: [Hotels]
      summary: Get a hotel
      operationId: getHotel
      description: >-
        Returns a single hotel with its localized content, complete structured
        profile, and amenities by id.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: hotelId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: Hotel id.
        - name: expand
          in: query
          schema:
            type: string
            enum: [roomTypes]
          description: >-
            Expand related resources inline. Set to `roomTypes` to embed the
            hotel's room types in the response (otherwise fetch them separately
            via `GET /room-types?hotelId={hotelId}`).
      responses:
        "200":
          description: The hotel.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /room-types:
    get:
      tags: [Room types]
      summary: List room types
      operationId: getRoomTypes
      description: |
        Returns room types of active hotels across the companies your public
        key is scoped to. Localized fields (`category`, `description`) return
        the locale keys selected by `Accept-Language`.

        See the [Room type](/api/objects/room-type) object for the full field reference.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of records to return. See [Pagination](/api/pagination).
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2000
          description: Cursor from the previous page's `pagination.nextCursor`. See [Pagination](/api/pagination).
        - name: hotelId
          in: query
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: Filter by hotel id.
        - name: beds
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
          description: Filter by number of beds.
        - name: code
          in: query
          schema:
            type: string
            maxLength: 200
          description: Filter by exact room type code.
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
          description: >-
            Full-text search of the localized category name across all supported
            languages (case- and diacritics-insensitive). To match a code, use
            `code`.
        - name: expand
          in: query
          schema:
            type: string
            enum: [hotel]
          description: Set to `hotel` to embed the hotel in each room type.
        - name: sort
          in: query
          schema:
            type: string
            enum: ["createdAt:desc", "createdAt:asc"]
            default: "createdAt:desc"
          description: Sort order. Ties are broken by `id`.
      responses:
        "200":
          description: A paginated list of room types.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomTypesList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /room-types/{roomTypeId}:
    get:
      tags: [Room types]
      summary: Get a room type
      operationId: getRoomType
      description: Returns a single room type by id.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: roomTypeId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: Room type id.
        - name: expand
          in: query
          schema:
            type: string
            enum: [hotel]
          description: Set to `hotel` to embed the hotel.
      responses:
        "200":
          description: The room type.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: Optional client-provided request identifier echoed in error responses.
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        example: cs-CZ,de
      description: >-
        Comma-separated BCP 47 language tags selecting which locale keys
        localized fields return. When omitted, all locale keys are returned.
        See [Localization](/api/localization) for details.
  securitySchemes:
    spaPortalPublicKey:
      type: apiKey
      in: header
      name: X-SpaPortal-Public-Key
      description: "See [Authentication](/api/authentication) for how to obtain and send your public key."
  responses:
    BadRequest:
      description: Invalid request.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid API key.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current state or scoped context.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Resource exists but cannot be used for this request.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected server error.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  headers:
    ContentLanguage:
      description: Comma-separated locale keys included in localized fields.
      schema:
        type: string
        example: cs-CZ,de
    RequestId:
      description: Request identifier for support and debugging.
      schema:
        type: string
  schemas:
    CalendarDatesBulkRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        shared:
          $ref: "#/components/schemas/CalendarDatesBulkQuery"
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/CalendarDatesBulkQueryWithKey"
    CalendarDatesBulkQuery:
      type: object
      additionalProperties: false
      properties:
        visitTypeId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Visit type id.
          nullable: true
        hotelId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Hotel id.
          nullable: true
        roomTypeId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Room type id.
          nullable: true
        destinationId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Destination id.
          nullable: true
        guests:
          type: integer
          minimum: 1
          maximum: 2
          nullable: true
        dateFrom:
          type: string
          format: date
          nullable: true
        dateTo:
          type: string
          format: date
          nullable: true
    CalendarDatesBulkQueryWithKey:
      type: object
      additionalProperties: false
      properties:
        visitTypeId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Visit type id.
          nullable: true
        hotelId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Hotel id.
          nullable: true
        roomTypeId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Room type id.
          nullable: true
        destinationId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Destination id.
          nullable: true
        guests:
          type: integer
          minimum: 1
          maximum: 2
          nullable: true
        dateFrom:
          type: string
          format: date
          nullable: true
        dateTo:
          type: string
          format: date
          nullable: true
        key:
          type: string
          minLength: 1
          maxLength: 100
          description: Optional client key returned with the matching result.
    CalendarDatesBulkResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [key, data]
            properties:
              key:
                type: string
                nullable: true
              data:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarDate"
    CalendarDate:
      type: object
      required: [date, selectable, availability, price]
      properties:
        date:
          type: string
          format: date
        selectable:
          type: boolean
          nullable: true
        availability:
          type: string
          enum: [NOT_AVAILABLE, AVAILABLE, ON_DEMAND]
        price:
          allOf:
            - $ref: "#/components/schemas/CalendarDatePrice"
          nullable: true
    CalendarDatePrice:
      type: object
      required: [isFinal, amounts]
      properties:
        isFinal:
          type: boolean
        amounts:
          type: object
          properties:
            CZK:
              allOf:
                - $ref: "#/components/schemas/Money"
              nullable: true
            EUR:
              allOf:
                - $ref: "#/components/schemas/Money"
              nullable: true
    Money:
      type: object
      required: [amountMinor, currency, currencyExponent]
      properties:
        amountMinor:
          type: integer
          description: Amount in the smallest currency unit.
          example: 180000
        currency:
          type: string
          enum: [CZK, EUR]
        currencyExponent:
          type: integer
          enum: [2]
          description: Decimal exponent for the currency.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - missing_authentication
                - invalid_authentication
                - insufficient_scope
                - not_found
                - conflict
                - rate_limited
                - internal_error
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
            requestId:
              type: string
    LocalizedString:
      type: object
      additionalProperties: false
      properties:
        cs-CZ:
          type: string
          nullable: true
        de:
          type: string
          nullable: true
        en:
          type: string
          nullable: true
        ru:
          type: string
          nullable: true
      description: >-
        Localized field keyed by supported response locale (`cs-CZ`, `de`, `en`,
        `ru`). When `Accept-Language` is set, only the matched keys are returned.
      example:
        cs-CZ: Superior dvouluzkovy pokoj
        de: Superior Doppelzimmer
    HotelNameLocalizedString:
      type: object
      additionalProperties: false
      properties:
        cs-CZ:
          type: string
          minLength: 1
        de:
          type: string
          minLength: 1
        en:
          type: string
          minLength: 1
        ru:
          type: string
          minLength: 1
      description: >-
        Localized hotel name keyed by supported response locale (`cs-CZ`, `de`,
        `en`, `ru`). Missing requested translations fall back to the Czech name,
        so every returned value is a non-empty string.
      example:
        cs-CZ: Spa Resort Pawlik
        de: Kurhotel Pawlik
    Image:
      type: object
      required: [url, thumbnailUrl]
      properties:
        url:
          type: string
          description: Original image URL.
        thumbnailUrl:
          type: string
          nullable: true
          description: Generated preview image URL, or null when unavailable.
    RoomType:
      type: object
      required:
        - id
        - hotelId
        - code
        - category
        - beds
        - facilities
        - images
        - description
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          example: 66f16191f739705faa020003
        hotelId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          example: 66f16191f739705faa020001
        code:
          type: string
          nullable: true
          example: SUPERIOR-DBL
        category:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized category name (plain text).
        beds:
          type: integer
          example: 2
        facilities:
          type: array
          items:
            type: string
          example: [shower, toilet]
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        description:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized description (Markdown).
        hotel:
          type: object
          description: Embedded only when `expand=hotel`.
          required: [id, name, stars]
          properties:
            id:
              type: string
              pattern: "^[0-9a-fA-F]{24}$"
              example: 66f16191f739705faa020001
            name:
              allOf:
                - $ref: "#/components/schemas/HotelNameLocalizedString"
              description: >-
                Localized hotel name. Falls back to the default locale (cs-CZ),
                so it is never null.
              example:
                cs-CZ: Pawlik
                de: Pawlik-Aquaforum
            stars:
              type: integer
              nullable: true
              minimum: 1
              maximum: 5
              example: 4
    Pagination:
      type: object
      required: [limit, nextCursor, hasMore, total]
      properties:
        limit:
          type: integer
          example: 25
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to fetch the next page. Null on the last page.
        hasMore:
          type: boolean
        total:
          type: integer
          description: Total number of matching records across all pages.
    RoomTypesList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RoomType"
        pagination:
          $ref: "#/components/schemas/Pagination"
    HotelAddress:
      type: object
      required: [addressLine, city, postalCode, country]
      properties:
        addressLine:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          pattern: "^[a-z]{3}$"
          description: Lowercase ISO 3166-1 alpha-3 country code.
          example: cze
    HotelDestination:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
        name:
          $ref: "#/components/schemas/LocalizedString"
    HotelTimeRange:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "14:00"
        to:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "22:00"
    HotelChildrenPolicy:
      type: object
      required: [allowed, minimumAge]
      properties:
        allowed:
          type: boolean
        minimumAge:
          type: integer
          minimum: 0
          maximum: 18
          nullable: true
    HotelPetFee:
      type: object
      required: [czk, eur]
      properties:
        czk:
          type: number
          minimum: 0
          nullable: true
          description: Per-night fee in Czech koruna major units.
        eur:
          type: number
          minimum: 0
          nullable: true
          description: Per-night fee in euro major units.
    HotelPetPolicy:
      type: object
      required: [allowed, minimumNights, feePerNight, conditions]
      properties:
        allowed:
          type: boolean
        minimumNights:
          type: integer
          minimum: 0
          nullable: true
        feePerNight:
          $ref: "#/components/schemas/HotelPetFee"
        conditions:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized supplementary conditions for guests with pets. Each
            locale value is at most 300 characters.
    HotelAccommodationRules:
      type: object
      required: [checkIn, checkOut, children, pets]
      properties:
        checkIn:
          $ref: "#/components/schemas/HotelTimeRange"
        checkOut:
          $ref: "#/components/schemas/HotelTimeRange"
        children:
          $ref: "#/components/schemas/HotelChildrenPolicy"
        pets:
          $ref: "#/components/schemas/HotelPetPolicy"
    HotelChannelContent:
      type: object
      required: [tagline]
      properties:
        tagline:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized tagline intended for sales channels. Each locale value
            is at most 100 characters.
    HotelMealService:
      type: object
      required:
        - enabled
        - servingTime
        - serviceMethod
        - drinksIncluded
        - drinksNote
      properties:
        enabled:
          type: boolean
        servingTime:
          $ref: "#/components/schemas/HotelTimeRange"
        serviceMethod:
          type: string
          nullable: true
          enum: [buffet, served]
        drinksIncluded:
          type: boolean
        drinksNote:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized note about included drinks. Each locale value is at
            most 200 characters.
    HotelMealServices:
      type: object
      required: [breakfast, lunch, dinner]
      properties:
        breakfast:
          $ref: "#/components/schemas/HotelMealService"
        lunch:
          $ref: "#/components/schemas/HotelMealService"
        dinner:
          $ref: "#/components/schemas/HotelMealService"
    Hotel:
      type: object
      required:
        - id
        - name
        - shortDescription
        - channelContent
        - stars
        - destination
        - address
        - email
        - phoneNumber
        - url
        - images
        - accommodationRules
        - mealServices
        - indications
        - staffLanguages
        - amenities
        - priceFrom
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          example: 66f16191f739705faa020001
        name:
          allOf:
            - $ref: "#/components/schemas/HotelNameLocalizedString"
          description: >-
            Localized hotel name (plain text). Falls back to the default locale
            (cs-CZ) when a requested locale has no value, so it is never null.
          example:
            cs-CZ: Pawlik
            de: Pawlik-Aquaforum
        shortDescription:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized short hotel description (plain text). Each locale value
            is at most 400 characters.
        channelContent:
          $ref: "#/components/schemas/HotelChannelContent"
        stars:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          example: 4
        destination:
          allOf:
            - $ref: "#/components/schemas/HotelDestination"
          nullable: true
        address:
          $ref: "#/components/schemas/HotelAddress"
        email:
          type: string
          format: email
          nullable: true
        phoneNumber:
          type: string
          nullable: true
        url:
          type: string
          format: uri
          nullable: true
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        accommodationRules:
          $ref: "#/components/schemas/HotelAccommodationRules"
        mealServices:
          $ref: "#/components/schemas/HotelMealServices"
        indications:
          type: array
          description: Medical indications the hotel specializes in, in display order.
          items:
            type: string
            enum:
              - musculoskeletal
              - cardiovascular
              - dermatology
              - digestion_metabolism
              - nervous_system
              - prevention
              - gynecology
              - oncology_aftercare
              - diabetes
        staffLanguages:
          type: array
          description: Languages spoken by hotel staff.
          items:
            type: string
            enum: [cs, en, de, ru]
        amenities:
          type: array
          description: >-
            Selected structured hotel amenities. Resolve `code` against
            `GET /amenities` for its localized label, category and supported
            detail kinds.
          items:
            $ref: "#/components/schemas/AmenityValue"
          example:
            - code: sauna
              proximity: in-hotel
              proximityMeters: null
              access: included
              fee: null
              accessibilityLevel: null
              parkingTypes: []
              saunaTypes: [finnish, steam]
              dietaryOptions: []
              openingHours:
                continuous: false
                blocks:
                  - days: [monday, tuesday, wednesday]
                    from: "09:00"
                    to: "21:00"
              note:
                cs-CZ: null
                de: null
                en: null
        priceFrom:
          allOf:
            - $ref: "#/components/schemas/PriceFrom"
          nullable: true
          description: >-
            Reserved for an indicative cheapest price. The current
            implementation returns null.
        roomTypes:
          type: array
          description: >-
            Embedded only when `expand=roomTypes`;
            otherwise fetch them via `GET /room-types?hotelId={hotelId}`. Each
            item omits the nested `hotel` block (it is this hotel).
          items:
            $ref: "#/components/schemas/RoomType"
      example:
        id: 66f16191f739705faa020001
        name:
          cs-CZ: Spa Resort Pawlik
          de: Kurhotel Pawlik
          en: Spa Resort Pawlik
          ru: Spa Resort Pawlik
        shortDescription:
          cs-CZ: Lázeňský hotel s přímým vstupem do aquaparku.
          de: Kurhotel mit direktem Zugang zum Aquapark.
          en: Spa hotel with direct access to the aquapark.
          ru: null
        channelContent:
          tagline:
            cs-CZ: Lázeňská péče pod jednou střechou
            de: Kurbehandlungen unter einem Dach
            en: Spa care under one roof
            ru: null
        stars: 4
        destination:
          id: 66f16191f739705faa020002
          name:
            cs-CZ: Františkovy Lázně
            de: Franzensbad
            en: Frantiskovy Lazne
            ru: null
        address:
          addressLine: Národní 25
          city: Františkovy Lázně
          postalCode: 351 01
          country: cze
        email: hotel@example.com
        phoneNumber: +420 123 456 789
        url: https://hotel.example.com
        images:
          - url: https://files.example.com/hotel.jpg
            thumbnailUrl: https://files.example.com/hotel-thumbnail.webp
        accommodationRules:
          checkIn: { from: "14:00", to: "20:00" }
          checkOut: { from: "07:00", to: "10:00" }
          children:
            allowed: true
            minimumAge: 6
          pets:
            allowed: true
            minimumNights: 2
            feePerNight:
              czk: 500
              eur: 20
            conditions:
              cs-CZ: Mazlíčci jsou povoleni ve vybraných pokojích.
              de: Haustiere sind in ausgewählten Zimmern erlaubt.
              en: Pets are allowed in selected rooms.
              ru: null
        mealServices:
          breakfast:
            enabled: true
            servingTime: { from: "07:00", to: "10:00" }
            serviceMethod: buffet
            drinksIncluded: true
            drinksNote:
              cs-CZ: Nealkoholické nápoje jsou v ceně.
              de: Alkoholfreie Getränke sind inklusive.
              en: Soft drinks are included.
              ru: null
          lunch:
            enabled: false
            servingTime: { from: null, to: null }
            serviceMethod: null
            drinksIncluded: false
            drinksNote: { cs-CZ: null, de: null, en: null, ru: null }
          dinner:
            enabled: true
            servingTime: { from: "18:00", to: "21:00" }
            serviceMethod: served
            drinksIncluded: false
            drinksNote: { cs-CZ: null, de: null, en: null, ru: null }
        indications: [musculoskeletal, cardiovascular, diabetes]
        staffLanguages: [cs, de, en]
        amenities:
          - code: sauna
            proximity: in-hotel
            proximityMeters: null
            access: included
            fee: null
            accessibilityLevel: null
            parkingTypes: []
            saunaTypes: [finnish, steam]
            dietaryOptions: []
            openingHours:
              continuous: false
              blocks:
                - days: [monday, tuesday, wednesday, thursday, friday]
                  from: "09:00"
                  to: "21:00"
            note: { cs-CZ: null, de: null, en: null, ru: null }
        priceFrom: null
    HotelsList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Hotel"
        pagination:
          $ref: "#/components/schemas/Pagination"
    PriceFromCurrency:
      type: object
      required:
        - perNight
        - perNightOriginal
        - minimumStay
        - minimumStayOriginal
        - guests
        - minimumNights
      properties:
        perNight:
          $ref: "#/components/schemas/Money"
        perNightOriginal:
          allOf:
            - $ref: "#/components/schemas/Money"
          nullable: true
          description: Pre-discount nightly price, or null when there is no discount.
        minimumStay:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Total price for `minimumNights` nights.
        minimumStayOriginal:
          allOf:
            - $ref: "#/components/schemas/Money"
          nullable: true
          description: >-
            Pre-discount total for the minimum stay, or null when there is no
            discount.
        guests:
          type: integer
          description: >-
            Number of guests this "from" price is for (the occupancy with the
            cheapest offer).
          example: 2
        minimumNights:
          type: integer
          description: Minimum number of nights the offer requires.
          example: 2
    PriceFrom:
      type: object
      description: >-
        Indicative cheapest ("from") price for a hotel, keyed by currency. It is the
        lowest offer and is not affected by query parameters. A currency key is
        present only when the hotel has a price in that currency.
      properties:
        CZK:
          allOf:
            - $ref: "#/components/schemas/PriceFromCurrency"
          nullable: true
        EUR:
          allOf:
            - $ref: "#/components/schemas/PriceFromCurrency"
          nullable: true
    AmenityCategory:
      type: object
      required: [code, label]
      properties:
        code:
          type: string
          enum:
            - health
            - wellness
            - dining
            - services
            - accessibility
            - parking
            - sport
            - children
        label:
          $ref: "#/components/schemas/LocalizedString"
    Amenity:
      type: object
      required: [code, category, label, detailKinds]
      description: >-
        One entry in the hotel amenity dictionary returned by
        `GET /amenities`.
      properties:
        code:
          type: string
          description: Stable code stored on hotels and used for filtering.
          example: sauna
        category:
          $ref: "#/components/schemas/AmenityCategory"
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized display name.
          example:
            cs-CZ: Sauna
            de: Sauna
            en: Sauna
        detailKinds:
          type: array
          description: >-
            Structured detail field groups supported by this amenity. Resolve
            these snake-case values to AmenityValue properties as documented in
            the Amenity value object reference.
          items:
            type: string
            enum:
              - proximity
              - access
              - fee
              - accessibility_level
              - parking_types
              - sauna_types
              - dietary_options
              - opening_hours
              - note
        notePlaceholder:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Optional localized helper text for the amenity note. Omitted when
            the amenity does not define one.
    AmenityOpeningHoursBlock:
      type: object
      required: [days, from, to]
      properties:
        days:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - monday
              - tuesday
              - wednesday
              - thursday
              - friday
              - saturday
              - sunday
        from:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "07:00"
        to:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "15:00"
    AmenityOpeningHours:
      type: object
      required: [continuous, blocks]
      properties:
        continuous:
          type: boolean
          description: True when the amenity operates continuously (24/7).
        blocks:
          type: array
          description: Weekly opening-hour blocks. Empty when `continuous` is true.
          items:
            $ref: "#/components/schemas/AmenityOpeningHoursBlock"
    AmenityValue:
      type: object
      required:
        - code
        - proximity
        - proximityMeters
        - access
        - fee
        - accessibilityLevel
        - parkingTypes
        - saunaTypes
        - dietaryOptions
        - openingHours
        - note
      description: >-
        A structured amenity selected for a hotel. Unsupported details are
        returned as null or empty arrays.
      properties:
        code:
          type: string
          description: References an `Amenity.code`.
          example: sauna
        proximity:
          type: string
          nullable: true
          enum: [in-hotel, connecting, nearby]
        proximityMeters:
          type: number
          minimum: 0
          maximum: 1000000
          nullable: true
        access:
          type: string
          nullable: true
          enum: [included, conditional, paid]
        fee:
          type: string
          nullable: true
          enum: [free, conditional, paid]
        accessibilityLevel:
          type: string
          nullable: true
          enum: [full, partial]
        parkingTypes:
          type: array
          items:
            type: string
            enum: [outdoor, covered, guarded]
        saunaTypes:
          type: array
          items:
            type: string
            enum: [finnish, infrared, steam]
        dietaryOptions:
          type: array
          items:
            type: string
            enum: [diet, reduction, gluten-free, diabetic, lactose-free]
        openingHours:
          $ref: "#/components/schemas/AmenityOpeningHours"
        note:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized supplementary information for guests. Locale values are
            at most 200 characters and are null when the amenity does not
            support a note or the translation is not filled.
    AmenitiesList:
      type: object
      required: [data]
      description: >-
        The complete hotel amenity dictionary, returned in one response
        (small, not paginated).
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Amenity"
      example:
        data:
          - code: sauna
            category:
              code: wellness
              label: { cs-CZ: Bazény a wellness, de: Pools & Wellness, en: "Pools & wellness" }
            label: { cs-CZ: Sauna, de: Sauna, en: Sauna }
            detailKinds: [proximity, access, sauna_types, opening_hours]
