    VisitTypeCollection:
      type: string
      description: >-
        Website collection code. See
        [Collections](/api/objects/visit-type#collections) for the meaning of
        each code.
      enum:
        - advent_christmas_new_year
        - families_with_children
        - wellness
        - treatment_stays
        - special_offers
        - hotel_stay
    VisitTypeMeals:
      type: object
      required: [included, available]
      properties:
        included:
          anyOf:
            - title: Meal plan
              allOf:
                - $ref: "#/components/schemas/MealCode"
            - title: No meal plan
              type: string
              nullable: true
              enum: [null]
          description: >-
            Meal plan included in the price, or null when the visit type
            includes no meal plan with a code.
        available:
          type: array
          items:
            $ref: "#/components/schemas/MealCode"
          description: >-
            Meal plans the guest can choose, in code-list order. Contains
            `included` when it is not null.
    MealCode:
      type: string
      description: >-
        Meal plan code. See [Meals](/api/objects/visit-type#meals) for the
        meaning of each code.
      enum:
        - breakfast
        - half_board
        - full_board
        - all_inclusive
        - lunch
        - dinner
    VisitTypeStayLength:
      type: object
      required: [unit, min, max, minNights, maxNights]
      properties:
        unit:
          type: string
          enum: [night, week]
          description: Unit of `min` and `max`. A `week` stay is booked in whole weeks only.
        min:
          type: integer
          minimum: 1
          description: Shortest permitted stay in `unit`.
        max:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            Longest permitted stay in `unit`, or null when no maximum is
            configured. The booking limit in `maxNights` still applies.
        minNights:
          type: integer
          minimum: 1
          description: Shortest permitted stay in nights.
        maxNights:
          type: integer
          minimum: 1
          maximum: 693
          description: >-
            Longest permitted stay in nights. Without a configured maximum it is
            99 nights, or 693 nights (99 weeks) for a `week` stay.
    VisitTypeValidityPeriod:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          format: date
          description: First permitted arrival date.
        to:
          type: string
          format: date
          description: Last permitted arrival date (inclusive).
    VisitTypeDeparture:
      type: object
      required: [allowed, latestDate]
      properties:
        allowed:
          type: boolean
          description: >-
            False when the arrival periods permit no departure at all; such a
            visit type cannot be booked.
        latestDate:
          type: string
          format: date
          nullable: true
          description: >-
            Latest permitted departure date (inclusive). Null when departure is
            not limited or when `allowed` is false. A departure is permitted
            when `allowed` is true and, if `latestDate` is not null, it is not
            later than `latestDate`; a `latestDate` that has passed leaves no
            permitted departure.
    VisitTypeArrival:
      type: object
      required: [weekdays, dates]
      properties:
        weekdays:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Weekday"
          description: >-
            Weekdays on which a stay can start, Monday first. Never empty: all
            seven days when arrival is limited only by dates or periods, and
            Sunday only when the visit type sets no arrival rule at all.
        dates:
          type: array
          nullable: true
          items:
            type: string
            format: date
          description: >-
            Specific arrival dates from today on, in date order, or null when
            the visit type has no specific dates. Empty when every date has
            passed. A listed date must also match `weekdays` and `validity`.
    Weekday:
      type: string
      description: Weekday code, the lowercase English day name (not an ISO 8601 day number).
      enum:
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
        - sunday
    VisitTypeTreatment:
      type: object
      required: [exams, procedures]
      properties:
        exams:
          allOf:
            - $ref: "#/components/schemas/VisitTypeExams"
          description: Medical examinations included in the price.
        procedures:
          allOf:
            - $ref: "#/components/schemas/VisitTypeProcedures"
          description: Procedures included in the price.
    VisitTypeExams:
      type: object
      required: [entry, interim, interimFromNights, final, finalFromNights]
      properties:
        entry:
          type: boolean
          description: An entry examination at the start of the stay is included.
        interim:
          type: boolean
          description: An interim examination during the stay is included.
        interimFromNights:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            Stay length in nights from which the interim examination is
            included, or null when it is included for every stay length or not
            included.
        final:
          type: boolean
          description: A final examination at the end of the stay is included.
        finalFromNights:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            Stay length in nights from which the final examination is included,
            or null when it is included for every stay length or not included.
    VisitTypeProcedures:
      type: object
      required: [count, per, selection, items]
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of procedures included per `per` unit.
        per:
          type: string
          enum: [stay, week, day]
          description: Unit of `count`.
        selection:
          type: string
          enum: [hotel_offer, from_list, fixed]
          description: >-
            How the procedures are chosen: `hotel_offer` (from the hotel's
            offer; `items` is empty), `from_list` (from `items`) or `fixed`
            (`items` with their counts).
        items:
          type: array
          items:
            $ref: "#/components/schemas/TreatmentProcedure"
          description: Procedures of the visit type in configured order. Empty for `hotel_offer`.
    TreatmentProcedure:
      type: object
      required: [code, label, category, naturalSource, count]
      properties:
        code:
          allOf:
            - $ref: "#/components/schemas/TreatmentProcedureCode"
          description: Procedure code. See [Treatment](/api/treatment) for the code list.
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized procedure name.
        category:
          allOf:
            - $ref: "#/components/schemas/TreatmentProcedureCategory"
          description: Category of the procedure.
        naturalSource:
          type: string
          nullable: true
          enum: [carbon_dioxide, peat, mineral_water, null]
          description: Natural healing source the procedure uses, or null.
        count:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            How many times the procedure is included during the whole stay,
            only for `selection: fixed`; otherwise null. It does not follow
            `per`, and the counts need not add up to `count`.
    TreatmentProcedureCategory:
      type: object
      required: [code, label]
      properties:
        code:
          allOf:
            - $ref: "#/components/schemas/TreatmentCategoryCode"
          description: Category code.
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized category name.
    TreatmentProcedureCode:
      type: string
      description: Treatment procedure code. See [Treatment](/api/treatment) for labels and categories.
      enum:
        - bubble_bath
        - carbon_dioxide_bath
        - bubble_bath_with_additives
        - kneipp_water_treading
        - hydroxeur
        - herbal_bath
        - whirlpool_foot_bath
        - radon_bath
        - peat_bath
        - peat_wrap
        - paraffin_wrap
        - peat_vaginal_tampons
        - diadynamic_therapy
        - magnetic_therapy
        - ultrasound
        - co2_gas_injections
        - dry_carbon_dioxide_bath
        - molecular_hydrogen_therapy
        - classic_full_body_massage
        - partial_massage
        - fitness_centre_exercise
        - individual_physiotherapy
        - cardiotherapy
        - machine_lymphatic_drainage
        - manual_lymphatic_drainage
        - reflex_massage
        - hot_stone_massage
        - anti_cellulite_massage
        - aroma_massage
        - french_ear_acupuncture
        - classic_chinese_acupuncture
        - inhalation
        - oxygen_therapy
        - cryotherapy
        - thai_aroma_oil_massage
        - thai_foot_massage
        - thai_warm_oil_massage
        - classic_thai_massage
        - thai_coconut_dream
        - thai_head_and_back_massage
        - thai_herbal_massage
        - thai_special_back_massage
        - thai_pregnancy_massage
        - vaginal_irrigation
        - drinking_cure
        - ecg
        - inbody_diagnostics
        - vascular_condition_measurement
    TreatmentCategoryCode:
      type: string
      description: Treatment category code. See [Treatment](/api/treatment) for labels.
      enum:
        - hydrotherapy
        - thermotherapy
        - electrotherapy
        - gas_therapy
        - physiotherapy
        - inhalation
        - wellness
        - thai_massage
        - other
        - diagnostics
    VisitTypePriceFrom:
      type: object
      description: >-
        Lowest prices keyed by currency. A currency key is present only when
        the visit type has a complete, permitted stay with free capacity in
        that currency.
      properties:
        CZK:
          allOf:
            - $ref: "#/components/schemas/VisitTypePriceFromCurrency"
          description: Lowest prices in CZK.
        EUR:
          allOf:
            - $ref: "#/components/schemas/VisitTypePriceFromCurrency"
          description: Lowest prices in EUR.
    VisitTypePriceFromCurrency:
      type: object
      required: [perPersonPerNight, perStay]
      properties:
        perPersonPerNight:
          allOf:
            - $ref: "#/components/schemas/VisitTypePriceFromMinimum"
          description: >-
            Lowest average price per guest per night across the visit type's
            hotels, for a complete, permitted stay with free capacity at the
            room type's full standard occupancy.
        perStay:
          allOf:
            - $ref: "#/components/schemas/VisitTypePriceFromMinimum"
          description: >-
            Lowest total for the whole room for the shortest permitted stay
            across the visit type's hotels, at the room type's full standard
            occupancy. Independent of `perPersonPerNight`; the two minima can
            come from different hotels.
    VisitTypePriceFromMinimum:
      type: object
      required: [amount, original, nights, occupancy, hotel]
      properties:
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: >-
            Price after applicable promotions. Discounts apply only to the
            nights they cover; overlapping percentage discounts apply
            successively.
        original:
          anyOf:
            - title: Original amount
              allOf:
                - $ref: "#/components/schemas/Money"
            - title: No promotion
              type: object
              nullable: true
              enum: [null]
          description: The same price before promotions, or null when no promotion lowers it.
        nights:
          type: integer
          minimum: 1
          description: Number of nights priced, which is the shortest permitted stay.
        occupancy:
          type: integer
          minimum: 1
          description: Full standard occupancy of the room type the price applies to.
        hotel:
          allOf:
            - $ref: "#/components/schemas/VisitTypePriceFromHotel"
          description: Hotel whose offer gives this minimum.
    VisitTypePriceFromHotel:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: Hotel id; always one of `hotelIds`.
        name:
          allOf:
            - $ref: "#/components/schemas/HotelNameLocalizedString"
          description: Localized hotel name. Falls back to the Czech name, so it is never null.
    VisitTypePromotion:
      type: object
      required: [name, percentage, firstNight, lastNight, hotels]
      properties:
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized promotion name. Missing translations are null.
        percentage:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          description: Discount in percent.
        firstNight:
          type: string
          format: date
          description: First discounted night, as the date on which the night starts.
        lastNight:
          type: string
          format: date
          nullable: true
          description: Last discounted night, or null when the promotion has no end.
        hotels:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/VisitTypePromotionHotel"
          description: >-
            Hotels and room types the promotion applies to, or null when it
            applies to every hotel in `hotelIds`.
    VisitTypePromotionHotel:
      type: object
      required: [hotelId, roomTypeIds]
      properties:
        hotelId:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: Hotel id; always one of `hotelIds`.
        roomTypeIds:
          type: array
          nullable: true
          items:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: >-
            Room types of that hotel the promotion applies to, or null when it
            applies to all of them.
    VisitTypeDeposit:
      type: object
      required: [type, percentage, amountPerGuest, due]
      properties:
        type:
          type: string
          enum: [percentage, fixed]
          description: A `percentage` of the guest's price, or a `fixed` amount per guest.
        percentage:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: Deposit in percent of the guest's price for `percentage`; null for `fixed`.
        amountPerGuest:
          anyOf:
            - title: Fixed amount
              allOf:
                - $ref: "#/components/schemas/VisitTypeDepositAmount"
            - title: Percentage deposit
              type: object
              nullable: true
              enum: [null]
          description: Deposit per guest in both currencies for `fixed`; null for `percentage`.
        due:
          allOf:
            - $ref: "#/components/schemas/VisitTypeDepositDue"
          description: When the deposit is due.
    VisitTypeDepositAmount:
      type: object
      required: [CZK, EUR]
      properties:
        CZK:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Amount per guest in CZK.
        EUR:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Amount per guest in EUR.
    VisitTypeDepositDue:
      type: object
      required: [type, days]
      properties:
        type:
          type: string
          enum: [after_confirmation, before_arrival]
          description: >-
            `after_confirmation` counts days after the booking is confirmed,
            `before_arrival` counts days before arrival.
        days:
          type: integer
          minimum: 0
          description: Number of days.
    VisitTypeLoyaltyProgram:
      type: object
      required: [id, name, discountPercent]
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: Loyalty program id.
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized program name. Missing translations are null.
        discountPercent:
          type: number
          minimum: 0
          maximum: 100
          description: Discount for program members, in percent.
    VisitTypeHotel:
      type: object
      required: [id, name, stars]
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: Hotel id; the hotels follow the order of `hotelIds`.
        name:
          allOf:
            - $ref: "#/components/schemas/HotelNameLocalizedString"
          description: Localized hotel name. Falls back to the Czech name, so it is never null.
        stars:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: Star rating from 1 to 5, or null when the hotel has no rating.
    AmenityCategory:
      type: object
      required: [scope, code, label]
      oneOf:
        - title: Hotel category
          required: [scope, code]
          properties:
            scope: { enum: [hotel] }
            code: { enum: [health, wellness, dining, services, accessibility, parking, sport, children] }
            label:
              $ref: "#/components/schemas/LocalizedString"
          example:
            scope: hotel
            code: wellness
            label: { cs-CZ: Bazény a wellness, en: Pools & wellness }
        - title: Room type category
          required: [scope, code]
          properties:
            scope: { enum: [roomType] }
            code: { enum: [bathroom, equipment, accessibility, view, kitchen, inclusions] }
            label:
              $ref: "#/components/schemas/LocalizedString"
          example:
            scope: roomType
            code: view
            label: { cs-CZ: Výhled, en: View }
      properties:
        scope:
          type: string
          enum: [hotel, roomType]
          description: Resource scope. Together with code, identifies the category.
        code:
          type: string
          enum:
            - health
            - wellness
            - dining
            - services
            - accessibility
            - parking
            - sport
            - children
            - bathroom
            - equipment
            - view
            - kitchen
            - inclusions
          description: Category code, unique within its scope.
        label:
          $ref: "#/components/schemas/LocalizedString"
    HotelAmenityCategoryRef:
      type: object
      title: Hotel category
      additionalProperties: false
      required: [code]
      description: >-
        A category assigned to a hotel. Resolve its `code` in the hotel amenity
        dictionary or request `expand=amenityLabels`; see
        [Labels](/api/amenities#labels).
      properties:
        code:
          type: string
          enum:
            - health
            - wellness
            - dining
            - services
            - accessibility
            - parking
            - sport
            - children
          description: Category code in the hotel amenity dictionary.
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized category label. Present only with `expand=amenityLabels`.
      example:
        code: wellness
    RoomTypeAmenityCategoryRef:
      type: object
      title: Room type category
      additionalProperties: false
      required: [code]
      description: >-
        A category assigned to a room type. Resolve its `code` in the room type
        amenity dictionary or request `expand=amenityLabels`; see
        [Labels](/api/amenities#labels).
      properties:
        code:
          type: string
          enum: [bathroom, equipment, accessibility, view, kitchen, inclusions]
          description: Category code in the room type amenity dictionary.
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized category label. Present only with `expand=amenityLabels`.
      example:
        code: view
    AmenityCategoryGroup:
      type: object
      required: [category, amenities]
      description: >-
        One amenity category and the amenity dictionary entries assigned to it.
      properties:
        category:
          $ref: "#/components/schemas/AmenityCategory"
        amenities:
          type: array
          items:
            $ref: "#/components/schemas/Amenity"
    AmenityOption:
      type: object
      required: [code, label]
      description: >-
        One localized amenity-specific option. Its meaning is scoped by the
        parent amenity code.
      properties:
        code:
          type: string
          description: Stable option code.
          example: finnish
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized option label.
    AmenityOptionRef:
      type: object
      required: [code]
      description: >-
        A selected amenity option on a hotel or room type response. Identified by `code`; its
        localized `label` is included only with `expand=amenityLabels`.
        Otherwise resolve the label against the amenity's `options` in the
        [amenity dictionary](/api/amenities).
      properties:
        code:
          type: string
          description: References an option `code` from the dictionary.
          example: finnish
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized option label. Present only with `expand=amenityLabels`.
    Amenity:
      type: object
      required: [code, label, detailKinds]
      description: >-
        One amenity dictionary entry nested under its category in the response
        from `GET /amenity-categories`.
      properties:
        code:
          type: string
          description: Stable code assigned to hotels or room types and used for filtering.
          example: sauna
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized display name.
          example:
            cs-CZ: Sauna
            de: Sauna
            en: Sauna
        detailKinds:
          type: array
          description: >-
            Details that hotels and room types can specify for this amenity.
            Each kind adds specific fields to the amenity value. See
            [Detail kinds](/api/amenities#detail-kinds) for the
            fields and values of each kind. An empty array marks a
            presence-only amenity.
          items:
            type: string
            enum:
              - proximity
              - pricing
              - coverage
              - options
              - opening_hours
              - note
        options:
          type: array
          description: >-
            All choices supported by this amenity. Present when `detailKinds`
            includes `options`.
          items:
            $ref: "#/components/schemas/AmenityOption"
        notePlaceholder:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Optional localized helper text for the amenity note. Omitted when
            the amenity does not define one.
      example:
        code: sauna
        label:
          cs-CZ: Sauna
          de: Sauna
          en: Sauna
          ru: Сауна
        detailKinds: [proximity, pricing, options, opening_hours]
        options:
          - code: finnish
            label:
              cs-CZ: Finská sauna
              de: Finnische Sauna
              en: Finnish sauna
              ru: Финская сауна
          - code: infrared
            label:
              cs-CZ: Infra sauna
              de: Infrarotsauna
              en: Infrared sauna
              ru: Инфракрасная сауна
          - code: steam
            label:
              cs-CZ: Parní lázeň
              de: Dampfbad
              en: Steam bath
              ru: Паровая баня
    AmenityOpeningHoursBlock:
      type: object
      required: [days, from, to]
      description: >-
        A weekly time range. Blocks that share a day do not overlap.
      properties:
        days:
          type: array
          minItems: 1
          description: Days on which the range applies, each at most once, from Monday to Sunday.
          items:
            type: string
            enum:
              - monday
              - tuesday
              - wednesday
              - thursday
              - friday
              - saturday
              - sunday
        from:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: Opening time, local to the hotel, in the 24-hour `HH:mm` format.
          example: "07:00"
        to:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: Closing time in the same format. Always later than `from`.
          example: "15:00"
    AmenityOpeningHours:
      type: object
      required: [continuous, blocks]
      properties:
        continuous:
          type: boolean
          description: True when the amenity is open 24 hours a day, 7 days a week.
        blocks:
          type: array
          description: >-
            Weekly opening-hour blocks. Empty when `continuous` is true or when
            the opening hours are not specified.
          items:
            $ref: "#/components/schemas/AmenityOpeningHoursBlock"
    AmenityValue:
      type: object
      required: [code]
      description: >-
        A structured amenity assigned to a hotel or room type. Apart from
        `code` (and `label` with `expand=amenityLabels`), it contains only the
        fields of the detail kinds that the matching dictionary amenity
        declares. See [Detail kinds](/api/amenities#detail-kinds).
      properties:
        code:
          type: string
          description: References an `Amenity.code`.
          example: sauna
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized amenity label. Present only with `expand=amenityLabels`.
        proximity:
          type: string
          nullable: true
          enum: [in-hotel, connecting, nearby, null]
          description: >-
            Where the amenity is located relative to the hotel. Present when
            `detailKinds` includes
            [`proximity`](/api/amenities#proximity); null when not
            specified. `in-hotel` is inside the hotel building, `connecting` is an
            adjacent building linked by an internal passage, and `nearby` is a
            short distance away (see `proximityMeters`).
        proximityMeters:
          type: number
          minimum: 0
          maximum: 1000000
          nullable: true
          description: >-
            Present with `proximity`. Contains a distance when `proximity` is
            `nearby`; otherwise null.
        pricing:
          type: string
          nullable: true
          enum: [included, conditional, paid, null]
          description: >-
            Whether using the amenity costs extra. Present when `detailKinds`
            includes [`pricing`](/api/amenities#pricing). Null when
            not specified. `included` means no additional charge,
            `conditional` means inclusion depends on stated conditions, and
            `paid` means an additional charge applies.
        coverage:
          type: string
          enum: [all, some]
          description: >-
            Whether the amenity is available in all physical rooms of this
            room type or only some.
            Present only when the dictionary declares
            [coverage](/api/amenities#coverage). `all` means every room;
            `some` means only some rooms. Defaults to `all` when unspecified
            and is never null. Omitted on hotel amenities.
        options:
          type: array
          description: >-
            Amenity-specific choices selected for this hotel or room type. Each
            option contains `code` by default and also `label` with
            `expand=amenityLabels`. Present when `detailKinds` includes
            [`options`](/api/amenities#options).
            Empty when the amenity supports choices but none are selected.
            Labels are also available in the dictionary.
          items:
            $ref: "#/components/schemas/AmenityOptionRef"
        openingHours:
          allOf:
            - $ref: "#/components/schemas/AmenityOpeningHours"
          description: >-
            Present when `detailKinds` includes
            [`opening_hours`](/api/amenities#opening-hours). When
            not specified, returns `continuous: false` with an empty `blocks`
            array.
        note:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Present when `detailKinds` includes
            [`note`](/api/amenities#note). Localized supplementary
            information for guests. Locale values are at most 200 characters
            and are null when the requested translation is not available.
      example:
        code: aquapark
        proximity: nearby
        proximityMeters: 250
        pricing: included
        openingHours:
          continuous: false
          blocks:
            - days: [monday, tuesday, wednesday]
              from: "09:00"
              to: "21:00"
    HotelAmenityCategoryGroup:
      type: object
      required: [category, amenities]
      description: >-
        One hotel amenity category containing values assigned to a hotel.
        Categories without assigned amenities are omitted from hotel responses.
      properties:
        category:
          $ref: "#/components/schemas/HotelAmenityCategoryRef"
        amenities:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AmenityValue"
    AmenityCategoriesList:
      type: object
      required: [data]
      description: >-
        The complete amenity dictionary for both scopes unless a scope filter is set, grouped by category and returned
        in one response (small, not paginated). It includes every system
        amenity in the selected scopes, independent of assignments to hotels or room types. Amenities that
        support choices carry their full `options` list.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AmenityCategoryGroup"
      example:
        data:
          - category:
              scope: hotel
              code: wellness
              label: { cs-CZ: Bazény a wellness, de: Pools & Wellness, en: "Pools & wellness" }
            amenities:
              - code: aquapark
                label: { cs-CZ: Akvapark, de: Aquapark, en: Aquapark }
                detailKinds: [proximity, pricing, opening_hours]
              - code: sauna
                label: { cs-CZ: Sauna, de: Sauna, en: Sauna }
                detailKinds: [proximity, pricing, options, opening_hours]
                options:
                  - code: finnish
