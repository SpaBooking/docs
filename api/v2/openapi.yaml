          example: 66f16191f739705faa020031
        name:
          $ref: "#/components/schemas/VisitTypeNameLocalizedString"
    VisitTypeNameLocalizedString:
      type: object
      additionalProperties: false
      properties:
        cs-CZ:
          type: string
          minLength: 1
        de:
          type: string
          minLength: 1
        en:
          type: string
          minLength: 1
        ru:
          type: string
          minLength: 1
      description: >-
        Localized visit type name keyed by supported response locale (`cs-CZ`,
        `de`, `en`, `ru`). Missing requested translations fall back to the
        Czech name, like the hotel `name`.
      example:
        cs-CZ: Krátkodobý pobyt Weekend
        de: Kurzaufenthalt Weekend
    PriceFromMinimum:
      type: object
      required: [amount, original, nights, occupancy, visitType]
      properties:
        amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: >-
            Price after applicable promotions. Discounts apply only to the nights
            they cover; overlapping percentage discounts apply successively.
        original:
          anyOf:
            - title: Original amount
              allOf:
                - $ref: "#/components/schemas/Money"
            - title: No promotion
              type: object
              nullable: true
              enum: [null]
          description: >-
            The same price before the promotion, or null when no promotion
            applies.
        nights:
          type: integer
          minimum: 1
          description: Shortest stay the visit type allows, in nights.
          example: 2
        occupancy:
          type: integer
          minimum: 1
          description: Full standard occupancy of the room type the price applies to.
          example: 2
        visitType:
          $ref: "#/components/schemas/PriceFromVisitType"
    PriceFromScope:
      type: object
      required: [perPersonPerNight, perStay]
      properties:
        perPersonPerNight:
          allOf:
            - $ref: "#/components/schemas/PriceFromMinimum"
          description: >-
            Lowest average price per guest per night for a complete, permitted
            stay with remaining room capacity for every occupied night, at
            the reported occupancy and number of nights. On-demand stays
            are excluded.
        perStay:
          allOf:
            - $ref: "#/components/schemas/PriceFromMinimum"
          description: >-
            Lowest total for the whole room for `nights` nights at its full
            standard `occupancy`, after applicable promotions.
            The minimum is taken across all eligible room types. Each minimum
            has its own visit type, nights, and occupancy, independently of
            `perPersonPerNight`. The stay has a permitted arrival date and
            a price for every occupied night in one room type and currency,
            including stays across seasons. The same room type must have remaining
            capacity for every occupied night at calculation time. On-demand
            stays are excluded. The response does not hold a room; availability
            is checked again in the booking flow.
    PriceFromCurrency:
      type: object
      required: [all]
      properties:
        all:
          allOf:
            - $ref: "#/components/schemas/PriceFromScope"
          description: >-
            Lowest prices across everything the hotel sells, including stays
            without a category.
        health:
          allOf:
            - $ref: "#/components/schemas/PriceFromScope"
          description: >-
            Lowest prices across health stays (spa cures) only. Omitted when
            no available, fully priced stay exists for this category and currency.
        wellness:
          allOf:
            - $ref: "#/components/schemas/PriceFromScope"
          description: >-
            Lowest prices across wellness stays only. Omitted when no available,
            fully priced stay exists for this category and currency.
    PriceFrom:
      type: object
      description: >-
        Lowest prices the hotel currently sells, keyed by currency. Each
        currency holds the hotel-wide price `all` and the categories `health`
        and `wellness`, each with two independent minima. Prices are not
        affected by query parameters
        and can differ by currency. A currency key is present only when the
        hotel has an available, fully priced stay in that currency. Every
        occupied night must have remaining capacity in the same room type.
        On-demand stays are excluded. Availability is checked at calculation
        time and can change before booking. See [Prices](/api/prices).
      properties:
        CZK:
          $ref: "#/components/schemas/PriceFromCurrency"
        EUR:
          $ref: "#/components/schemas/PriceFromCurrency"
      example:
        EUR:
          all:
