    VisitTypeShortDescription:
      type: object
      additionalProperties: false
      properties:
        cs-CZ:
          type: string
          nullable: true
          maxLength: 120
        de:
          type: string
          nullable: true
          maxLength: 120
        en:
          type: string
          nullable: true
          maxLength: 120
        ru:
          type: string
          nullable: true
          maxLength: 120
      description: Localized plain-text purpose line, up to 120 characters per translation. Missing
        translations are null.
      example:
        cs-CZ: Český text
        de: Deutscher Text
    VisitTypeWeekdayArrival:
      type: object
      required:
        - type
        - weekdays
      properties:
        type:
          type: string
          enum:
            - weekdays
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Weekday"
          description: Allowed weekdays, Monday first. No implicit default.
      additionalProperties: false
    VisitTypeDateArrival:
      type: object
      required:
        - type
        - dates
      properties:
