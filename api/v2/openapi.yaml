    Procedure:
      type: object
      required:
        - code
        - label
        - category
        - naturalSource
      properties:
        code:
          allOf:
            - $ref: "#/components/schemas/TreatmentProcedureCode"
          description: Procedure code. See [Procedure](/api/objects/procedure#procedure-codes).
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized procedure name.
        category:
          allOf:
            - $ref: "#/components/schemas/TreatmentProcedureCategory"
          description: Category of the procedure.
        naturalSource:
          type: string
          nullable: true
          enum:
            - carbon_dioxide
            - peat
            - mineral_water
            - null
          description: Natural healing source the procedure uses, or null.
      not:
        type: object
        required:
          - count
        properties:
          count: {}
      description: "**Draft:** A procedure offered by a hotel or included in a treatment. See
        [Procedure](/api/objects/procedure)."
    Treatment:
      type: object
      required:
        - exams
        - procedures
      properties:
        exams:
          allOf:
            - $ref: "#/components/schemas/VisitTypeExams"
          description: Medical examinations included in the price.
        procedures:
          allOf:
            - $ref: "#/components/schemas/VisitTypeProcedures"
          description: Procedures included in the price.
      description: "**Draft:** Medical examinations and included procedures. See
        [Treatment](/api/objects/treatment)."
    PriceFromHotel:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Hotel whose offer gives this minimum.
          pattern: ^[0-9a-fA-F]{24}$
        name:
          $ref: "#/components/schemas/HotelNameLocalizedString"
    SharedPriceFromMinimum:
      type: object
      required:
        - amount
        - original
        - nights
        - occupancy
        - hotel
        - visitType
      properties:
        amount:
          $ref: "#/components/schemas/PriceFromMinimum/properties/amount"
        original:
          allOf:
            - $ref: "#/components/schemas/PriceFromMinimum/properties/original"
          description: Same selected offer before promotions; null unless its full-stay total decreases after
            rounding. The separately rounded average may equal the discounted average. See [Price
            from](/api/objects/price-from#minimum-fields).
        nights:
          $ref: "#/components/schemas/PriceFromMinimum/properties/nights"
        occupancy:
          $ref: "#/components/schemas/PriceFromMinimum/properties/occupancy"
        visitType:
          $ref: "#/components/schemas/PriceFromMinimum/properties/visitType"
        hotel:
          $ref: "#/components/schemas/PriceFromHotel"
      description: "**Draft:** Shared target minimum for hotels, visit types, hotel × visit type and
        seasons. Both entity references are required. The live hotel minimum does not yet include
        hotel. See [Price from](/api/objects/price-from)."
    DraftHotelPriceFrom:
      type: object
      minProperties: 1
      properties:
        CZK:
          type: object
          required:
            - all
          properties:
            all:
              $ref: "#/components/schemas/VisitTypePriceFromCurrency"
            health:
              $ref: "#/components/schemas/VisitTypePriceFromCurrency"
            wellness:
              $ref: "#/components/schemas/VisitTypePriceFromCurrency"
        EUR:
          type: object
          required:
            - all
          properties:
            all:
              $ref: "#/components/schemas/VisitTypePriceFromCurrency"
            health:
              $ref: "#/components/schemas/VisitTypePriceFromCurrency"
            wellness:
              $ref: "#/components/schemas/VisitTypePriceFromCurrency"
      description: "**Draft:** Proposed hotel currency/category wrappers around the shared minimum. Not
        returned by released hotel endpoints."
    DraftHotel:
      description: "**Draft:** Proposed hotel procedures and shared prices. Released hotel endpoints still
        use Hotel. See [Hotel](/api/objects/hotel)."
      allOf:
        - $ref: "#/components/schemas/Hotel"
        - type: object
          required:
            - procedures
          properties:
            procedures:
              type: array
              items:
                $ref: "#/components/schemas/Procedure"
            priceFrom:
              anyOf:
                - $ref: "#/components/schemas/DraftHotelPriceFrom"
                - type: object
                  nullable: true
                  enum:
                    - null
    VisitTypeSeason:
      type: object
      required:
        - id
        - from
        - to
        - priceFrom
      properties:
        id:
          type: string
          description: Opaque source price-list season id, stable while the season exists; imports that split
            or replace it can change its identity. Shared across hotels because seasons belong to
            this visit type price list.
          pattern: ^[0-9a-fA-F]{24}$
        from:
          type: string
          description: First arrival date in the source season interval.
          format: date
        to:
          type: string
          description: Last arrival date in the source season interval, inclusive.
          format: date
        priceFrom:
          anyOf:
            - $ref: "#/components/schemas/VisitTypePriceFrom"
            - type: object
              nullable: true
              enum:
                - null
          description: Minimum for arrivals in this season from today onward; complete stays may span later
            seasons. Null when no buyable offer exists or the visit type is
            unavailable/request-only.
    VisitTypeAtHotel:
      type: object
      required:
        - hotelId
        - priceFrom
      properties:
        hotelId:
          type: string
          description: An active authorized hotel selling this visit type; present even without a buyable price.
          pattern: ^[0-9a-fA-F]{24}$
        priceFrom:
          anyOf:
            - $ref: "#/components/schemas/VisitTypePriceFrom"
            - type: object
              nullable: true
              enum:
                - null
          description: Price for this hotel × visit type only. Null when no buyable offer exists or the visit
            type is unavailable/request-only.
        hotel:
          allOf:
            - $ref: "#/components/schemas/VisitTypeHotel"
          description: Present only with expand=hotels.
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/VisitTypeSeason"
          description: Detail only, present only with expand=seasons. Current/future source price-list seasons
            ordered by from, to, id. Empty when none remain.
    PromotionHotel:
      type: object
      required:
        - hotelId
        - roomTypeIds
      properties:
        hotelId:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: An authorized active hotel selling this visit type; a detail hotelId filter does not
            trim promotion scope.
        roomTypeIds:
          type: array
          nullable: true
          minItems: 1
          items:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Room types of that hotel the promotion applies to, in configured order, or null when it
            applies to all of them. Never empty.
    Promotion:
      type: object
      required:
        - id
        - name
        - percentage
        - from
        - to
        - hotels
      properties:
        id:
          type: string
          description: Promotion identity, used once even when it applies to several channels.
          pattern: ^[0-9a-fA-F]{24}$
        name:
          $ref: "#/components/schemas/LocalizedString"
        percentage:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          description: Discount in percent.
        from:
          type: string
          description: First discounted night, identified by its starting date.
          format: date
        to:
          type: string
          description: Last discounted night, inclusive; null when open-ended.
          format: date
          nullable: true
        hotels:
          type: array
          nullable: true
          minItems: 1
          items:
            $ref: "#/components/schemas/PromotionHotel"
          description: Null for every authorized hotel selling the visit type, independent of a detail hotelId
            filter; otherwise scoped hotels and room types. See [Promotion](/api/objects/promotion).
      description: "**Draft:** A promotion within the [authenticated scope](/api/authentication#channels-and-scope).
        No channel identifiers or funding configuration are exposed."
