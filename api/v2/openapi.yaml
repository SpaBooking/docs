    VisitType:
      type: object
      description: >-
        **Draft:** The visit type endpoints are still in progress. Fields may
        change before they are finalized. A visit type is a stay a hotel
        sells, such as a spa cure or a wellness weekend: its texts,
        stay rules, included meals and treatment, prices, promotions, deposit
        rule and loyalty discounts. Localized fields return the locale keys
        selected by `Accept-Language`.
      required:
        - id
        - name
        - shortDescription
        - stayCategory
        - paymentType
        - bookingMode
        - available
        - unavailableReason
        - webOrder
        - hotelIds
        - collections
        - meals
        - stayLength
        - validity
        - departure
        - arrival
        - treatment
        - priceFrom
        - promotions
        - deposit
        - loyaltyPrograms
        - images
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: >-
            Visit type id. The same id identifies the visit type in the
            `priceFrom` minima of hotels.
          example: 6720c0a1b2c3d4e5f6a7b801
        name:
          allOf:
            - $ref: "#/components/schemas/VisitTypeNameLocalizedString"
          description: >-
            Localized visit type name. A missing translation falls back to the
            Czech name, so a returned value is never empty.
        shortDescription:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized short teaser (plain text). Each locale value is at most
            400 characters. Missing translations are null.
        stayCategory:
          type: string
          nullable: true
          enum: [health, wellness, null]
          description: >-
            `health` for a spa cure, `wellness` for a wellness stay, or null when
            the visit type has no category.
        paymentType:
          type: string
          nullable: true
          enum: [self, plp, klp, null]
          description: >-
            Who pays a health stay: `self` (the guest), `plp` (the health
            insurer contributes to the stay) or `klp` (the health insurer covers
            treatment, accommodation and meals; booked on request). A health
            stay without a set value is `self`. Null for other stays.
        bookingMode:
          type: string
          enum: [instant, request]
          description: >-
            `instant` when guests book the visit type directly; `request` when
            guests send a booking request that is confirmed later. A `klp` stay
            is always `request`.
        available:
          type: boolean
          description: >-
            Whether the visit type is offered now: it is on sale, it has no
            arrival periods or at least one that has not ended, it permits at
            least one stay from today, and it has at least one active hotel.
            Prices and free capacity are not part of this check.
        unavailableReason:
          type: string
          nullable: true
          enum: [withdrawn, ended, no_arrival, no_hotels, null]
          description: >-
            Why the visit type is not available, as the first matching reason:
            `withdrawn` (not on sale), `ended` (every arrival period has ended),
            `no_arrival` (no stay is permitted from today, including an invalid
            stay length) or `no_hotels` (no active hotel). Null exactly when
            `available` is true.
        webOrder:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            Position of the visit type on the website within its company,
            starting at 1, or null when it has no position. Used by
            `sort=webOrder`.
          example: 3
        hotelIds:
          type: array
          items:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: >-
            Active hotels that sell the visit type, ordered by Czech hotel name.
            Each of them is also returned by `GET /hotels`. Assignment does not
            guarantee prices or free capacity. Can be empty.
        collections:
          type: array
          items:
            $ref: "#/components/schemas/VisitTypeCollection"
          description: >-
            Website collections the visit type belongs to, in code-list order.
            The list combines assigned collections and collections derived from
            the visit type, without telling them apart.
            `special_offers` is present exactly when `promotions` is not empty.
            Can be empty.
        meals:
          allOf:
            - $ref: "#/components/schemas/VisitTypeMeals"
          description: Meal plan included in the price and meal plans the guest can choose.
        stayLength:
          anyOf:
            - title: Stay length
              allOf:
                - $ref: "#/components/schemas/VisitTypeStayLength"
            - title: Invalid stay length
              type: object
              nullable: true
              enum: [null]
          description: >-
            Permitted stay length, or null when the visit type's length rules
            are invalid; such a visit type cannot be booked.
        validity:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/VisitTypeValidityPeriod"
          description: >-
            Arrival periods that have not ended, ordered by start and end date.
            Null when no arrival periods are set (`arrival` can still limit the
            arrival days); empty when every period has ended. A stay can end
            after its arrival period; `departure` limits the end.
        departure:
          allOf:
            - $ref: "#/components/schemas/VisitTypeDeparture"
          description: Latest permitted departure, derived from all arrival periods, including ended ones.
        arrival:
          allOf:
            - $ref: "#/components/schemas/VisitTypeArrival"
          description: >-
            Weekdays and specific dates on which a stay can start. An arrival
            day must match `weekdays`, `dates` (when not null) and `validity`
            (when not null).
        treatment:
          allOf:
            - $ref: "#/components/schemas/VisitTypeTreatment"
          description: >-
            Medical examinations and procedures included in the price. See
            [Treatment](/api/treatment).
        priceFrom:
          anyOf:
            - title: Available prices
              allOf:
                - $ref: "#/components/schemas/VisitTypePriceFrom"
            - title: No price
              type: object
              nullable: true
              enum: [null]
          description: >-
            Lowest prices for the shortest permitted stay across the visit
            type's hotels, keyed by currency. Null for `request` visit types,
            for unavailable visit types and when no complete, permitted stay
            with free capacity exists. Not affected by query parameters. See
            [Prices](/api/prices).
        promotions:
          type: array
          items:
            $ref: "#/components/schemas/VisitTypePromotion"
          description: >-
            Running and future promotions published for your public key's
            channel, with the hotels and room types they apply to, ordered by
            first night. Can be empty.
        deposit:
          anyOf:
            - title: Deposit rule
              allOf:
                - $ref: "#/components/schemas/VisitTypeDeposit"
            - title: No base deposit
              type: object
              nullable: true
              enum: [null]
          description: >-
            Base deposit rule for one guest booked on this visit type in your
            public key's channel, or null when no base deposit applies. The
            deposit of a reservation can differ, for example because of a
            channel minimum; see
            [Deposit](/api/objects/visit-type#deposit).
        loyaltyPrograms:
          type: array
          items:
            $ref: "#/components/schemas/VisitTypeLoyaltyProgram"
          description: >-
            Loyalty programs assigned to the visit type with the member
            discount, in configured order. Can be empty.
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
          description: >-
            Photos in configured order; the first is the main photo.
            A missing `alt` translation falls back to the localized visit type
            name; an empty `alt` marks a decorative image. See
            [Images](/api/images).
        hotels:
          type: array
          items:
            $ref: "#/components/schemas/VisitTypeHotel"
          description: Embedded only when `expand=hotels`; the hotels of `hotelIds` in the same order.
      example:
