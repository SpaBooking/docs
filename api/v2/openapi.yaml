openapi: 3.0.3
info:
  title: SpaPortal API v2
  version: "2.0"
  description: The current SpaPortal public API.
servers:
  - url: https://spaportal.cz/api/v2
    description: Production
security:
  - spaPortalPublicKey: []
tags:
  - name: Hotels
  - name: Room types
  - name: Visit types
  - name: Amenity categories
paths:
  /amenity-categories:
    get:
      tags:
        - Amenity categories
      summary: List the amenity dictionary
      operationId: getAmenityCategories
      description: |
        Returns the amenity dictionary: amenity categories, their amenities,
        and localized labels. Without `scope`, it returns hotel categories
        followed by room type categories. The dictionary is returned in one
        response, without pagination.

        Use it to resolve the amenity codes in hotel and room type responses
        and to build amenity filters. See [Amenities](/api/amenities) for the
        structure, detail kinds, and caching.
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum:
              - hotel
              - roomType
          description: >-
            Filter by `hotel` or `roomType`. By default, the response includes both. Empty or
            unknown scopes (including `all`) return `400`.
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag from a previous response. When the dictionary variant is unchanged, the API
            returns `304` with no body. See [Caching](/api/amenities#caching).
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The amenity dictionary.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            ETag:
              $ref: "#/components/headers/ETag"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmenityCategoriesList"
              example:
                data:
                  - category:
                      scope: hotel
                      code: wellness
                      label:
                        cs-CZ: Bazény a wellness
                        de: Pools & Wellness
                        en: Pools & wellness
                    amenities:
                      - code: sauna
                        label:
                          cs-CZ: Sauna
                          de: Sauna
                          en: Sauna
                        detailKinds:
                          - proximity
                          - pricing
                          - options
                          - opening_hours
                        options:
                          - code: finnish
                            label:
                              cs-CZ: Finská sauna
                              de: Finnische Sauna
                              en: Finnish sauna
                          - code: infrared
                            label:
                              cs-CZ: Infra sauna
                              de: Infrarotsauna
                              en: Infrared sauna
                          - code: steam
                            label:
                              cs-CZ: Parní lázeň
                              de: Dampfbad
                              en: Steam bath
                  - category:
                      scope: roomType
                      code: view
                      label: { cs-CZ: Výhled, de: Aussicht, en: View }
                    amenities:
                      - code: balcony
                        label: { cs-CZ: Balkon, de: Balkon, en: Balcony }
                        detailKinds: [ coverage ]
        "304":
          description: The cached dictionary variant matched by `If-None-Match` is still current. The response
            has no body.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /hotels:
    get:
      tags: [ Hotels ]
      summary: List hotels
      operationId: getHotels
      description: |
        Returns active hotels across the companies your public key is scoped to.
        A hotel includes its localized short description and sales-channel
        content, structured accommodation rules, meal services, indications,
        the procedures it offers, staff languages, and hotel
        [amenities](/api/amenities#assigned-amenities). Localized fields return
        the locale keys selected by `Accept-Language`. `name` falls back to the
        default locale (cs-CZ); other untranslated values are returned as null.

        `priceFrom` holds the lowest prices the hotel currently sells, per
        currency, across all packages (`all`) and per category (`health`,
        `wellness`), each with two independent minima that name the hotel and
        the package. It is null when no buyable offer exists. See
        [Prices](/api/prices).

        See the [Hotel](/api/objects/hotel) object for the full field
        reference, including the allowed values for `serviceMethod`,
        `indications`, and `staffLanguages`.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of records to return. See [Pagination](/api/pagination).
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2000
          description: Cursor from the previous page's `pagination.nextCursor`. See
            [Pagination](/api/pagination).
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
          description: >-
            Literal substring search of the hotel name across all supported languages (case- and
            diacritics-insensitive).
        - name: sort
          in: query
          schema:
            type: string
            enum: [ "createdAt:desc", "createdAt:asc" ]
            default: "createdAt:desc"
          description: >-
            Orders by unique record id descending or ascending. IDs generally follow creation order;
            this is not a separate timestamp sort. Keep the sort and filters unchanged while paging.
            Cursors do not freeze a snapshot when records change between requests.
        - name: amenities
          in: query
          schema:
            type: string
            maxLength: 500
          description: >-
            Comma-separated hotel amenity codes. Returns hotels that have all listed amenities, for
            example `sauna,parking`. A facility can match as an own amenity or in an aquapark’s
            includes, regardless of pricing. Filtering applies before pagination and total counts.
            Unknown codes return `400`. See [Filtering](/api/amenities#filtering).
        - name: amenityCategory
          in: query
          schema:
            type: string
            enum: [ health, wellness, dining, services, accessibility, parking, sport, children ]
          description: >-
            Hotel amenity category code. Returns hotels that have at least one amenity in this
            category, for example `wellness`. See [Filtering](/api/amenities#filtering).
        - name: expand
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [ roomTypes, amenityLabels ]
          description: >-
            Comma-separated expansions, for example `roomTypes,amenityLabels`. `amenityLabels` adds
            localized labels to amenity categories, amenities, and options, including those of
            embedded room types; see [Labels](/api/amenities#labels). `roomTypes` embeds each
            hotel's enabled, non-draft room types (otherwise fetch them via `GET
            /room-types?hotelId={hotelId}`).
      responses:
        "200":
          description: A paginated list of hotels.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelsList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /hotels/{hotelId}:
    get:
      tags: [ Hotels ]
      summary: Get a hotel
      operationId: getHotel
      description: |
        Returns a single hotel by id with its localized content, structured
        profile, procedures, and [amenities](/api/amenities#assigned-amenities).

        `priceFrom` has the same shape as in the hotel list; see
        [Prices](/api/prices).

        See the [Hotel](/api/objects/hotel) object for the full field
        reference, including the allowed values for `serviceMethod`,
        `indications`, and `staffLanguages`.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: hotelId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: Hotel id.
        - name: expand
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum: [ roomTypes, amenityLabels ]
          description: >-
            Comma-separated expansions, for example `roomTypes,amenityLabels`. `amenityLabels` adds
            localized labels to amenity categories, amenities, and options, including those of
            embedded room types; see [Labels](/api/amenities#labels). `roomTypes` embeds the hotel's
            enabled, non-draft room types (otherwise fetch them via `GET
            /room-types?hotelId={hotelId}`).
      responses:
        "200":
          description: The hotel.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /room-types:
    get:
      tags:
        - Room types
      summary: List room types
      operationId: getRoomTypes
      description: |
        Returns room types of active hotels across the companies your public
        key is scoped to. Localized fields (`name`, `description`) return
        the locale keys selected by `Accept-Language`.

        Only enabled room types are returned by default (`disabled=false`). Use
        `disabled=true` for disabled room types or `disabled=all` for both states.
        Draft room types are never returned.

        See the [Room type](/api/objects/room-type) object for the full field reference.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of records to return. See [Pagination](/api/pagination).
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2000
          description: Cursor from the previous page's `pagination.nextCursor`. See
            [Pagination](/api/pagination).
        - name: hotelId
          in: query
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Filter by hotel id.
        - name: disabled
          in: query
          schema:
            type: string
            enum: [ "false", "true", "all" ]
            default: "false"
          description: Use false (the default) for enabled room types, true for disabled room types, or all
            for both. The filter applies before pagination and totals.
        - name: occupancy
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
          description: >-
            Filter room types by their exact standard occupancy, the number of guests included in
            the base price. Pass an integer in the query string, for example `?occupancy=2`, to
            return room types whose response contains `occupancy.standard: 2`. This filter does not
            match maximum capacity or a specific guest party.
        - name: code
          in: query
          schema:
            type: string
            maxLength: 200
          description: Filter by exact room type code.
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
          description: Search the room type name (case- and diacritics-insensitive). To match a room type
            code, use code.
        - name: expand
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - hotel
                - amenityLabels
          description: >-
            Comma-separated expansions. `hotel` embeds the hotel's `id`, `name`, and `stars`.
            `amenityLabels` adds localized labels to amenity categories and amenities; see
            [Labels](/api/amenities#labels). You can request both.
          style: form
          explode: false
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - createdAt:desc
              - createdAt:asc
            default: createdAt:desc
          description: >-
            Orders by unique record id descending or ascending. IDs generally follow creation order;
            this is not a separate timestamp sort. Keep the sort and filters unchanged while paging.
            Cursors do not freeze a snapshot when records change between requests.
        - name: unitType
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - single
                - double_double
                - double_twin
                - double_either
                - triple
                - quad
                - family
                - suite
                - studio
                - apartment
          description: Match any of the comma-separated unit type codes.
        - name: tier
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - economy
                - economy_plus
                - standard
                - standard_plus
                - komfort
                - komfort_plus
                - superior
                - deluxe
          description: Match any of the comma-separated tier codes.
        - name: amenities
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
          description: >-
            Comma-separated room type amenity codes. Returns room types that have all listed
            amenities, for example `balcony,bathtub` or `parking,welcome_drink`. Matches room
            assignments only; hotel amenities are not inherited by this filter. Unknown codes return
            `400`. See [Filtering](/api/amenities#filtering).
        - name: amenityCategory
          in: query
          schema:
            type: string
            enum:
              - bathroom
              - equipment
              - accessibility
              - view
              - kitchen
              - inclusions
          description: >-
            Room type amenity category code. Returns room types that have at least one amenity in
            this category, for example `view` or `inclusions`. See
            [Filtering](/api/amenities#filtering).
      responses:
        "200":
          description: A paginated list of room types.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomTypesList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /room-types/{roomTypeId}:
    get:
      tags:
        - Room types
      summary: Get a room type
      operationId: getRoomType
      description: |
        Returns a single room type by id.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: roomTypeId
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Room type id.
        - name: expand
          in: query
          schema:
            type: array
            items:
              type: string
              enum:
                - hotel
                - amenityLabels
          description: >-
            Comma-separated expansions. `hotel` embeds the hotel's `id`, `name`, and `stars`.
            `amenityLabels` adds localized labels to amenity categories and amenities; see
            [Labels](/api/amenities#labels). You can request both.
          style: form
          explode: false
      responses:
        "200":
          description: The room type.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /visit-types:
    get:
      tags:
        - Visit types
      summary: List visit types
      operationId: getVisitTypes
      x-mint:
        content: |
          <Warning>
            **Draft:** This endpoint is not yet released on the production API.
            Its contract is complete and published for integration review.
          </Warning>
      description: |
        Returns the stay packages sold by the companies your public key is
        scoped to, as [Visit type](/api/objects/visit-type) objects. Only
        available packages are returned unless you set `available`. Filters
        apply before pagination and `total`.

        Comma-separated values are trimmed, empty items are ignored and
        duplicates are removed. Each value may have at most 500 characters; an
        unknown code returns `400`. Unknown parameter names are ignored. See
        [Visit types](/api/visit-types) for availability and stay rules.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of records to return. See [Pagination](/api/pagination).
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2000
          description: >-
            Cursor from the previous page's `pagination.nextCursor`. Keep the sort and filters
            unchanged while paging.
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - webOrder
              - createdAt:desc
              - createdAt:asc
            default: webOrder
          description: >-
            `webOrder` follows the website position across all companies of your public key:
            packages with a position first, in position order, then the others in a stable order.
            `createdAt:desc` and `createdAt:asc` order by record id, which generally follows
            creation order. Cursors do not freeze a snapshot: changes between requests, including
            the change of day at midnight (Europe/Prague), can skip or repeat a package.
        - name: available
          in: query
          schema:
            type: string
            enum:
              - "true"
              - "false"
              - all
            default: "true"
          description: >-
            Filter by catalog availability. See
            [Availability](/api/visit-types#publication-and-availability).
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
          description: Substring of the package name in any language, case- and diacritics-insensitive.
        - name: hotelId
          in: query
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: >-
            Return only packages sold by this hotel. An unknown or unauthorized id matches no
            packages. The filter does not narrow `hotels[]` or the package's `priceFrom`; read the
            price at this hotel from its `hotels[]` entry.
        - name: category
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - health
                - wellness
          description: Match any of the listed categories.
        - name: payer
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - guest
                - guest_and_insurer
                - insurer
          description: >-
            Match any of the listed payers. Wellness packages have `payer: null` and never match.
        - name: collection
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/VisitTypeCollection"
          description: >-
            Match any of the listed codes in `channelContent.collections`. Outside the company's
            own website channel no package matches. See
            [Channel content](/api/objects/visit-type#channel-content).
        - name: bookingMode
          in: query
          schema:
            type: string
            enum:
              - instant
              - request
          description: Match the booking mode.
        - name: procedure
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TreatmentProcedureCode"
          description: >-
            Match packages whose `treatment.procedures.items` contain all listed codes. Packages
            with `selection: hotel_offer` never match.
        - name: board
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/MealCode"
          description: >-
            Match packages whose included meals contain all listed codes. A meal that is only
            changeable does not match.
        - name: nights
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 693
          description: >-
            Match packages that permit a stay of this many nights. A week is seven nights and
            week-based packages require whole weeks. See
            [Stay rules](/api/visit-types#testing-a-stay-against-its-rules).
        - name: arrivalFrom
          in: query
          schema:
            type: string
            format: date
          description: >-
            Start of an inclusive arrival window; requires `arrivalTo`, at most 366 days later.
            Matches packages with a permitted stay that arrives in the window, from today onward,
            of `nights` nights or of their shortest permitted length. Prices and room capacity are
            not checked.
        - name: arrivalTo
          in: query
          schema:
            type: string
            format: date
          description: >-
            End of the arrival window, inclusive. A missing `arrivalFrom`, a reversed window or a
            window longer than 366 days returns `400`.
        - name: expand
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              enum:
                - hotels
          description: >-
            `hotels` adds `hotels[].hotel`. `seasons` is accepted only by the detail endpoint and
            returns `400` here. See [Expand](/api/expand).
      responses:
        "200":
          description: A page of visit types.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitTypesList"
              examples:
                first-page:
                  summary: First page of two packages (limit=2)
                  description: "Illustrative response for the company's own website channel with `Accept-Language: cs-CZ,de` and today = 2026-10-30. `limit=2` leaves the third matching package for the next page."
                  value:
                    data:
                      - id: 6720c0a1b2c3d4e5f6a7b801
                        name:
                          cs-CZ: Klasická lázeňská léčba
                          de: Klassische Kur
                        shortDescription:
                          cs-CZ: Lázeňská léčba s lékařskými prohlídkami, přírodními procedurami a polopenzí.
                          de: Kuraufenthalt mit ärztlichen Untersuchungen, natürlichen Anwendungen und Halbpension.
                        category: health
                        payer: guest
                        bookingMode: instant
                        available: true
                        unavailableReason: null
                        webOrder: 3
                        channelContent:
                          collections:
                            - treatment_stays
                            - special_offers
                        board:
                          meals:
                            - meal: breakfast
                              included: true
                              changeable: false
                            - meal: lunch
                              included: false
                              changeable: true
                            - meal: dinner
                              included: true
                              changeable: false
                            - meal: all_inclusive
                              included: false
                              changeable: false
                        stayLength:
                          unit: week
                          min: 1
                          max: 3
                        validity:
                          - from: 2026-11-01
                            to: 2027-03-31
                            toAppliesTo: departure
                          - from: 2027-04-01
                            to: 2027-10-31
                            toAppliesTo: arrival
                        arrival:
                          type: weekdays
                          weekdays:
                            - saturday
                            - sunday
                        treatment:
                          exams:
                            entry: true
                            interim: true
                            interimFromNights: 14
                            final: true
                            finalFromNights: null
                          procedures:
                            count: 15
                            per: week
                            selection: fixed
                            items:
                              - code: carbon_dioxide_bath
                                label:
                                  cs-CZ: Kysličníková koupel
                                  de: Kohlensäurebad
                                category:
                                  code: hydrotherapy
                                  label:
                                    cs-CZ: Vodoléčba
                                    de: Hydrotherapie
                                naturalSource: carbon_dioxide
                                count: 6
                              - code: peat_wrap
                                label:
                                  cs-CZ: Rašelinový zábal
                                  de: Moorpackung
                                category:
                                  code: thermotherapy
                                  label:
                                    cs-CZ: Teploléčba
                                    de: Thermotherapie
                                naturalSource: peat
                                count: 4
                              - code: classic_full_body_massage
                                label:
                                  cs-CZ: Klasická celková masáž
                                  de: Klassische Ganzkörpermassage
                                category:
                                  code: physiotherapy
                                  label:
                                    cs-CZ: Fyzioterapie
                                    de: Physiotherapie
                                naturalSource: null
                                count: 3
                              - code: drinking_cure
                                label:
                                  cs-CZ: Pitná kúra
                                  de: Trinkkur
                                category:
                                  code: other
                                  label:
                                    cs-CZ: Ostatní
                                    de: Sonstiges
                                naturalSource: mineral_water
                                count: 14
                        priceFrom:
