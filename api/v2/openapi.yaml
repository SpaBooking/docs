    VisitType:
      type: object
      description: "**Draft:** A stay package with rules, board, treatment, hotel-specific prices and
        promotions. See [Visit type](/api/objects/visit-type); behavioral rules are in [Visit
        types](/api/visit-types)."
      required:
        - id
        - name
        - shortDescription
        - category
        - payer
        - bookingMode
        - available
        - unavailableReason
        - webOrder
        - collections
        - board
        - stayLength
        - validity
        - arrival
        - treatment
        - priceFrom
        - promotions
        - hotels
        - images
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: Visit type id. The same id identifies the visit type in the `priceFrom` minima of hotels.
          example: 6720c0a1b2c3d4e5f6a7b801
        name:
          allOf:
            - $ref: "#/components/schemas/VisitTypeNameLocalizedString"
          description: Localized visit type name. A missing translation falls back to the Czech name, so a
            returned value is never empty.
        shortDescription:
          $ref: "#/components/schemas/VisitTypeShortDescription"
        category:
          type: string
          enum:
            - health
            - wellness
          description: Required stay category; never inferred or null.
        payer:
          type: string
          nullable: true
          enum:
            - guest
            - guest_and_insurer
            - insurer
            - null
          description: Required for health, null for wellness. See
            [Payer](/api/objects/visit-type#category-payer-and-booking-mode).
        bookingMode:
          type: string
          enum:
            - instant
            - request
          description: "instant: confirmed immediately. request: every booking is a request confirmed by the
            hotel. Insurer-paid stays always use request."
        available:
          type: boolean
          description: Whether offered now; independent of specific-date price or room capacity. See
            [Availability](/api/visit-types#publication-and-availability).
        unavailableReason:
          type: string
          nullable: true
          enum:
            - disabled
            - ended
            - no_arrival
            - no_hotels
            - null
          description: First applicable catalog reason in this order; null iff available. Invalid data is not
            published. See [Availability](/api/visit-types#publication-and-availability).
        webOrder:
          type: integer
          nullable: true
          minimum: 1
          description: Position of the visit type on the website within its company, starting at 1, or null
            when it has no position. Used by `sort=webOrder`.
          example: 3
        collections:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/VisitTypeCollection"
          description: Channel-specific own-website content. Empty outside the resolved owner channel,
            including SpaBooking keys. See [Collections](/api/objects/visit-type#collections) and
            [Authentication](/api/authentication).
        board:
          $ref: "#/components/schemas/Board"
        stayLength:
          $ref: "#/components/schemas/VisitTypeStayLength"
        validity:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/VisitTypeValidityPeriod"
          description: Current/future periods ordered by from, to, toAppliesTo. Null when none are configured,
            [] when all ended. See [Stay rules](/api/visit-types#testing-a-stay-against-its-rules).
        arrival:
          $ref: "#/components/schemas/VisitTypeArrival"
        treatment:
          $ref: "#/components/schemas/Treatment"
        priceFrom:
          anyOf:
            - $ref: "#/components/schemas/VisitTypePriceFrom"
            - type: object
              nullable: true
              enum:
                - null
          description: Aggregate minimum across authorized hotel entries; null for unavailable/request-only
            packages or no buyable offer. See [Prices](/api/prices).
        promotions:
          type: array
          items:
            $ref: "#/components/schemas/Promotion"
          description: Applicable current/future promotions for the authenticated channel, once per identity,
            ordered by from then id. See [Promotion](/api/objects/promotion).
        hotels:
          type: array
          items:
            $ref: "#/components/schemas/VisitTypeAtHotel"
          description: Authorized active hotels selling this visit type, sorted by Czech name then id. An
            entry can have priceFrom:null. See [Hotels](/api/objects/visit-type#hotels).
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
          description: Photos in configured order; the first is the main photo. A missing `alt` translation
            falls back to the localized visit type name; an empty `alt` marks a decorative image.
            See [Images](/api/images).
      allOf:
        - oneOf:
            - properties:
                category:
                  enum:
                    - wellness
                payer:
                  type: string
                  nullable: true
                  enum:
                    - null
              type: object
              required:
                - category
                - payer
            - properties:
                category:
                  enum:
                    - health
                payer:
                  enum:
                    - guest
                    - guest_and_insurer
              type: object
              required:
                - category
                - payer
            - properties:
                category:
                  enum:
                    - health
                payer:
                  enum:
                    - insurer
                bookingMode:
                  enum:
                    - request
              type: object
              required:
                - category
                - payer
                - bookingMode
        - oneOf:
            - properties:
                available:
                  enum:
                    - true
                unavailableReason:
                  type: string
                  nullable: true
                  enum:
                    - null
              type: object
              required:
                - available
                - unavailableReason
            - properties:
                available:
                  enum:
                    - false
                unavailableReason:
                  enum:
                    - disabled
                    - ended
                    - no_arrival
                    - no_hotels
              type: object
              required:
                - available
                - unavailableReason
    VisitTypesList:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/VisitType"
          description: Visit types on this page.
        pagination:
          allOf:
            - $ref: "#/components/schemas/Pagination"
          description: Cursor of the next page and the total number of matching visit types.
    VisitTypeCollection:
      type: string
      description: >-
        Website collection code. See [Collections](/api/objects/visit-type#collections) for the
        meaning of each code.
      enum:
        - advent_christmas_new_year
        - families_with_children
        - wellness
        - treatment_stays
        - special_offers
        - hotel_stay
    MealCode:
      type: string
      enum:
        - breakfast
        - lunch
        - dinner
        - all_inclusive
      description: Meal code. See [Board](/api/objects/visit-type#board).
    VisitTypeStayLength:
      type: object
      required:
        - unit
        - min
        - max
      properties:
        unit:
          type: string
          enum:
            - night
            - week
        min:
          type: integer
          minimum: 1
          description: Minimum length in unit. Weeks are whole weeks.
        max:
          type: integer
          minimum: 1
          description: Configured business maximum in unit, at least min, or null when unlimited. Internal
            99/693 sentinels and search bounds are not business limits.
          nullable: true
    VisitTypeValidityPeriod:
      type: object
      required:
        - from
        - to
        - toAppliesTo
      properties:
        from:
          type: string
          description: First permitted arrival date.
          format: date
        to:
          type: string
          description: Inclusive last arrival or checkout date, according to toAppliesTo.
          format: date
        toAppliesTo:
          type: string
          enum:
            - arrival
            - departure
    VisitTypeArrival:
      oneOf:
        - $ref: "#/components/schemas/VisitTypeWeekdayArrival"
        - $ref: "#/components/schemas/VisitTypeDateArrival"
      discriminator:
        propertyName: type
        mapping:
          weekdays: "#/components/schemas/VisitTypeWeekdayArrival"
          dates: "#/components/schemas/VisitTypeDateArrival"
    Weekday:
      type: string
      description: >-
        Weekday code, the lowercase English day name (not an ISO 8601 day number). See [Stay length
        and arrival](/api/objects/visit-type#stay-length-and-arrival) for the code table.
      enum:
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday
        - sunday
    VisitTypeExams:
      type: object
      required: [ entry, interim, interimFromNights, final, finalFromNights ]
      properties:
        entry:
          type: boolean
          description: An entry examination at the start of the stay is included.
        interim:
          type: boolean
          description: An interim examination during the stay is included.
        interimFromNights:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            Stay length in nights from which the interim examination is included, or null when it is
            included for every stay length or not included.
        final:
          type: boolean
          description: A final examination at the end of the stay is included.
        finalFromNights:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            Stay length in nights from which the final examination is included, or null when it is
            included for every stay length or not included.
      allOf:
        - oneOf:
            - type: object
              required:
                - interim
              properties:
                interim:
                  type: boolean
                  enum:
                    - false
                interimFromNights:
                  type: integer
                  nullable: true
                  enum:
                    - null
            - type: object
              required:
                - interim
              properties:
                interim:
                  type: boolean
                  enum:
                    - true
        - oneOf:
            - type: object
              required:
                - final
              properties:
                final:
                  type: boolean
                  enum:
                    - false
                finalFromNights:
                  type: integer
                  nullable: true
                  enum:
                    - null
            - type: object
              required:
                - final
              properties:
                final:
                  type: boolean
                  enum:
                    - true
    VisitTypeProcedures:
      type: object
      required: [ count, per, selection, items ]
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of procedures included per `per` unit.
        per:
          type: string
          enum: [ stay, week, day ]
          description: Unit of `count`.
        selection:
          type: string
          enum: [ hotel_offer, from_list, fixed ]
          description: >-
            How the procedures are chosen: `hotel_offer` (from the hotel's offer; `items` is empty),
            `from_list` (from `items`) or `fixed` (`items` with their counts).
        items:
          type: array
          items:
            $ref: "#/components/schemas/TreatmentProcedure"
          description: Procedures of the visit type in configured order. Empty for `hotel_offer`.
      oneOf:
        - type: object
          required:
            - selection
          properties:
            selection:
              type: string
              enum:
                - hotel_offer
            items:
              type: array
              maxItems: 0
        - type: object
          required:
            - selection
          properties:
            selection:
              type: string
              enum:
                - from_list
            items:
              type: array
              items:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: integer
                    nullable: true
                    enum:
                      - null
        - type: object
          required:
            - selection
          properties:
            selection:
              type: string
              enum:
                - fixed
            items:
              type: array
              items:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: integer
                    minimum: 1
    TreatmentProcedure:
      type: object
