    TreatmentCategoryCode:
      type: string
      description: Procedure category code. See [Category codes](/api/objects/procedure#category-codes).
      enum:
        - hydrotherapy
        - thermotherapy
        - electrotherapy
        - gas_therapy
        - physiotherapy
        - inhalation
        - wellness
        - thai_massage
        - other
        - diagnostics
    VisitTypeHotel:
      type: object
      required:
        - id
        - name
        - stars
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: Hotel id, equal to the entry's `hotelId`.
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized hotel name. A missing translation falls back to the Czech name; the value is
            null when neither exists.
        stars:
          type: integer
          nullable: true
          minimum: 1
          maximum: 5
          description: Star rating from 1 to 5, or null when the hotel has none.
      description: Hotel summary embedded by `expand=hotels`. Fetch `GET /hotels/{hotelId}` for the full hotel.
    AmenityCategory:
      type: object
      required: [ scope, code, label ]
      oneOf:
        - title: Hotel category
          required: [ scope, code ]
          properties:
            scope: { enum: [ hotel ] }
            code: { enum: [ health, wellness, dining, services, accessibility, parking, sport, children ] }
            label:
              $ref: "#/components/schemas/LocalizedString"
          example:
            scope: hotel
            code: wellness
            label: { cs-CZ: Bazény a wellness, en: Pools & wellness }
        - title: Room type category
          required: [ scope, code ]
          properties:
            scope: { enum: [ roomType ] }
            code: { enum: [ bathroom, equipment, accessibility, view, kitchen, inclusions ] }
            label:
              $ref: "#/components/schemas/LocalizedString"
          example:
            scope: roomType
            code: view
            label: { cs-CZ: Výhled, en: View }
      properties:
        scope:
          type: string
          enum: [ hotel, roomType ]
          description: Resource scope. Together with code, identifies the category.
        code:
          type: string
          enum:
            - health
            - wellness
            - dining
            - services
            - accessibility
            - parking
            - sport
            - children
            - bathroom
            - equipment
            - view
            - kitchen
            - inclusions
          description: Category code, unique within its scope.
        label:
          $ref: "#/components/schemas/LocalizedString"
    HotelAmenityCategoryRef:
      type: object
      title: Hotel category
      additionalProperties: false
      required: [ code ]
      description: >-
        A category assigned to a hotel. Resolve its `code` in the hotel amenity dictionary or
        request `expand=amenityLabels`; see [Labels](/api/amenities#labels).
      properties:
        code:
          type: string
          enum:
            - health
            - wellness
            - dining
            - services
            - accessibility
            - parking
            - sport
            - children
          description: Category code in the hotel amenity dictionary.
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized category label. Present only with `expand=amenityLabels`.
      example:
        code: wellness
    RoomTypeAmenityCategoryRef:
      type: object
      title: Room type category
      additionalProperties: false
      required: [ code ]
      description: >-
        A category assigned to a room type. Resolve its `code` in the room type amenity dictionary
        or request `expand=amenityLabels`; see [Labels](/api/amenities#labels).
      properties:
        code:
          type: string
          enum: [ bathroom, equipment, accessibility, view, kitchen, inclusions ]
          description: Category code in the room type amenity dictionary.
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized category label. Present only with `expand=amenityLabels`.
      example:
        code: view
    AmenityCategoryGroup:
      type: object
      required: [ category, amenities ]
      description: >-
        One amenity category and the amenity dictionary entries assigned to it.
      properties:
        category:
          $ref: "#/components/schemas/AmenityCategory"
        amenities:
          type: array
          items:
            $ref: "#/components/schemas/Amenity"
    AmenityOption:
      type: object
      required: [ code, label ]
      description: >-
        One localized amenity-specific option. Its meaning is scoped by the parent amenity code.
      properties:
        code:
          type: string
          description: Stable option code.
          example: finnish
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized option label.
    AmenityOptionRef:
      type: object
      required: [ code ]
      description: >-
        A selected amenity option on a hotel or room type response. Identified by `code`; its
        localized `label` is included only with `expand=amenityLabels`. Otherwise resolve the label
        against the amenity's `options` in the [amenity dictionary](/api/amenities).
      properties:
        code:
          type: string
          description: References an option `code` from the dictionary.
          example: finnish
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized option label. Present only with `expand=amenityLabels`.
    Amenity:
      type: object
      required: [ code, label, detailKinds ]
      description: >-
        One amenity dictionary entry nested under its category in the response from `GET
        /amenity-categories`.
      properties:
        code:
          type: string
          description: Stable code assigned to hotels or room types and used for filtering.
          example: sauna
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized display name.
          example:
            cs-CZ: Sauna
            de: Sauna
            en: Sauna
        detailKinds:
          type: array
          description: >-
            Details that hotels and room types can specify for this amenity. Each kind adds specific
            fields to the amenity value. See [Detail kinds](/api/amenities#detail-kinds) for the
            fields and values of each kind. An empty array marks a presence-only amenity.
          items:
            type: string
            enum:
              - proximity
              - pricing
              - coverage
              - options
              - opening_hours
              - note
              - includes
        options:
          type: array
          description: >-
            All choices supported by this amenity. Present when `detailKinds` includes `options`.
          items:
            $ref: "#/components/schemas/AmenityOption"
        includedAmenityCodes:
          type: array
          uniqueItems: true
          description: >-
            Allowed child codes, in display order. Present on aquapark, whose detailKinds includes
            includes. Resolve these codes in the hotel dictionary.
          items:
            type: string
            enum: [ indoor_pool, outdoor_pool, children_pool, whirlpool, sauna ]
        notePlaceholder:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Optional localized helper text for the amenity note. Omitted when the amenity does not
            define one.
      example:
        code: sauna
        label:
          cs-CZ: Sauna
          de: Sauna
          en: Sauna
          ru: Сауна
        detailKinds: [ proximity, pricing, options, opening_hours, note ]
        options:
          - code: finnish
            label:
              cs-CZ: Finská sauna
              de: Finnische Sauna
              en: Finnish sauna
              ru: Финская сауна
          - code: infrared
            label:
              cs-CZ: Infra sauna
              de: Infrarotsauna
              en: Infrared sauna
              ru: Инфракрасная сауна
          - code: steam
            label:
              cs-CZ: Parní lázeň
              de: Dampfbad
              en: Steam bath
              ru: Паровая баня
    AmenityWeekdays:
      type: array
      minItems: 1
      uniqueItems: true
      description: Weekdays in Monday-to-Sunday order.
      items:
        type: string
        enum: [ monday, tuesday, wednesday, thursday, friday, saturday, sunday ]
    AmenityOpeningHoursBlock:
      type: object
      additionalProperties: false
      required: [ days, from, to ]
      description: >-
        A weekly interval in hotel local time. Intervals sharing a day do not overlap. A range
        crossing midnight uses two blocks on successive days.
      properties:
        days:
          $ref: "#/components/schemas/AmenityWeekdays"
        from:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: Start time in the 24-hour HH:mm format.
          example: "09:00"
        to:
          type: string
          pattern: "^(([01]\\d|2[0-3]):[0-5]\\d|24:00)$"
          description: End time, later than from. 24:00 is the end of the listed day.
          example: "21:00"
    AmenityPricingScheduleBlock:
      oneOf:
        - $ref: "#/components/schemas/AmenityOpeningHoursBlock"
        - type: object
          additionalProperties: false
          required: [ days, from, to ]
          description: Entry is included throughout opening hours on these days.
          properties:
            days:
              $ref: "#/components/schemas/AmenityWeekdays"
            from:
              type: string
              nullable: true
              enum: [ null ]
            to:
              type: string
              nullable: true
              enum: [ null ]
    AmenityPricing:
      description: >-
        Price status, or null when unknown. No monetary amount is returned. A scheduled window does
        not specify whether entry outside it is paid.
      oneOf:
        - type: object
          nullable: true
          enum: [ null ]
        - type: object
          additionalProperties: false
          required: [ type, schedule ]
          properties:
            type:
              type: string
              enum: [ included, included_conditional, paid ]
              description: Conditional inclusion is described in the amenity's localized note.
            schedule:
              type: array
              nullable: true
              enum: [ null ]
              items:
                $ref: "#/components/schemas/AmenityPricingScheduleBlock"
        - type: object
          additionalProperties: false
          required: [ type, schedule ]
          properties:
            type:
              type: string
              enum: [ included_scheduled ]
            schedule:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/AmenityPricingScheduleBlock"
    AmenityOpeningHours:
      description: >-
        Weekly opening hours in hotel local time, or null when unknown. A day absent from a known
        schedule has no opening interval. A single block covering all seven days from 00:00 to 24:00
        means 24/7.
      oneOf:
        - type: object
          nullable: true
          enum: [ null ]
        - type: object
          additionalProperties: false
          required: [ schedule ]
          properties:
            schedule:
              type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/AmenityOpeningHoursBlock"
    AmenityValue:
      type: object
      additionalProperties: false
      required: [ code ]
      description: >-
        A structured amenity assigned to a hotel or room type. Apart from `code` (and `label` with
        `expand=amenityLabels`), it contains only the fields of the detail kinds that the matching
        dictionary amenity declares. See [Detail kinds](/api/amenities#detail-kinds).
      properties:
        code:
          type: string
          description: References an `Amenity.code`.
          example: sauna
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized amenity label. Present only with `expand=amenityLabels`.
        proximity:
          type: string
          nullable: true
          enum: [ in-hotel, connecting, nearby, null ]
          description: >-
            Where the amenity is located relative to the hotel. Present when `detailKinds` includes
            [`proximity`](/api/amenities#proximity); null when not specified. `in-hotel` is inside
            the hotel building, `connecting` is an adjacent building linked by an internal passage,
            and `nearby` is a short distance away (see `proximityMeters`).
        proximityMeters:
          type: number
          minimum: 0
          maximum: 1000000
          nullable: true
          description: >-
            Present with `proximity`. Contains a distance when `proximity` is `nearby`; otherwise
            null.
        pricing:
          allOf:
            - $ref: "#/components/schemas/AmenityPricing"
          description: >-
            Present when the dictionary declares [pricing](/api/amenities#pricing). Null means
            unknown. Otherwise read type and schedule.
        coverage:
          type: string
          enum: [ all, some ]
          description: >-
            Whether the amenity is available in all physical rooms of this room type or only some.
            Present only when the dictionary declares [coverage](/api/amenities#coverage). `all`
            means every room; `some` means only some rooms. Defaults to `all` when unspecified and
            is never null. Omitted on hotel amenities.
        options:
          type: array
          description: >-
            Amenity-specific choices selected for this hotel or room type. Each option contains
            `code` by default and also `label` with `expand=amenityLabels`. Present when
            `detailKinds` includes [`options`](/api/amenities#options). Empty when the amenity
            supports choices but none are selected. Labels are also available in the dictionary.
          items:
            $ref: "#/components/schemas/AmenityOptionRef"
        openingHours:
          allOf:
            - $ref: "#/components/schemas/AmenityOpeningHours"
          description: >-
            Present when `detailKinds` includes [`opening_hours`](/api/amenities#opening-hours).
            Null when unknown.
        note:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Present when `detailKinds` includes [`note`](/api/amenities#note). Localized
            supplementary information for guests. Locale values are at most 200 characters and are
            null when the requested translation is not available.
        includes:
          type: array
          description: >-
            Aquapark facilities with resolved pricing, hours, location and note. Present when the
            dictionary declares [includes](/api/amenities#includes). Empty when no facilities are
            specified. Children are not duplicated among the hotel's own amenities and cannot
            contain further includes.
          items:
            $ref: "#/components/schemas/IncludedAmenityValue"
      example:
        code: aquapark
        proximity: nearby
        proximityMeters: 250
        pricing: { type: included, schedule: null }
        note: { en: null }
        includes: []
        openingHours:
          schedule:
            - days: [ monday, tuesday, wednesday ]
              from: "09:00"
              to: "21:00"
    IncludedAmenityValue:
      type: object
      additionalProperties: false
      required: [ code, proximity, proximityMeters, pricing, openingHours, note ]
      description: >-
        One aquapark facility. Values already include inherited conditions; clients do not resolve
        inheritance. Sauna also returns options.
      properties:
        code:
          type: string
          enum: [ indoor_pool, outdoor_pool, children_pool, whirlpool, sauna ]
        label:
          $ref: "#/components/schemas/AmenityValue/properties/label"
        proximity:
          $ref: "#/components/schemas/AmenityValue/properties/proximity"
        proximityMeters:
          $ref: "#/components/schemas/AmenityValue/properties/proximityMeters"
        pricing:
          $ref: "#/components/schemas/AmenityValue/properties/pricing"
        options:
          $ref: "#/components/schemas/AmenityValue/properties/options"
        openingHours:
          $ref: "#/components/schemas/AmenityValue/properties/openingHours"
        note:
          $ref: "#/components/schemas/AmenityValue/properties/note"
      oneOf:
        - properties:
            code:
              enum: [ sauna ]
          required: [ options ]
        - properties:
            code:
              enum: [ indoor_pool, outdoor_pool, children_pool, whirlpool ]
          not:
            properties:
              options: {}
            required: [ options ]
    HotelAmenityCategoryGroup:
      type: object
      required: [ category, amenities ]
      description: >-
        One hotel amenity category containing values assigned to a hotel. Categories without
        assigned amenities are omitted from hotel responses.
      properties:
        category:
          $ref: "#/components/schemas/HotelAmenityCategoryRef"
        amenities:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AmenityValue"
    AmenityCategoriesList:
      type: object
      required: [ data ]
      description: >-
        The complete amenity dictionary for both scopes unless a scope filter is set, grouped by
        category and returned in one response (small, not paginated). It includes every system
        amenity in the selected scopes, independent of assignments to hotels or room types.
        Amenities that support choices carry their full `options` list.
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AmenityCategoryGroup"
      example:
        data:
          - category:
              scope: hotel
              code: wellness
              label: { cs-CZ: Bazény a wellness, de: Pools & Wellness, en: "Pools & wellness" }
            amenities:
              - code: aquapark
                label: { cs-CZ: Akvapark, de: Aquapark, en: Aquapark }
                detailKinds: [ proximity, pricing, opening_hours, note, includes ]
                includedAmenityCodes: [ indoor_pool, outdoor_pool, children_pool, whirlpool, sauna ]
              - code: sauna
                label: { cs-CZ: Sauna, de: Sauna, en: Sauna }
                detailKinds: [ proximity, pricing, options, opening_hours, note ]
                options:
                  - code: finnish
                    label: { cs-CZ: Finská sauna, de: Finnische Sauna, en: "Finnish sauna" }
                  - code: infrared
                    label: { cs-CZ: Infra sauna, de: Infrarotsauna, en: "Infrared sauna" }
                  - code: steam
                    label: { cs-CZ: Parní lázeň, de: Dampfbad, en: "Steam bath" }
          - category:
              scope: roomType
              code: view
              label: { cs-CZ: Výhled, de: Aussicht, en: View }
            amenities:
              - code: balcony
                label: { cs-CZ: Balkon, de: Balkon, en: Balcony }
                detailKinds: [ coverage ]
          - category:
              scope: roomType
              code: inclusions
              label:
                cs-CZ: V ceně pokoje
                de: Im Zimmerpreis inbegriffen
                en: Included with this room
            amenities:
              - code: parking
                label: { cs-CZ: Parkoviště, de: Parkplatz, en: Parking }
                detailKinds: [ pricing ]
              - code: welcome_drink
                label: { cs-CZ: Welcome drink, de: Begrüßungsgetränk, en: Welcome drink }
                detailKinds: []
              - code: fruit_bowl
                label: { cs-CZ: Mísa s ovocem, de: Obstschale, en: Fruit bowl }
                detailKinds: []
    BoardMeal:
      type: object
      required:
        - meal
        - included
        - changeable
      properties:
        meal:
          $ref: "#/components/schemas/MealCode"
        included:
          type: boolean
          description: The meal is included in the package price.
        changeable:
          type: boolean
          description: The guest can drop the meal when it is included, or add it when it is not.
    Board:
      type: object
      required:
        - meals
      properties:
        meals:
          type: array
          maxItems: 4
          uniqueItems: true
          items:
            $ref: "#/components/schemas/BoardMeal"
          description: >-
            One row per meal code, in the order `breakfast`, `lunch`, `dinner`, `all_inclusive`. All
            four rows are always returned.
      description: >-
        Meals included in the package and the changes a guest can make. See
        [Board](/api/objects/visit-type#board).
      example:
        meals:
          - meal: breakfast
            included: true
            changeable: false
          - meal: lunch
            included: false
            changeable: true
          - meal: dinner
            included: true
            changeable: false
          - meal: all_inclusive
            included: false
            changeable: false
    VisitTypeShortDescription:
      type: object
      additionalProperties: false
      properties:
        cs-CZ:
          type: string
          nullable: true
          maxLength: 120
        de:
          type: string
          nullable: true
          maxLength: 120
        en:
          type: string
          nullable: true
          maxLength: 120
        ru:
          type: string
          nullable: true
          maxLength: 120
      description: >-
        Localized plain-text purpose line of up to 120 characters per translation. A missing
        translation is null.
    VisitTypeWeekdayArrival:
      title: Weekday arrival
      type: object
      required:
        - type
        - weekdays
      properties:
        type:
          type: string
          enum:
            - weekdays
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Weekday"
          description: Permitted arrival weekdays, Monday first.
      additionalProperties: false
    VisitTypeDateArrival:
      title: Date arrival
      type: object
      required:
        - type
        - dates
      properties:
        type:
          type: string
          enum:
            - dates
        dates:
          type: array
          uniqueItems: true
          items:
            type: string
            format: date
          description: >-
            Permitted arrival dates from today onward, in ascending order. Empty when every
            configured date has passed.
      additionalProperties: false
    Procedure:
      type: object
      required:
        - code
        - label
        - category
        - naturalSource
      properties:
        code:
          allOf:
            - $ref: "#/components/schemas/TreatmentProcedureCode"
          description: Procedure code. See [Procedure codes](/api/objects/procedure#procedure-codes).
        label:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized procedure name.
        category:
          allOf:
            - $ref: "#/components/schemas/TreatmentProcedureCategory"
          description: Procedure category.
        naturalSource:
          type: string
          nullable: true
          enum:
            - carbon_dioxide
            - peat
            - mineral_water
            - null
          description: Natural healing source of the procedure, or null when it has none.
      not:
        type: object
        required:
          - count
        properties:
          count: {}
      description: >-
        A procedure offered by a hotel or included in a package. See
        [Procedure](/api/objects/procedure).
      example:
        code: carbon_dioxide_bath
        label:
          cs-CZ: Kysličníková koupel
          de: Kohlensäurebad
        category:
          code: hydrotherapy
          label:
            cs-CZ: Vodoléčba
            de: Hydrotherapie
        naturalSource: carbon_dioxide
    Treatment:
      type: object
      required:
        - exams
        - procedures
      properties:
        exams:
          allOf:
            - $ref: "#/components/schemas/VisitTypeExams"
          description: Medical examinations included in the price.
        procedures:
          allOf:
            - $ref: "#/components/schemas/VisitTypeProcedures"
          description: Procedure allowance and selection.
      description: >-
        Examinations and procedures included in a package. See
        [Treatment](/api/objects/treatment).
      example:
        exams:
          entry: true
          interim: true
          interimFromNights: 14
          final: true
          finalFromNights: null
        procedures:
          count: 15
          per: week
          selection: fixed
          items:
            - code: carbon_dioxide_bath
              label:
                cs-CZ: Kysličníková koupel
                de: Kohlensäurebad
              category:
                code: hydrotherapy
                label:
                  cs-CZ: Vodoléčba
                  de: Hydrotherapie
              naturalSource: carbon_dioxide
              count: 6
            - code: peat_wrap
              label:
                cs-CZ: Rašelinový zábal
                de: Moorpackung
              category:
                code: thermotherapy
                label:
                  cs-CZ: Teploléčba
                  de: Thermotherapie
              naturalSource: peat
              count: 4
            - code: classic_full_body_massage
              label:
                cs-CZ: Klasická celková masáž
                de: Klassische Ganzkörpermassage
              category:
                code: physiotherapy
                label:
                  cs-CZ: Fyzioterapie
                  de: Physiotherapie
              naturalSource: null
              count: 3
            - code: drinking_cure
              label:
                cs-CZ: Pitná kúra
                de: Trinkkur
              category:
                code: other
                label:
                  cs-CZ: Ostatní
                  de: Sonstiges
              naturalSource: mineral_water
              count: 14
    VisitTypeSeason:
      type: object
      required:
        - id
        - from
        - to
        - priceFrom
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: >-
            Season id. Stable while the season exists; splitting or replacing a season creates new
            ids. The same season appears under every hotel of the package.
        from:
          type: string
          format: date
          description: First arrival date of the season.
        to:
          type: string
          format: date
          description: Last arrival date of the season, inclusive.
        priceFrom:
          type: object
          nullable: true
          additionalProperties: false
          minProperties: 1
          properties:
            CZK:
              $ref: "#/components/schemas/PriceFromPair"
            EUR:
              $ref: "#/components/schemas/PriceFromPair"
          description: >-
            Lowest prices for arrivals in this season, from today onward, per currency. A stay can
            continue into a later season. Null when the season has no buyable offer, or when the
            package is unavailable or booked on request.
      description: >-
        A price-list season of a package at one hotel. See
        [Seasonal prices](/api/prices#seasonal-prices).
    VisitTypeAtHotel:
      type: object
      required:
        - hotelId
        - priceFrom
      properties:
        hotelId:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: Active hotel selling the package. Present even when the hotel has no buyable price.
        priceFrom:
          type: object
          nullable: true
          additionalProperties: false
          minProperties: 1
          properties:
            CZK:
              $ref: "#/components/schemas/PriceFromPair"
            EUR:
              $ref: "#/components/schemas/PriceFromPair"
          description: >-
            Lowest prices of the package at this hotel, per currency. Null when the hotel has no
            buyable offer, or when the package is unavailable or booked on request.
        hotel:
          allOf:
            - $ref: "#/components/schemas/VisitTypeHotel"
          description: Hotel summary. Present only with `expand=hotels`.
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/VisitTypeSeason"
          description: >-
            Current and future price-list seasons, ordered by `from`, then `to`, then `id`. Present
            only with `expand=seasons` on the detail endpoint; empty when no season remains.
      description: >-
        A package at one hotel. Not a [Hotel](/api/objects/hotel) object; see
        [Hotels](/api/objects/visit-type#hotels).
    PromotionHotel:
      type: object
      required:
        - hotelId
        - roomTypeIds
      properties:
        hotelId:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: Hotel the promotion applies to. Entries are ordered by `hotelId`.
        roomTypeIds:
          type: array
          nullable: true
          minItems: 1
          items:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: >-
            Room types of the hotel the promotion applies to, ordered by id. Null when it applies to
            every room type of the hotel.
    Promotion:
      type: object
      required:
        - id
        - name
        - percentage
        - from
        - to
        - hotels
      properties:
        id:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: Promotion id. Each promotion appears once, even when it is assigned to several channels.
        name:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized promotion name.
        percentage:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          description: Discount in percent.
        from:
          type: string
          format: date
          description: First discounted night, identified by the date it starts on.
        to:
          type: string
          format: date
          nullable: true
          description: Last discounted night, inclusive. Null when the promotion has no end.
        hotels:
          type: array
          nullable: true
          minItems: 1
          items:
            $ref: "#/components/schemas/PromotionHotel"
          description: >-
            Hotels and room types the promotion is limited to. Null when it applies to every hotel
            selling the package.
      description: >-
        A promotion that applies to your channel. See [Promotion](/api/objects/promotion).
      example:
        id: 6720c0a1b2c3d4e5f6a7d302
        name:
          cs-CZ: Zimní nabídka vybraných pokojů
          de: Winterangebot für ausgewählte Zimmer
        percentage: 15
        from: 2027-01-04
        to: 2027-02-28
        hotels:
          - hotelId: 6720c0a1b2c3d4e5f6a7c101
            roomTypeIds:
              - 6720c0a1b2c3d4e5f6a7f101
              - 6720c0a1b2c3d4e5f6a7f102