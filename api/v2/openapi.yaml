          items:
            type: string
            enum: [cs, en, de, ru]
        amenityCategories:
          type: array
          description: >-
            Structured amenities assigned to this hotel, grouped by category.
            Categories without assigned amenities are omitted. Resolve each
            nested amenity `code` against the entries under the
            `GET /amenity-categories` response `data[].amenities[]` for its
