openapi: 3.0.3
info:
  title: SpaPortal API v2
  version: "2.0"
  description: The current SpaPortal public API.
servers:
  - url: https://spaportal.cz/api/v2
    description: Production
security:
  - spaPortalPublicKey: []
tags:
  - name: Hotels
  - name: Room types
  - name: Amenity categories
paths:
  /amenity-categories:
    get:
      tags: [Amenity categories]
      summary: List the amenity dictionary
      operationId: getAmenityCategories
      description: |
        Returns the full hotel amenity dictionary grouped by category. Each
        item in `data` contains a stable category code, its localized label,
        and the amenities in that category. Each nested amenity has a stable
        `code`, localized `label`, and supported `detailKinds`.

        This endpoint returns every amenity available in the system, independent
        of which amenities are assigned to a particular hotel. Fetch it to build
        amenity filters and resolve the codes returned in
        `hotel.amenityCategories[].amenities[]`. This small reference list is
        not paginated.

        Amenities whose `detailKinds` include `options` also carry an `options`
        array listing every supported choice with its localized label.

        The response is cacheable. Revalidate it with `If-None-Match` to get
        `304` while your copy is current, and compare the
        `X-SpaPortal-Amenities-Version` header returned by hotel endpoints with
        your cached version to detect dictionary updates. See
        [Amenities](/api/amenities) for the recommended caching flow.

        See the [Amenity](/api/objects/amenity) object for the full field reference.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: >-
            ETag from a previous response. When the dictionary variant is
            unchanged, the API returns `304` with no body. See
            [Amenities](/api/amenities) for the caching flow.
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: The amenity dictionary.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            ETag:
              $ref: "#/components/headers/ETag"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AmenityCategoriesList"
              example:
                data:
                  - category:
                      code: wellness
                      label:
                        cs-CZ: Bazény a wellness
                        de: Pools & Wellness
                        en: Pools & wellness
                    amenities:
                      - code: sauna
                        label: { cs-CZ: Sauna, de: Sauna, en: Sauna }
                        detailKinds: [proximity, access, options, opening_hours]
                        options:
                          - code: finnish
                            label:
                              cs-CZ: Finská sauna
                              de: Finnische Sauna
                              en: Finnish sauna
                          - code: infrared
                            label:
                              cs-CZ: Infra sauna
                              de: Infrarotsauna
                              en: Infrared sauna
                          - code: steam
                            label:
                              cs-CZ: Parní lázeň
                              de: Dampfbad
                              en: Steam bath
        "304":
          description: >-
            The cached dictionary variant matched by `If-None-Match` is still
            current. The response has no body.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /calendar/dates/bulk:
    post:
      x-hidden: true
      tags: [Availability]
      summary: Get calendar dates in bulk
      operationId: getCalendarDatesBulk
      description: |
        Returns availability and prices for multiple calendar queries in one
        request.

        Put values common to all items in `shared`; set only the differences per
        item. Each item's effective query resolves like this:

        | Case | Result |
        | --- | --- |
        | Field omitted from the item | The `shared` value is used. |
        | Field set on the item | The item value overrides `shared`. |
        | Field set to `null` on the item | `null` is used; `shared` is ignored. |
        | Field missing from both | `null` is used. |

        Results are returned one per item, in request order; `key` is echoed when
        supplied. `price.amounts` includes every currency that has a price for
        the date — a currency with no price is omitted. Per-date prices include
        any active discount promotions.

        If any item fails, the whole request fails (no partial results); the
        error details name the failing item index and `key`.
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarDatesBulkRequest"
      responses:
        "200":
          description: Calendar date results for each item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarDatesBulkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /hotels:
    get:
      tags: [Hotels]
      summary: List hotels
      operationId: getHotels
      x-mint:
        content: |
          <Warning>
            **Draft:** The `roomTypes` response field and `expand=roomTypes`
            behavior are still in progress. Their response shape may change
            before they are finalized.
          </Warning>
      description: |
        Returns active hotels across the companies your public key is scoped to.
        A hotel includes its localized short description and sales-channel
        content, structured accommodation rules, meal services, indications,
        staff languages, and hotel-level amenities. Localized fields return
        the locale keys selected by `Accept-Language`. `name` falls back to the
        default locale (cs-CZ); other untranslated values are returned as null.

        `priceFrom` contains the cheapest available current or future room
        price for the room's standard occupancy. It is null when no usable
        price is available. Applicable public-channel promotions are reflected
        in the price.

        See the [Hotel](/api/objects/hotel) object for the full field
        reference, including the allowed values for `serviceMethod`,
        `indications`, and `staffLanguages`.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of records to return. See [Pagination](/api/pagination).
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2000
          description: Cursor from the previous page's `pagination.nextCursor`. See [Pagination](/api/pagination).
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
          description: >-
            Full-text search of the hotel name across all supported languages
            (case- and diacritics-insensitive).
        - name: sort
          in: query
          schema:
            type: string
            enum: ["createdAt:desc", "createdAt:asc"]
            default: "createdAt:desc"
          description: Sort order. Ties are broken by `id`.
        - name: amenities
          in: query
          schema:
            type: string
            maxLength: 500
          description: >-
            Comma-separated amenity `code`s; returns only hotels that have ALL
            listed amenities (AND semantics). E.g. `sauna,parking`.
        - name: amenityCategory
          in: query
          schema:
            type: string
            enum: [health, wellness, dining, services, accessibility, parking, sport, children]
          description: >-
            Returns hotels that have any amenity in this category
            (e.g. `wellness`).
        - name: expand
          in: query
          schema:
            type: string
            enum: [roomTypes]
          description: >-
            **Draft:** This expansion is still in progress. Set to `roomTypes`
            to embed each hotel's room types in the response (otherwise fetch
            them separately via `GET /room-types?hotelId={hotelId}`). Its
            response shape may change before it is finalized.
      responses:
        "200":
          description: A paginated list of hotels.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelsList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /hotels/{hotelId}:
    get:
      tags: [Hotels]
      summary: Get a hotel
      operationId: getHotel
      x-mint:
        content: |
          <Warning>
            **Draft:** The `roomTypes` response field and `expand=roomTypes`
            behavior are still in progress. Their response shape may change
            before they are finalized.
          </Warning>
      description: |
        Returns a single hotel with its localized content, complete structured
        profile, and amenities by id.

        See the [Hotel](/api/objects/hotel) object for the full field
        reference, including the allowed values for `serviceMethod`,
        `indications`, and `staffLanguages`.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: hotelId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: Hotel id.
        - name: expand
          in: query
          schema:
            type: string
            enum: [roomTypes]
          description: >-
            **Draft:** This expansion is still in progress. Set to `roomTypes`
            to embed the hotel's room types in the response (otherwise fetch
            them separately via `GET /room-types?hotelId={hotelId}`). Its
            response shape may change before it is finalized.
      responses:
        "200":
          description: The hotel.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
            X-SpaPortal-Amenities-Version:
              $ref: "#/components/headers/AmenitiesVersion"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /room-types:
    get:
      tags: [Room types]
      summary: List room types
      operationId: getRoomTypes
      x-mint:
        content: |
          <Warning>
            **Draft:** This endpoint is still in progress. Its parameters and
            response shape may change before it is finalized.
          </Warning>
      description: |
        Returns room types of active hotels across the companies your public
        key is scoped to. Localized fields (`category`, `description`) return
        the locale keys selected by `Accept-Language`.

        See the [Room type](/api/objects/room-type) object for the full field reference.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
          description: Number of records to return. See [Pagination](/api/pagination).
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 2000
          description: Cursor from the previous page's `pagination.nextCursor`. See [Pagination](/api/pagination).
        - name: hotelId
          in: query
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: Filter by hotel id.
        - name: beds
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
          description: Filter by number of beds.
        - name: code
          in: query
          schema:
            type: string
            maxLength: 200
          description: Filter by exact room type code.
        - name: search
          in: query
          schema:
            type: string
            maxLength: 200
          description: >-
            Full-text search of the localized category name across all supported
            languages (case- and diacritics-insensitive). To match a code, use
            `code`.
        - name: expand
          in: query
          schema:
            type: string
            enum: [hotel]
          description: Set to `hotel` to embed the hotel in each room type.
        - name: sort
          in: query
          schema:
            type: string
            enum: ["createdAt:desc", "createdAt:asc"]
            default: "createdAt:desc"
          description: Sort order. Ties are broken by `id`.
      responses:
        "200":
          description: A paginated list of room types.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomTypesList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /room-types/{roomTypeId}:
    get:
      tags: [Room types]
      summary: Get a room type
      operationId: getRoomType
      x-mint:
        content: |
          <Warning>
            **Draft:** This endpoint is still in progress. Its parameters and
            response shape may change before it is finalized.
          </Warning>
      description: |
        Returns a single room type by id.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/RequestId"
        - name: roomTypeId
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: Room type id.
        - name: expand
          in: query
          schema:
            type: string
            enum: [hotel]
          description: Set to `hotel` to embed the hotel.
      responses:
        "200":
          description: The room type.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
      description: Optional client-provided request identifier echoed in error responses.
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        example: cs-CZ,de
      description: >-
        Comma-separated BCP 47 language tags selecting which locale keys
        localized fields return. When omitted, all locale keys are returned.
        See [Localization](/api/localization) for details.
  securitySchemes:
    spaPortalPublicKey:
      type: apiKey
      in: header
      name: X-SpaPortal-Public-Key
      description: "See [Authentication](/api/authentication) for how to obtain and send your public key."
  responses:
    BadRequest:
      description: Invalid request.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Invalid API key.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current state or scoped context.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Resource exists but cannot be used for this request.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected server error.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  headers:
    ContentLanguage:
      description: Comma-separated locale keys included in localized fields.
      schema:
        type: string
        example: cs-CZ,de
    ETag:
      description: >-
        Entity tag of this amenity-dictionary variant. Send it back in
        `If-None-Match` to revalidate a cached copy.
      schema:
        type: string
        example: '"9f3c2a7d81b04e55-cs-CZ_de"'
    AmenitiesVersion:
      description: >-
        Current amenity dictionary version. The value changes only when the
        dictionary content changes. Refetch `GET /amenity-categories` when it
        differs from the version you cached.
      schema:
        type: string
        example: 9f3c2a7d81b04e55
    RequestId:
      description: Request identifier for support and debugging.
      schema:
        type: string
  schemas:
    CalendarDatesBulkRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        shared:
          $ref: "#/components/schemas/CalendarDatesBulkQuery"
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/CalendarDatesBulkQueryWithKey"
    CalendarDatesBulkQuery:
      type: object
      additionalProperties: false
      properties:
        visitTypeId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Visit type id.
          nullable: true
        hotelId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Hotel id.
          nullable: true
        roomTypeId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Room type id.
          nullable: true
        destinationId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Destination id.
          nullable: true
        guests:
          type: integer
          minimum: 1
          maximum: 2
          nullable: true
        dateFrom:
          type: string
          format: date
          nullable: true
        dateTo:
          type: string
          format: date
          nullable: true
    CalendarDatesBulkQueryWithKey:
      type: object
      additionalProperties: false
      properties:
        visitTypeId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Visit type id.
          nullable: true
        hotelId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Hotel id.
          nullable: true
        roomTypeId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Room type id.
          nullable: true
        destinationId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          description: Destination id.
          nullable: true
        guests:
          type: integer
          minimum: 1
          maximum: 2
          nullable: true
        dateFrom:
          type: string
          format: date
          nullable: true
        dateTo:
          type: string
          format: date
          nullable: true
        key:
          type: string
          minLength: 1
          maxLength: 100
          description: Optional client key returned with the matching result.
    CalendarDatesBulkResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [key, data]
            properties:
              key:
                type: string
                nullable: true
              data:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarDate"
    CalendarDate:
      type: object
      required: [date, selectable, availability, price]
      properties:
        date:
          type: string
          format: date
        selectable:
          type: boolean
          nullable: true
        availability:
          type: string
          enum: [NOT_AVAILABLE, AVAILABLE, ON_DEMAND]
        price:
          allOf:
            - $ref: "#/components/schemas/CalendarDatePrice"
          nullable: true
    CalendarDatePrice:
      type: object
      required: [isFinal, amounts]
      properties:
        isFinal:
          type: boolean
        amounts:
          type: object
          properties:
            CZK:
              allOf:
                - $ref: "#/components/schemas/Money"
              nullable: true
            EUR:
              allOf:
                - $ref: "#/components/schemas/Money"
              nullable: true
    Money:
      type: object
      required: [amountMinor, currency, currencyExponent]
      properties:
        amountMinor:
          type: integer
          description: Amount in the smallest currency unit.
          example: 180000
        currency:
          type: string
          enum: [CZK, EUR]
        currencyExponent:
          type: integer
          enum: [2]
          description: Decimal exponent for the currency.
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - missing_authentication
                - invalid_authentication
                - insufficient_scope
                - not_found
                - conflict
                - rate_limited
                - internal_error
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
            requestId:
              type: string
    LocalizedString:
      type: object
      additionalProperties: false
      properties:
        cs-CZ:
          type: string
          nullable: true
        de:
          type: string
          nullable: true
        en:
          type: string
          nullable: true
        ru:
          type: string
          nullable: true
      description: >-
        Localized field keyed by supported response locale (`cs-CZ`, `de`, `en`,
        `ru`). When `Accept-Language` is set, only the matched keys are returned.
      example:
        cs-CZ: Český text
        de: Deutscher Text
    HotelNameLocalizedString:
      type: object
      additionalProperties: false
      properties:
        cs-CZ:
          type: string
          minLength: 1
        de:
          type: string
          minLength: 1
        en:
          type: string
          minLength: 1
        ru:
          type: string
          minLength: 1
      description: >-
        Localized hotel name keyed by supported response locale (`cs-CZ`, `de`,
        `en`, `ru`). Missing requested translations fall back to the Czech name,
        so every returned value is a non-empty string.
      example:
        cs-CZ: Spa Resort Pawlik
        de: Kurhotel Pawlik
    Image:
      type: object
      required: [url, thumbnailUrl]
      properties:
        url:
          type: string
          description: Original image URL.
        thumbnailUrl:
          type: string
          nullable: true
          description: Generated preview image URL, or null when unavailable.
    RoomType:
      type: object
      description: >-
        **Draft:** The room-type resource is still in progress. Its response
        shape may change before it is finalized.
      required:
        - id
        - hotelId
        - code
        - category
        - beds
        - facilities
        - images
        - description
      properties:
        id:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          example: 66f16191f739705faa020003
        hotelId:
          type: string
          pattern: "^[0-9a-fA-F]{24}$"
          example: 66f16191f739705faa020001
        code:
          type: string
          nullable: true
          example: SUPERIOR-DBL
        category:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized category name (plain text).
        beds:
          type: integer
          example: 2
        facilities:
          type: array
          items:
            type: string
          example: [shower, toilet]
        images:
          type: array
          items:
            $ref: "#/components/schemas/Image"
        description:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: Localized description (Markdown).
        hotel:
          type: object
          description: Embedded only when `expand=hotel`.
          required: [id, name, stars]
          properties:
            id:
              type: string
              pattern: "^[0-9a-fA-F]{24}$"
              example: 66f16191f739705faa020001
            name:
              allOf:
                - $ref: "#/components/schemas/HotelNameLocalizedString"
              description: >-
                Localized hotel name. Falls back to the default locale (cs-CZ),
                so it is never null.
              example:
                cs-CZ: Pawlik
                de: Pawlik-Aquaforum
            stars:
              type: integer
              nullable: true
              minimum: 1
              maximum: 5
              example: 4
      example:
        id: 66f16191f739705faa020003
        hotelId: 66f16191f739705faa020001
        code: SUPERIOR-DBL
        category:
          cs-CZ: Superior dvoulůžkový pokoj
          de: Superior Doppelzimmer
          en: Superior double room
          ru: Улучшенный двухместный номер
        beds: 2
        facilities: [shower, toilet]
        images:
          - url: https://cdn.example.com/rooms/superior.jpg
            thumbnailUrl: https://cdn.example.com/rooms/superior-thumbnail.jpg
        description:
          cs-CZ: Prostorný pokoj s vlastní koupelnou.
          de: Geräumiges Zimmer mit eigenem Bad.
          en: Spacious room with a private bathroom.
          ru: Просторный номер с собственной ванной комнатой.
    Pagination:
      type: object
      required: [limit, nextCursor, hasMore, total]
      properties:
        limit:
          type: integer
          example: 25
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to fetch the next page. Null on the last page.
        hasMore:
          type: boolean
        total:
          type: integer
          description: Total number of matching records across all pages.
    RoomTypesList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RoomType"
        pagination:
          $ref: "#/components/schemas/Pagination"
    HotelAddress:
      type: object
      required: [addressLine, city, postalCode, country]
      properties:
        addressLine:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
          pattern: "^[a-z]{3}$"
          description: Lowercase ISO 3166-1 alpha-3 country code.
          example: cze
    HotelTimeRange:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "14:00"
        to:
          type: string
          nullable: true
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          example: "22:00"
    HotelChildrenPolicy:
      type: object
      required: [allowed, minimumAge]
      properties:
        allowed:
          type: boolean
        minimumAge:
          type: integer
          minimum: 0
          maximum: 18
          nullable: true
    HotelPetFee:
      type: object
      required: [czk, eur]
      properties:
        czk:
          type: number
          minimum: 0
          nullable: true
          description: Per-night fee in Czech koruna major units.
        eur:
          type: number
          minimum: 0
          nullable: true
          description: Per-night fee in euro major units.
    HotelPetPolicy:
      type: object
      required: [allowed, minimumNights, feePerNight, conditions]
      properties:
        allowed:
          type: boolean
        minimumNights:
          type: integer
          minimum: 0
          nullable: true
        feePerNight:
          $ref: "#/components/schemas/HotelPetFee"
        conditions:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized supplementary conditions for guests with pets. Each
            locale value is at most 300 characters.
    HotelAccommodationRules:
      type: object
      required: [checkIn, checkOut, children, pets]
      properties:
        checkIn:
          $ref: "#/components/schemas/HotelTimeRange"
        checkOut:
          $ref: "#/components/schemas/HotelTimeRange"
        children:
          $ref: "#/components/schemas/HotelChildrenPolicy"
        pets:
          $ref: "#/components/schemas/HotelPetPolicy"
    HotelChannelContent:
      type: object
      required: [tagline]
      properties:
        tagline:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized tagline intended for sales channels. Each locale value
            is at most 100 characters.
    HotelMealService:
      type: object
      required:
        - enabled
        - servingTime
        - serviceMethod
        - drinksIncluded
        - drinksNote
      properties:
        enabled:
          type: boolean
        servingTime:
          $ref: "#/components/schemas/HotelTimeRange"
        serviceMethod:
          type: string
          nullable: true
          enum: [buffet, served]
        drinksIncluded:
          type: boolean
        drinksNote:
          allOf:
            - $ref: "#/components/schemas/LocalizedString"
          description: >-
            Localized note about included drinks. Each locale value is at
