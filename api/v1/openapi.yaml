openapi: 3.0.3
info:
  title: SpaPortal API v1
  version: "1.0"
  description: Public API for booking clients that integrate with SpaPortal.
servers:
  - url: https://spaportal.cz/api/v1
    description: Production
  - url: https://staging.spaportal.cz/api/v1
    description: Staging
security:
  - bearerAuth: []
  - accessTokenQuery: []
tags:
  - name: System
  - name: Catalog
  - name: Availability
  - name: Pricing
  - name: Booking
paths:
  /check:
    get:
      tags: [System]
      summary: Check API status
      operationId: checkApiStatus
      security: []
      responses:
        "200":
          description: API status.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /destinations:
    get:
      tags: [Catalog]
      summary: Get destinations
      operationId: getDestinations
      x-mint:
        href: /api/v1/reference/get-destinations
      description: Returns all destinations available to the authenticated API key.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Destinations available to the API key.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Destination"
              examples:
                default:
                  $ref: "#/components/examples/DestinationsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hotels:
    get:
      tags: [Catalog]
      summary: Get hotels
      operationId: getHotels
      description: |
        Returns hotels matching the supplied filters.

        `lowest_price` is the cheapest matching room price per night per guest. When a two-bed room is priced per room, the API returns the per-guest display price.

        `stars`, `image`, and `thumbnail` can be `null`. Set `include_room_types=false` when you do not need nested room type data.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Offset"
        - name: destination_id
          in: query
          schema:
            type: integer
          description: Filter by destination ID.
        - name: visit_type_id
          in: query
          schema:
            type: integer
          description: Filter by visit type ID.
        - name: number_of_beds
          in: query
          schema:
            type: integer
            minimum: 1
          description: Filter by room occupancy.
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: include_room_types
          in: query
          schema:
            type: boolean
            default: true
          description: Include room types in the hotel response.
      responses:
        "200":
          description: Hotels matching the filters.
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hotel"
              examples:
                default:
                  $ref: "#/components/examples/HotelsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /hotels/{hotelId}:
    get:
      tags: [Catalog]
      summary: Get hotel
      operationId: getHotel
      description: |
        Returns one hotel by ID.

        The `lowest_price` semantics match `GET /hotels`: the value is a per-night, per-guest display price for the cheapest matching room.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: hotelId
          in: path
          required: true
          schema:
            type: integer
          description: Hotel ID.
        - name: visit_type_id
          in: query
          schema:
            type: integer
          description: Filter room and price data by visit type ID.
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Hotel detail.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
              examples:
                default:
                  $ref: "#/components/examples/HotelResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /visit-types:
    get:
      tags: [Catalog]
      summary: Get visit types
      operationId: getVisitTypes
      description: |
        Returns visit types matching the supplied filters.

        `reservation_time_span` can be `DAYS` or `WEEKS`. `procedure_frequency` can be `DAY`, `WEEK`, or `VISIT`.

        Each visit type can include applicable loyalty programs and hotel-level lowest prices.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Offset"
        - name: hotel_id
          in: query
          schema:
            type: integer
          description: Filter by hotel ID.
        - name: destination_id
          in: query
          schema:
            type: integer
          description: Filter by destination ID.
        - name: hotel_stars_min
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Minimum hotel star rating.
        - name: hotel_stars_max
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Maximum hotel star rating.
        - name: number_of_beds
          in: query
          schema:
            type: integer
            minimum: 1
          description: Filter by room occupancy.
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - name: nights_min
          in: query
          schema:
            type: integer
          description: Minimum number of nights.
        - name: nights_max
          in: query
          schema:
            type: integer
          description: Maximum number of nights.
      responses:
        "200":
          description: Visit types matching the filters.
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisitType"
              examples:
                default:
                  $ref: "#/components/examples/VisitTypesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /visit-type-categories:
    get:
      tags: [Catalog]
      summary: Get visit type categories
      operationId: getVisitTypeCategories
      description: Returns visit type categories. Set `include_visit_types=true` to include visit types inside each category.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Offset"
        - name: destination_id
          in: query
          schema:
            type: integer
          description: Filter by destination ID.
        - name: number_of_beds
          in: query
          schema:
            type: integer
            minimum: 1
          description: Filter nested visit types by room occupancy.
        - name: include_visit_types
          in: query
          schema:
            type: boolean
            default: false
          description: Include matching visit types under each category.
      responses:
        "200":
          description: Visit type categories.
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisitTypeCategory"
              examples:
                default:
                  $ref: "#/components/examples/VisitTypeCategoriesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /visit-type-categories/{categoryId}:
    get:
      tags: [Catalog]
      summary: Get visit type category
      operationId: getVisitTypeCategory
      description: Returns one visit type category by ID. Set `include_visit_types=true` to include visit types inside the category.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
          description: Visit type category ID.
        - name: include_visit_types
          in: query
          schema:
            type: boolean
            default: false
          description: Include matching visit types in the category.
      responses:
        "200":
          description: Visit type category detail.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitTypeCategory"
              examples:
                default:
                  $ref: "#/components/examples/VisitTypeCategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /tags:
    get:
      tags: [Catalog]
      summary: Get tags
      operationId: getTags
      description: Returns tags used to label visit types with commercial or marketing metadata.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Tags available to the API key.
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
              examples:
                default:
                  $ref: "#/components/examples/TagsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /loyalty-programs:
    get:
      tags: [Catalog]
      summary: Get loyalty programs
      operationId: getLoyaltyPrograms
      description: |
        Returns loyalty programs available to the authenticated API key.

        For shared API keys spanning multiple companies, duplicate programs with the same `id` and localized `name` are deduplicated.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/Max"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Loyalty programs available to the API key.
          headers:
            X-Total-Count:
              $ref: "#/components/headers/XTotalCount"
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoyaltyProgram"
              examples:
                default:
                  $ref: "#/components/examples/LoyaltyProgramsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /calendar/dates:
    get:
      tags: [Availability]
      summary: Get calendar dates
      operationId: getCalendarDates
      x-mint:
        href: /api/v1/reference/get-calendar-dates
      description: |
        Returns calendar dates with availability and price data.

        `selectable` indicates whether the user can start a booking on the date. `price` is `null` when the date is not available or when the query is not specific enough to calculate a final price.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: visit_type_id
          in: query
          schema:
            type: integer
          description: Visit type ID.
        - name: hotel_id
          in: query
          schema:
            type: integer
          description: Hotel ID.
        - name: room_type_id
          in: query
          schema:
            type: integer
          description: Room type ID.
        - name: destination_id
          in: query
          schema:
            type: integer
          description: Destination ID.
        - name: guests
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2
          description: Number of guests.
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Calendar dates with availability and optional price data.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarDate"
              examples:
                default:
                  $ref: "#/components/examples/CalendarDatesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /calendar/checkouts:
    get:
      tags: [Availability]
      summary: Get checkout dates
      operationId: getCalendarCheckouts
      description: |
        Returns possible checkout dates for a selected check-in date.

        When `room_type_id` or `hotel_id` is supplied, the response contains only checkout dates with available prices.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Check-in date in `YYYY-MM-DD` format.
        - name: visit_type_id
          in: query
          schema:
            type: integer
          description: Visit type ID.
        - name: hotel_id
          in: query
          schema:
            type: integer
          description: Hotel ID.
        - name: room_type_id
          in: query
          schema:
            type: integer
          description: Room type ID.
      responses:
        "200":
          description: Valid checkout dates.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
              examples:
                default:
                  $ref: "#/components/examples/CalendarCheckoutsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /price:
    get:
      tags: [Pricing]
      summary: Get price
      operationId: getPrice
      x-mint:
        href: /api/v1/reference/get-price
      description: Returns the final price for a concrete visit type, room type, arrival date, and departure date. Loyalty program IDs can apply guest-level discounts.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: visit_type_id
          in: query
          required: true
          schema:
            type: integer
          description: Visit type ID.
        - name: room_type_id
          in: query
          required: true
          schema:
            type: integer
          description: Room type ID.
        - name: date_from
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Arrival date in `YYYY-MM-DD` format.
        - name: date_to
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Departure date in `YYYY-MM-DD` format.
        - name: guest_1_loyalty_program_id
          in: query
          schema:
            type: integer
          description: Optional loyalty program ID for the first guest.
        - name: guest_2_loyalty_program_id
          in: query
          schema:
            type: integer
          description: Optional loyalty program ID for the second guest.
      responses:
        "200":
          description: Final price by language.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceByLanguage"
              examples:
                default:
                  $ref: "#/components/examples/PriceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /lowest-price:
    get:
      tags: [Pricing]
      summary: Get lowest price
      operationId: getLowestPrice
      description: Returns the lowest per-night, per-guest display price for a partial or complete search query.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: visit_type_id
          in: query
          schema:
            type: integer
          description: Visit type ID.
        - name: hotel_id
          in: query
          schema:
            type: integer
          description: Hotel ID.
        - name: destination_id
          in: query
          schema:
            type: integer
          description: Destination ID.
        - name: room_type_id
          in: query
          schema:
            type: integer
          description: Room type ID.
        - name: number_of_beds
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2
          description: Filter by occupancy.
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Lowest matching price by language.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LowestPriceByLanguage"
              examples:
                default:
                  $ref: "#/components/examples/LowestPriceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /price-lists:
    get:
      tags: [Pricing]
      summary: Get price lists
      operationId: getPriceLists
      description: |
        Returns price lists for the supplied filters.

        The response includes price per night and, when `nights` is supplied, total price for the requested stay length.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: visit_type_id
          in: query
          schema:
            type: integer
          description: Filter by visit type ID.
        - name: hotel_id
          in: query
          schema:
            type: integer
          description: Filter by hotel ID.
        - name: beds
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 2
          description: Filter by room occupancy.
        - name: nights
          in: query
          schema:
            type: integer
          description: Filter by number of nights.
        - name: max_nested
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Maximum number of nested items to return.
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Price list data.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceList"
              examples:
                default:
                  $ref: "#/components/examples/PriceListsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /booking:
    get:
      tags: [Booking]
      summary: Get booking configuration
      operationId: getBookingConfiguration
      x-mint:
        href: /api/v1/reference/get-booking-configuration
      description: |
        Matches partial booking parameters such as destination name, visit type name, hotel name, room type category, and dates.

        The response can contain any matched destination, visit type, hotel, room type, price, lowest price, and availability. If the query is incomplete or ambiguous, some fields can be omitted or `availability` can be `null`.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
        - name: destination_name
          in: query
          schema:
            type: string
          description: Destination name in any supported language.
        - name: visit_type_name
          in: query
          schema:
            type: string
          description: Visit type name in any supported language.
        - name: hotel_name
          in: query
          schema:
            type: string
          description: Hotel name in any supported language.
        - name: room_type_category
          in: query
          schema:
            type: string
          description: Room type category in any supported language.
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
      responses:
        "200":
          description: Matched booking configuration, availability, and price data.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingConfiguration"
              examples:
                default:
                  $ref: "#/components/examples/BookingConfigurationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
    post:
      tags: [Booking]
      summary: Create booking
      operationId: createBooking
      description: |
        Creates a booking or a non-binding booking request.

        When `binding_booking` is `false`, SpaPortal creates a non-binding request and an operator can contact the customer later. When `binding_booking` is `true`, the billed contact must include an address.

        The first `Accept-Language` value determines the customer communication language for automated emails.
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCreateRequest"
            examples:
              default:
                $ref: "#/components/examples/BookingCreateRequest"
      responses:
        "200":
          description: Created booking or booking request.
          headers:
            Content-Language:
              $ref: "#/components/headers/ContentLanguage"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCreateResponse"
              examples:
                default:
                  $ref: "#/components/examples/BookingCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Multiple companies matched the booking payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    accessTokenQuery:
      type: apiKey
      in: query
      name: access_token

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema:
        type: string
        example: cs_CZ,de
      description: Comma-separated list of languages to include.
    Max:
      name: max
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: Number of records to return.
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Number of records to skip.
    DateFrom:
      name: date_from
      in: query
      schema:
        type: string
        format: date
      description: Start date in `YYYY-MM-DD` format.
    DateTo:
      name: date_to
      in: query
      schema:
        type: string
        format: date
      description: End date in `YYYY-MM-DD` format.

  headers:
    XTotalCount:
      description: Total number of matching records.
      schema:
        type: integer
    ContentLanguage:
      description: Languages included in the response.
      schema:
        type: string
        example: cs_CZ,de

  examples:
    DestinationsResponse:
      summary: Destination list
      value:
        - _id: 66f16191f739705faa020001
          id: 1
          name:
            cs_CZ: Frantiskovy Lazne
            de: Franzensbad
            en: Frantiskovy Lazne
            ru: Frantiskovy Lazne

    HotelsResponse:
      summary: Hotel list
      value:
        - _id: 66f16191f739705faa020002
          id: 1
          name: Pawlik
          stars: 4
          phone_number: "+420 354 201 111"
          email:
            cs_CZ: info@frantiskovylazne.cz
            de: info@franzensbad.cz
          description:
            cs_CZ: Kralovska vila mesta Frantiskovy Lazne uprostred lazenskeho parku.
            de: Die Koenigsvilla Franzensbads im Zentrum der Stadt.
          equipment:
            cs_CZ: Hotel je vybaven moderni saunou.
            de: Hotel hat eine Sauna.
          services:
