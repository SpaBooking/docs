          $ref: "#/components/schemas/PriceByLanguage"
        lowest_price:
          $ref: "#/components/schemas/LowestPriceByLanguage"

    BookingCreateRequest:
      type: object
      required:
        - visit_type_id
        - hotel_id
        - room_type_id
        - date_from
        - date_to
        - billed_to
        - guests
      properties:
        binding_booking:
          type: boolean
          default: false
        currency:
          type: string
          enum: [CZK, EUR]
          default: CZK
        visit_type_id:
          type: integer
        hotel_id:
          type: integer
        room_type_id:
          type: integer
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        customer_note:
          type: string
          nullable: true
        affilUserName:
          type: string
          nullable: true
        billed_to:
          $ref: "#/components/schemas/BilledTo"
        guests:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/BookingGuest"

    BilledTo:
      type: object
      required: [gender, first_name, last_name, email, phone, consent_marketing]
      properties:
        gender:
          type: string
          enum: [male, female]
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        consent_marketing:
          type: boolean
        address:
          type: object
          nullable: true
          properties:
            street:
              type: string
            house_number:
              type: string
            city:
              type: string
            zip_code:
              type: string
            country:
              type: string
              maxLength: 3

    BookingGuest:
      type: object
      required: [gender, first_name, last_name, birth_date]
      properties:
        gender:
          type: string
          enum: [male, female]
        first_name:
          type: string
        last_name:
          type: string
        birth_date:
          type: string
          format: date
        loyalty_program_id:
          type: integer
          nullable: true
        loyalty_program_code:
          type: string
          nullable: true

    BookingCreateResponse:
      type: object
      additionalProperties: true
      properties:
        _id:
          $ref: "#/components/schemas/MongoObjectId"
        id:
          oneOf:
            - type: integer
            - type: string
